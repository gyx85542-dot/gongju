<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API 设置</title>
    <script>
        (function(){
            try {
                localStorage.setItem('studio_theme', 'light');
                localStorage.setItem('canvas_theme', 'light');
                document.documentElement.classList.add('studio-theme-dark');
                document.documentElement.classList.add('theme-dark');
            } catch(e) {}
        })();
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="/static/theme.js?v=20260520-magnific-light"></script>
    <script src="/static/i18n.js?v=20260520-board-pick"></script>
    <link rel="stylesheet" href="/static/studio-magnific.css?v=20260520-ui-fix">
    <link rel="stylesheet" href="/static/settings-magnific.css?v=20260530-rh-ui">
    <link rel="stylesheet" href="/static/theme.css?v=20260520-panel-26">
    <link rel="stylesheet" href="/static/studio-pullup-select.css?v=20260530-pullup-select">
    <script src="/static/studio-provider-label.js?v=20260530-provider-sync"></script>
    <script src="/static/studio-api-providers.js?v=20260530-provider-sync"></script>
    <script src="/static/studio-pullup-select.js?v=20260530-apimart-bear"></script>
    <style>
        /* 布局与结构；视觉（圆角/间距/hover）由 settings-magnific.css 统一 */
        * { box-sizing: border-box; }
        html { min-height: 100%; overflow-y: auto; overscroll-behavior: auto; }
        body {
            margin: 0;
            min-height: 100vh;
            overflow-y: auto;
            font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            -webkit-font-smoothing: antialiased;
            -webkit-overflow-scrolling: touch;
            overscroll-behavior: auto;
        }
        button { font-family: inherit; cursor: pointer; border: 0; background: transparent; color: inherit; }
        .page { min-height: 100vh; padding: 40px 32px 80px; }
        .wrap { max-width: 1100px; margin: 0 auto; }
        .page-head {
            padding: 0 4px 28px;
            display: flex;
            justify-content: space-between;
            align-items: end;
            gap: 24px;
            flex-wrap: wrap;
        }
        .page-head .title { font-size: 26px; line-height: 1.05; font-weight: 600; letter-spacing: -0.015em; }
        .page-head .sub { margin-top: 8px; font-size: 12.5px; line-height: 1.55; font-weight: 600; max-width: 520px; }
        .page-head .status { font-size: 11.5px; font-weight: 600; min-height: 16px; }
        .layout { display: grid; grid-template-columns: 260px minmax(0, 1fr); gap: 24px; align-items: start; }
        .sidebar {
            display: flex;
            flex-direction: column;
            position: sticky;
            top: 32px;
            max-height: calc(100vh - 64px);
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }
        .side-section-title { font-size: 11px; font-weight: 600; padding: 2px 4px; }
        .provider-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            margin-bottom: 6px;
        }
        .provider-card {
            width: 100%;
            text-align: left;
            border: 1px solid transparent;
            background: transparent;
            padding: 10px 12px;
            display: flex;
            align-items: center;
            gap: 10px;
            min-height: 48px;
        }
        .provider-card.provider-card-banner { padding: 10px 12px; justify-content: center; min-height: 44px; }
        .provider-card-banner img { height: 22px; width: auto; max-width: 100%; object-fit: contain; display: block; }
        .provider-card-banner .ms-icon-dark { display: none; }
        body.studio-theme-dark .provider-card-banner .ms-icon-light,
        html.studio-theme-dark body .provider-card-banner .ms-icon-light { display: none; }
        body.studio-theme-dark .provider-card-banner .ms-icon-dark,
        html.studio-theme-dark body .provider-card-banner .ms-icon-dark { display: block; }
        .provider-mark { width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; flex: 0 0 auto; }
        .provider-mark-emoji { font-size: 18px; line-height: 1; }
        .provider-name { min-width: 0; font-size: 12.5px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .provider-meta { margin-top: 2px; font-size: 10px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .add-btn, .api-link-btn { width: 100%; height: 40px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; font-size: 12px; font-weight: 600; text-decoration: none; }
        .content { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
        .content-head {
            display: flex;
            align-items: end;
            justify-content: space-between;
            gap: 16px;
            flex-wrap: wrap;
            padding: 18px 22px;
        }
        .content-head .editor-title { font-size: 22px; line-height: 1.1; font-weight: 600; letter-spacing: -0.01em; }
        .content-head .editor-sub { margin-top: 4px; font-size: 11.5px; font-weight: 600; }
        .content-actions { display: flex; gap: 10px; align-items: center; }
        .block { display: flex; flex-direction: column; gap: 14px; padding: 20px 22px; }
        .block-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap;
            padding-bottom: 14px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }
        .block-head > div { min-width: 0; flex: 1 1 280px; }
        .block-desc { font-size: 11.5px; line-height: 1.55; font-weight: 600; margin-top: 4px; max-width: 480px; }
        .form { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
        .field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
        .field.full { grid-column: 1 / -1; }
        .label { font-size: 11px; font-weight: 600; }
        .field-frame { display: flex; align-items: center; padding: 0 12px; min-height: 40px; }
        .field-frame.is-disabled { cursor: not-allowed; opacity: 0.55; }
        .field-frame input {
            width: 100%;
            height: 38px;
            padding: 0;
            border: 0;
            background: transparent;
            outline: none;
            font-size: 13px;
            font-weight: 600;
        }
        .field-frame input:disabled { cursor: not-allowed; }
        .hint { font-size: 11px; line-height: 1.5; font-weight: 600; }
        .key-row { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 10px; align-items: center; }
        .key-row .field-frame { width: 100%; }
        .verify-action-row { grid-column: 1 / -1; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
        .advanced-endpoints { grid-column: 1 / -1; display: none; padding: 14px; }
        .advanced-endpoints.open { display: block; }
        .endpoint-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .endpoint-help { margin-bottom: 10px; font-size: 11px; line-height: 1.55; font-weight: 600; }
        .endpoint-help code { padding: 2px 8px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 10.5px; }
        .key-btn { width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; flex: 0 0 auto; }
        .block.models-toolbar { flex-direction: row; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 20px 16px; }
        .models-toolbar > div:first-child { min-width: 0; flex: 1 1 320px; }
        .models-toolbar-actions { display: flex; gap: 10px; align-items: center; justify-content: flex-end; flex: 0 0 auto; }
        .model-grid { display: grid; grid-template-columns: 1fr; gap: 16px; }
        .model-list { display: flex; flex-direction: column; gap: 10px; }
        .model-row { display: grid; grid-template-columns: minmax(0, 1fr) 40px; align-items: center; gap: 8px; padding: 0 12px; min-height: 40px; }
        .model-row input { height: 38px; padding: 0; border: 0; background: transparent; font-size: 12.5px; font-weight: 600; outline: none; }
        .ms-lora-block { display: none; }
        body.show-ms .ms-lora-block { display: flex; }
        .lora-list { display: flex; flex-direction: column; gap: 10px; }
        .lora-row { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1.1fr) 86px 40px; gap: 10px; align-items: end; padding: 12px; }
        .lora-field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
        .lora-field span { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; }
        .icon-btn { width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; flex: 0 0 auto; }
        .ghost-btn, .action-btn { height: 36px; padding: 0 14px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; font-size: 12px; font-weight: 600; }
        .picker-overlay { display: none; position: fixed; inset: 0; z-index: 99; align-items: center; justify-content: center; padding: 32px; }
        .picker-modal { width: 100%; max-width: 780px; max-height: 90vh; display: flex; flex-direction: column; overflow: hidden; }
        .picker-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px 20px; border-bottom: 1px solid rgba(255, 255, 255, 0.08); }
        .picker-title { font-size: 15px; font-weight: 600; }
        .picker-count { font-size: 11px; font-weight: 600; margin-top: 2px; }
        .picker-close { width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
        .picker-toolbar { display: flex; align-items: center; gap: 10px; padding: 12px 20px; border-bottom: 1px solid rgba(255, 255, 255, 0.08); flex-wrap: wrap; }
        .picker-search { flex: 1; min-width: 160px; height: 36px; padding: 0 12px; outline: none; font-size: 12.5px; font-weight: 600; }
        .picker-cat-tabs { display: flex; gap: 4px; padding: 4px; }
        .picker-cat-tab { height: 30px; padding: 0 12px; display: inline-flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 600; cursor: pointer; border: 1px solid transparent; }
        .picker-cat-tab .cat-count { font-size: 10px; padding: 2px 6px; font-weight: 600; }
        .picker-body { flex: 1; overflow: auto; -webkit-overflow-scrolling: touch; padding: 8px 12px 12px; }
        .picker-row { display: flex; align-items: center; gap: 12px; padding: 11px 12px; border-bottom: 1px solid rgba(255, 255, 255, 0.06); cursor: pointer; }
        .picker-checkbox { width: 18px; height: 18px; display: flex; align-items: center; justify-content: center; flex: 0 0 auto; }
        .picker-checkbox svg { width: 12px; height: 12px; opacity: 0; }
        .picker-checkbox.checked svg { opacity: 1; }
        .picker-model-name { min-width: 0; flex: 1; font-size: 13px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
        .picker-row.has-sel .picker-model-name { font-weight: 700; }
        .picker-other-cats { display: flex; gap: 4px; flex: 0 0 auto; }
        .picker-other-tag { font-size: 9.5px; font-weight: 700; padding: 2px 6px; letter-spacing: 0.04em; }
        .picker-other-tag.cat-image { background: rgba(16, 185, 129, 0.14); color: #34d399; }
        .picker-other-tag.cat-chat { background: rgba(96, 165, 250, 0.14); color: #60a5fa; }
        .picker-other-tag.cat-video { background: rgba(251, 191, 36, 0.14); color: #fbbf24; }
        .picker-summary { display: flex; align-items: center; gap: 10px; padding: 12px 20px; font-size: 11.5px; font-weight: 600; flex-wrap: wrap; }
        .picker-summary-title { font-weight: 700; }
        .picker-sum-chip { display: inline-flex; align-items: center; gap: 5px; padding: 5px 12px; font-weight: 700; font-size: 11.5px; }
        .picker-foot { display: flex; align-items: center; justify-content: flex-end; gap: 10px; padding: 12px 20px; border-top: 1px solid rgba(255, 255, 255, 0.08); }
        .empty { padding: 18px; text-align: center; font-size: 11.5px; font-weight: 600; }
        @media (max-width: 860px) {
            .page { padding: 24px 16px 60px; }
            .layout { grid-template-columns: 1fr; gap: 20px; }
            .sidebar { position: static; max-height: none; }
            .form, .model-grid, .endpoint-grid { grid-template-columns: 1fr; }
            .models-toolbar { align-items: flex-start; flex-direction: column; }
            .models-toolbar-actions { width: 100%; justify-content: flex-end; }
            .lora-row { grid-template-columns: 1fr; }
            .lora-row .icon-btn { width: 100%; }
        }
    </style>
</head>
<body class="mg-studio theme-dark studio-theme-dark">
    <div class="page">
        <div class="wrap">
            <header class="page-head">
                <div>
                    <div class="title" data-i18n="api.title">API 设置</div>
                    <div class="sub" data-i18n="api.subtitle">管理平台地址、模型列表和 Key。Key 写入后端 env，页面不会回显完整内容。</div>
                </div>
                <div id="status" class="status"></div>
            </header>

            <div class="layout">
                <aside class="sidebar">
                    <div class="side-section-title" data-i18n="api.providersTitle">平台列表</div>
                    <div id="providerList" class="provider-list"></div>
                    <button class="add-btn" type="button" onclick="addProvider()"><i data-lucide="plus" class="w-4 h-4"></i><span data-i18n="api.addProvider">新增平台</span></button>
                </aside>

                <main class="content">
                    <div class="content-head">
                        <div>
                            <div id="editorTitle" class="editor-title" data-i18n="api.provider">平台</div>
                            <div class="editor-sub" data-i18n="api.editorSub">配置基础信息、API Key 和可用模型</div>
                        </div>
                        <div class="content-actions">
                            <button id="deleteBtn" class="action-btn danger-btn api-page-delete-btn" type="button" onclick="deleteProvider()"><i data-lucide="trash-2" class="w-3.5 h-3.5"></i><span data-i18n="api.delete">删除</span></button>
                            <button class="action-btn save-btn api-page-save-btn" type="button" onclick="saveProviders()"><i data-lucide="save" class="w-3.5 h-3.5"></i><span data-i18n="api.save">保存</span></button>
                        </div>
                    </div>

                    <section class="block">
                        <div class="block-head">
                            <div>
                                <div class="block-title" data-i18n="api.basicInfo">基本信息</div>
                                <div class="block-desc" data-i18n="api.basicHint">平台显示名、唯一 ID 和请求地址</div>
                            </div>
                        </div>
                        <div class="form">
                            <label class="field full" id="platformNameField">
                                <span class="label" data-i18n="api.platformName">平台名称</span>
                                <div class="field-frame"><input id="nameInput" type="text" placeholder="Comfly"></div>
                                <span class="hint"><span data-i18n="api.platformIdShown">平台 ID</span>: <span id="idPreview" style="font-family:ui-monospace,Menlo,monospace;color:var(--text)">—</span></span>
                                <input id="idInput" type="hidden">
                            </label>
                            <label class="field full" id="baseUrlField">
                                <span class="label" data-i18n="api.baseUrl">请求地址</span>
                                <div class="field-frame"><input id="baseInput" type="text" placeholder="https://ai.comfly.chat"></div>
</label>
                            <label class="field full">
                                <span class="label">API Key</span>
                                <div class="key-row" style="margin:0">
                                    <div class="field-frame" style="flex:1"><input id="keyInput" type="password"></div>
                                    <button class="key-btn" type="button" onclick="saveKeyOnly()" title="保存 Key"><i data-lucide="check" class="w-4 h-4"></i></button>
                                    <button class="key-btn key-clear" type="button" onclick="clearKeyOnly()" title="清除 Key"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                                </div>
                                <span id="keyHint" class="hint"></span>
</label>
                            <!-- 验证操作行 -->
                            <div class="verify-action-row">
                                <button id="testUrlBtn" class="action-btn" type="button" onclick="testConnection()">
                                    <i data-lucide="check-circle-2" class="w-3.5 h-3.5"></i><span data-i18n="api.testUrl">验证地址</span>
                                </button>
                                <button id="probeAsyncBtn" class="action-btn" type="button" onclick="probeAsync()">
                                    <i data-lucide="radar" class="w-3.5 h-3.5"></i><span>验证协议</span>
                                </button>
                                <div class="field-frame field-frame--select protocol-selector-wrap" style="flex-shrink:0">
                                    <select id="protocolInput" class="size-select">
                                        <option value="openai" data-i18n="api.protocolOpenAI">OpenAI 兼容</option>
                                        <option value="apimart" data-i18n="api.protocolApimart">APIMart 异步</option>
                                    </select>
                                </div>
                                <button id="advancedToggleBtn" class="action-btn" type="button" onclick="toggleAdvancedEndpoints()">
                                    <i data-lucide="sliders-horizontal" class="w-3.5 h-3.5"></i><span>高级设置</span>
                                </button>
                            </div>
                            <div id="advancedEndpoints" class="advanced-endpoints">
                                <div class="endpoint-help">
                                    留空即使用默认端口。请填写 <code>/v1/...</code> 格式，例如 <code>/v1/images/edits</code>。
                                </div>
                                <div class="endpoint-grid">
                                    <label class="field">
                                        <span class="label">文生图端口</span>
                                        <div class="field-frame"><input id="imageGenerationEndpointInput" type="text" placeholder="/v1/images/generations"></div>
                                    </label>
                                    <label class="field">
                                        <span class="label">图生图/编辑端口</span>
                                        <div class="field-frame"><input id="imageEditEndpointInput" type="text" placeholder="/v1/images/edits"></div>
                                    </label>
                                </div>
                            </div>
                            <div id="verifyResult" style="display:none;padding:2px 0;grid-column:1/-1"></div>
                        </div>
                    </section>

                    <div id="modelsHead" class="block models-toolbar">
                        <div>
                            <div class="block-title" data-i18n="api.modelsTitle">模型列表</div>
                            <div class="block-desc" data-i18n="api.modelsDesc">从上游 API 自动拉取所有可用模型并按类型分类（image / chat / video）</div>
                        </div>
                        <div class="models-toolbar-actions">
                            <button id="fetchModelsBtn" class="action-btn primary-btn" type="button" onclick="fetchModels()">
                                <i data-lucide="download-cloud" class="w-3.5 h-3.5"></i><span data-i18n="api.fetchModels">拉取模型</span>
                            </button>
                            <button id="openPickerBtn" class="action-btn" type="button" onclick="openModelPicker()" disabled style="opacity:.5">
                                <i data-lucide="list-checks" class="w-3.5 h-3.5"></i><span data-i18n="api.selectModels">选择模型</span>
                            </button>
                        </div>
                    </div>
                    <div class="model-grid">
                        <section class="block">
                            <div class="block-head">
                                <div>
                                    <div class="block-title" data-i18n="api.imageModels">生图模型</div>
                                    <div class="block-desc" data-i18n="api.imageHint">AI 生图 API 生成使用</div>
</div>
                                <button class="ghost-btn" type="button" onclick="addModel('image')"><i data-lucide="plus" class="w-3.5 h-3.5"></i><span data-i18n="api.model">模型</span></button>
                            </div>
                            <div id="imageModelList" class="model-list"></div>
                        </section>

                        <section class="block">
                            <div class="block-head">
                                <div>
                                    <div class="block-title" data-i18n="api.chatModels">聊天模型</div>
                                    <div class="block-desc" data-i18n="api.chatHint">GPT 对话和 LLM 节点使用</div>
                                </div>
                                <button class="ghost-btn" type="button" onclick="addModel('chat')"><i data-lucide="plus" class="w-3.5 h-3.5"></i><span data-i18n="api.model">模型</span></button>
                        </div>
                        <div id="chatModelList" class="model-list"></div>
                    </section>

                        <section class="block">
                            <div class="block-head">
                                <div>
                                    <div class="block-title" data-i18n="api.videoModels">视频模型</div>
                                    <div class="block-desc" data-i18n="api.videoHint">AI 视频生成使用</div>
                                </div>
                                <button class="ghost-btn" type="button" onclick="addModel('video')"><i data-lucide="plus" class="w-3.5 h-3.5"></i><span data-i18n="api.model">模型</span></button>
                            </div>
                            <div id="videoModelList" class="model-list"></div>
                        </section>
</div>

            </main>
        </div>
        </div>
    </div>

    <!-- 模型选择浮层 -->
    <div id="modelPickerOverlay" class="picker-overlay">
        <div class="picker-modal">
            <div class="picker-head">
                <div>
                    <div class="picker-title">从上游拉取的模型清单</div>
                    <div id="pickerCount" class="picker-count">—</div>
                </div>
                <div class="picker-close" onclick="closeModelPicker()"><i data-lucide="x" class="w-4 h-4"></i></div>
            </div>
            <div class="picker-toolbar">
                <input id="pickerFilter" class="picker-search" type="text" placeholder="按名称搜索模型…" oninput="renderModelPicker()">
                <div class="picker-cat-tabs">
                    <button class="picker-cat-tab active" data-cat="all" onclick="selectPickerCat('all')">全部 <span class="cat-count">0</span></button>
                    <button class="picker-cat-tab" data-cat="image" onclick="selectPickerCat('image')">生图 <span class="cat-count">0</span></button>
                    <button class="picker-cat-tab" data-cat="chat" onclick="selectPickerCat('chat')">LLM <span class="cat-count">0</span></button>
                    <button class="picker-cat-tab" data-cat="video" onclick="selectPickerCat('video')">视频 <span class="cat-count">0</span></button>
                </div>
            </div>
            <div id="pickerList" class="picker-body"></div>
            <div id="pickerSummary" class="picker-summary">
                <span class="picker-summary-title">将应用：</span>
                <span id="sumImage" class="picker-sum-chip picker-sum-chip-empty">生图 0</span>
                <span id="sumChat" class="picker-sum-chip picker-sum-chip-empty">聊天 0</span>
                <span id="sumVideo" class="picker-sum-chip picker-sum-chip-empty">视频 0</span>
                <span id="sumUnsel" style="margin-left:auto;color:var(--faint)">未选 0</span>
            </div>
            <div class="picker-foot">
                <button class="action-btn" type="button" onclick="closeModelPicker()">取消</button>
                <button class="action-btn save-btn" type="button" onclick="applyModelPicker()">应用到模型列表</button>
            </div>
        </div>
    </div>

    <script>
        const BUILTIN_APIMART_ID = 'apimart';
        const BUILTIN_APIMART_LOCKED_MODELS = {
            image: [
                'gpt-image-2',
                'gemini-3-pro-image-preview',
                'gemini-3.1-flash-image-preview',
            ],
            chat: [

        function refreshIcons(){ if(window.lucide) lucide.createIcons(); }

        function isBuiltinApimart(item){

        function applyBuiltinApimartLock(item){
            if(!item || !isBuiltinApimart(item)) return item;

                ...item,

        function normalizeProviders(list){

        function setBuiltinFieldsLocked(locked){

        function setStatus(text){ statusEl.textContent = text || ''; }
        function normalizeId(value){

        }
        // 平台 Key 按 ID 写入 API/.env；ID 一旦创建就保持稳定，避免改名或中文名称导致 Key 看起来丢失。
        function deriveIdFromName(name, existingId){
            if(existingId) return existingId;
            let id = normalizeId(name);
            if(!id){
                id = 'api-' + Math.random().toString(36).slice(2, 8);
            }
            let candidate = id, i = 2;
            while(providers.some(p => p.id === candidate)){
                candidate = `${id}-${i++}`;
            }
            return candidate;
        }
        function updateIdPreview(){
            const item = provider();

            idPreview.textContent = deriveIdFromName(nameInput.value, item.id);
        }
        function provider(){

        function unique(values){
            const seen = new Set();
            return values.map(v => String(v || '').trim()).filter(v => v && !seen.has(v) && seen.add(v));
        }
        function endpointValue(input){
            return String(input?.value || '').trim();
        }
        function toggleAdvancedEndpoints(force){

        }
        function normalizeEndpointSetting(value){
            const endpoint = String(value || '').trim();
            if(!endpoint) return '';
            if(/^https?:\/\//i.test(endpoint)) return endpoint.replace(/\/+$/, '');
            return endpoint;
        }
        function validateEndpointSetting(endpoint, label){
            if(!endpoint) return true;
            if(/\s/.test(endpoint)) throw new Error(`${label} 不能包含空格`);
            if(/^https?:\/\//i.test(endpoint)) return true;
            if(!endpoint.startsWith('/')) throw new Error(`${label} 请填写 /v1/... 格式，例如 /v1/images/edits`);
            return true;
        }
        function syncEditor(){
            const item = provider();
            if(!item) return;
            const key = keyInput.value.trim();
            if(key) item.api_key = key;
            if(isBuiltinApimart(item)){
                Object.assign(item, applyBuiltinApimartLock(item));
                return;
            }
            const oldId = item.id;
            const isBuiltin = item.id === 'comfly';
            // 内置和自定义平台的 ID 都保持稳定；新建时若没有 ID 才生成一次。
            const nextId = isBuiltin ? item.id : deriveIdFromName(nameInput.value, item.id);
            item.id = nextId;
            if(oldId !== item.id) selectedId = item.id;
            item.name = nameInput.value.trim() || item.id;
            item.base_url = baseInput.value.trim();
            item.protocol = protocolInput?.value || 'openai';
            item.image_generation_endpoint = normalizeEndpointSetting(endpointValue(imageGenerationEndpointInput));
            item.image_edit_endpoint = normalizeEndpointSetting(endpointValue(imageEditEndpointInput));
        }
        function sortedProviders(){
            const order = [BUILTIN_APIMART_ID, 'comfly'];
            return [...providers].sort((a, b) => {
                const ai = order.indexOf(a.id);
                const bi = order.indexOf(b.id);
                if(ai === -1 && bi === -1) return 0;
                if(ai === -1) return 1;
                if(bi === -1) return -1;
                return ai - bi;
            });
        }
        function renderProviderList(){
            providerList.innerHTML = sortedProviders().map(item => {
                const active = item.id === selectedId ? 'active' : '';
                const builtin = isBuiltinApimart(item);

                    : (item.base_url || '未配置地址');

                return `

        function renderEditor(){
            const item = provider();
            if(!item) return;
            if(isBuiltinApimart(item)) Object.assign(item, applyBuiltinApimartLock(item));
            const locked = isBuiltinApimart(item);

        function showVerifyResult(html){ const el = document.getElementById('verifyResult'); if(el){ el.style.display = 'block'; el.innerHTML = html; } }

        async function probeAsync(){
            const item = provider();
            if(!item) return;
            const btn = document.getElementById('probeAsyncBtn');
            const baseUrl = baseInput.value.trim();
            if(!baseUrl){ alert('请先填写请求地址'); return; }
            if(btn){ btn.disabled = true; btn.querySelector('span').textContent = '检测中...'; }
            showVerifyResult(`<span style="color:var(--muted);font-size:11px;font-weight:700">正在检测协议类型...</span>`);
            try {
                const apiKey = keyInput.value.trim();
                const data = await fetch('/api/providers/probe-async', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ base_url: baseUrl, api_key: apiKey, provider_id: item.id })
                }).then(async r => {
                    if(!r.ok) throw new Error((await r.json()).detail || '请求失败');
                    return r.json();
                });
                const isAsync = data.ok === true;
                // 自动设置协议下拉
                if(protocolInput){
                    protocolInput.value = isAsync ? 'apimart' : 'openai';
                    // 触发 change 以便其他地方同步
                    protocolInput.dispatchEvent(new Event('change'));
                }
                const rawJson = JSON.stringify(data.raw, null, 2);
                const color = isAsync ? '#15803d' : data.ok === null ? '#b45309' : '#64748b';
                const icon = isAsync ? '✓' : '⚠';
                const proto = isAsync ? 'APIMart 异步' : 'OpenAI 兼容';
                showVerifyResult(`
                    <div style="font-size:11px;font-weight:800;color:${color}">${icon} ${escapeHtml(data.message)}</div>
                    <div style="font-size:11px;color:var(--muted);font-weight:700;margin-top:2px">协议已自动设置为：<strong style="color:var(--text)">${proto}</strong></div>
                    <details style="margin-top:6px">
                        <summary style="font-size:10.5px;color:var(--muted);cursor:pointer;font-weight:700;user-select:none">▸ 查看原始响应 (HTTP ${data.status_code})</summary>
                        <pre style="margin-top:6px;padding:10px 12px;border-radius:5px;background:var(--soft);border:1px solid var(--line-2);font-size:10.5px;font-family:ui-monospace,Menlo,monospace;white-space:pre-wrap;word-break:break-all;color:var(--text);max-height:200px;overflow:auto">${escapeHtml(rawJson)}</pre>
                    </details>`);
            } catch(e){
                if(protocolInput){ protocolInput.value = 'openai'; protocolInput.dispatchEvent(new Event('change')); }
                showVerifyResult(`<div style="font-size:11px;font-weight:800;color:#b45309">⚠ ${escapeHtml(e.message || String(e))}，协议已设为 OpenAI 兼容</div>`);
            } finally {
                if(btn){ btn.disabled = false; btn.querySelector('span').textContent = '验证协议'; refreshIcons(); }
            }
        }

        async function testConnection(){
            const item = provider();
            if(!item) return;
            const btn = document.getElementById('testUrlBtn');
            const baseUrl = baseInput.value.trim();
            if(!baseUrl){ alert('请先填写请求地址'); return; }
            if(btn){ btn.disabled = true; btn.querySelector('span').textContent = tr('api.testingUrl') || '验证中...'; }
            showVerifyResult(`<span style="color:var(--muted);font-size:11px;font-weight:700">验证中...</span>`);
            try {
                const apiKey = keyInput.value.trim();
                const data = await fetch('/api/providers/test-connection', {
                    method: 'POST', headers: {'Content-Type':'application/json'},
                    body: JSON.stringify({ base_url: baseUrl, api_key: apiKey, provider_id: item.id })
                }).then(async r => {
                    if(!r.ok) throw new Error((await r.json()).detail || (tr('api.urlInvalid') || '验证失败'));
                    return r.json();
                });
                if(data.ok){
                    // 存入 picker 状态并启用「选择模型」按钮，但不自动弹出
                    lastFetchedAll = data.all || [];

                } else {
                    showVerifyResult(`

                }
            } catch(e){
                showVerifyResult(`<div style="font-size:11px;font-weight:800;color:#b45309">⚠ ${escapeHtml(e.message || String(e))}</div>`);
            } finally {
                if(btn){ btn.disabled = false; btn.querySelector('span').textContent = tr('api.testUrl') || '验证地址'; }
            }
        }
        let lastFetchedAll = [];          // 全部模型 id 列表
        let lastFetchedSuggestion = null; // 后端自动分类建议

        async function fetchModels(){

                }).then(async r => {

                lastFetchedAll = data.all || [];

        // —— 模型选择器浮层 ——
        // 每个模型只归一类（根据用户已配置 或 关键字猜测）；勾选 = 纳入该分类
        let pickerState = { category: {}, selected: {} };
        let pickerVisibleIds = [];
        function openModelPicker(){
            const item = provider();
            if(!item || !lastFetchedAll.length){ alert('没有拉取到模型'); return; }
            const existing = { image: new Set(item.image_models||[]), chat: new Set(item.chat_models||[]), video: new Set(item.video_models||[]) };
            const allIds = new Set([...lastFetchedAll, ...(item.image_models||[]), ...(item.chat_models||[]), ...(item.video_models||[])]);
            pickerState = { category: {}, selected: {} };
            allIds.forEach(id => {
                // 类别归属：用户已配置 > 关键字建议 > 默认 chat
                let cat;
                if(existing.image.has(id)) cat = 'image';
                else if(existing.video.has(id)) cat = 'video';
                else if(existing.chat.has(id)) cat = 'chat';
                else if(lastFetchedSuggestion?.image?.has(id)) cat = 'image';
                else if(lastFetchedSuggestion?.video?.has(id)) cat = 'video';
                else cat = 'chat';
                pickerState.category[id] = cat;
                // 默认勾选状态：已在用户配置里的 = 勾选；新拉的 = 不勾选（让用户主动选）
                pickerState.selected[id] = existing.image.has(id) || existing.chat.has(id) || existing.video.has(id);
            });
            // 默认 tab 切回「全部」
            document.querySelectorAll('.picker-cat-tab').forEach(t => t.classList.toggle('active', t.dataset.cat === 'all'));
            document.getElementById('modelPickerOverlay').style.display = 'flex';
            renderModelPicker();
        }
        function closeModelPicker(){ document.getElementById('modelPickerOverlay').style.display = 'none'; }
        function renderModelPicker(){
            const filter = (document.getElementById('pickerFilter')?.value || '').toLowerCase();
            const currentTab = document.querySelector('.picker-cat-tab.active')?.dataset.cat || 'all';
            const ids = Object.keys(pickerState.category).sort();
            // 各分类总数 / 已选数
            const totals = { all: ids.length, image:0, chat:0, video:0 };
            const selecteds = { all:0, image:0, chat:0, video:0 };
            ids.forEach(id => {
                const cat = pickerState.category[id];
                totals[cat]++;
                if(pickerState.selected[id]){ selecteds[cat]++; selecteds.all++; }
            });
            // 过滤显示
            const list = ids.filter(id => {
                if(filter && !id.toLowerCase().includes(filter)) return false;
                if(currentTab === 'all') return true;
                return pickerState.category[id] === currentTab;
            });
            pickerVisibleIds = list;
            document.getElementById('pickerCount').textContent = `共 ${totals.all} 个模型 · 当前显示 ${list.length} 个`;
            document.querySelectorAll('.picker-cat-tab').forEach(tab => {
                const cat = tab.dataset.cat;
                tab.querySelector('.cat-count').textContent = `${selecteds[cat]}/${totals[cat]}`;
            });
            // 列表
            const html = list.map((id, index) => {
                const checked = pickerState.selected[id];
                return `
                    <div class="picker-row ${checked?'has-sel':''}" onclick="togglePickerRowByIndex(${index})">
                        <div class="picker-checkbox ${checked?'checked':''}">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
                        </div>
                        <div class="picker-model-name" title="${escapeAttr(id)}">${escapeHtml(id)}</div>
                    </div>
                `;
            }).join('');
            document.getElementById('pickerList').innerHTML = html || `<div style="padding:32px;text-align:center;color:var(--faint);font-size:12px">无匹配</div>`;
            // 底部汇总
            const sumImage = document.getElementById('sumImage');
            const sumChat = document.getElementById('sumChat');
            const sumVideo = document.getElementById('sumVideo');
            const sumUnsel = document.getElementById('sumUnsel');
            if(sumImage){ sumImage.textContent = `生图 ${selecteds.image}`; sumImage.classList.toggle('picker-sum-chip-empty', selecteds.image === 0); }
            if(sumChat){ sumChat.textContent = `LLM ${selecteds.chat}`; sumChat.classList.toggle('picker-sum-chip-empty', selecteds.chat === 0); }
            if(sumVideo){ sumVideo.textContent = `视频 ${selecteds.video}`; sumVideo.classList.toggle('picker-sum-chip-empty', selecteds.video === 0); }
            if(sumUnsel){ sumUnsel.textContent = `未选 ${totals.all - selecteds.all}`; }
        }
        function togglePickerRow(id){
            pickerState.selected[id] = !pickerState.selected[id];
            renderModelPicker();
        }
        function togglePickerRowByIndex(index){
            const id = pickerVisibleIds[index];
            if(typeof id !== 'string') return;
            togglePickerRow(id);
        }
        function selectPickerCat(cat){
            document.querySelectorAll('.picker-cat-tab').forEach(t => t.classList.toggle('active', t.dataset.cat === cat));
            renderModelPicker();
        }
        function applyModelPicker(){
            const item = provider(); if(!item) return;
            const image = [], chat = [], video = [];
            Object.entries(pickerState.selected).forEach(([id, sel]) => {
                if(!sel) return;
                const cat = pickerState.category[id];
                if(cat === 'image') image.push(id);
                else if(cat === 'video') video.push(id);
                else chat.push(id);
            });
            item.image_models = mergeLockedModels('image', image);
            item.chat_models = mergeLockedModels('chat', chat);
            item.video_models = mergeLockedModels('video', video);
            renderModels('image'); renderModels('chat'); renderModels('video');
            setStatus(`已应用 · 生图 ${image.length} / LLM ${chat.length} / 视频 ${video.length}，点保存生效`);
            closeModelPicker();
        }
        async function saveKeyOnly(){
            const item = provider();
            if(!item) return;
            const key = keyInput.value.trim();
            if(!key){ alert(tr('api.enterKeyAlert') || '请输入 Key'); return; }
            item.api_key = key;
            const ok = await saveProviders();
            if(ok) keyInput.value = '';
        }
        async function clearKeyOnly(){
            const item = provider();
            if(!item) return;
            if(!item.has_key && !keyInput.value){ return; }
            if(!confirm(tr('api.confirmClearKey') || '确认清除当前 Key？')) return;
            item._clearKey = true;
            const ok = await saveProviders();
            if(ok) keyInput.value = '';
        }
        function renderModels(kind){
            const item = provider();
            const key = kind === 'image' ? 'image_models' : kind === 'video' ? 'video_models' : 'chat_models';
            const list = kind === 'image' ? imageModelList : kind === 'video' ? videoModelList : chatModelList;
            const models = item?.[key] || [];
            if(!models.length){
                list.innerHTML = `<div class="empty">${tr('api.noModels')}</div>`;
                return;
            }
            list.innerHTML = models.map((model, index) => {
                const modelLocked = isLockedBuiltinModel(kind, model);
                return `
                <div class="model-row">
                    <input value="${escapeAttr(model)}" ${modelLocked ? 'readonly' : `oninput="updateModel('${kind}', ${index}, this.value)"`}>
                    ${modelLocked ? '' : `<button class="icon-btn" type="button" onclick="removeModel('${kind}', ${index})" title="删除"><i data-lucide="trash-2" class="w-4 h-4"></i></button>`}
                </div>
            `;
            }).join('');
            refreshIcons();
        }

        function selectProvider(id){
            syncEditor();
            selectedId = id;
            renderEditor();
        }
        function addProvider(){
            syncEditor();
            let id = 'api-provider';
            let index = 2;
            while(providers.some(item => item.id === id)) id = `api-provider-${index++}`;
            providers.push({id, name:tr('api.newProvider'), base_url:'https://', protocol:'openai', image_generation_endpoint:'', image_edit_endpoint:'', enabled:true, primary:false, image_models:[], chat_models:[], video_models:[], has_key:false, key_preview:''});
            selectedId = id;
            renderEditor();
        }
        function deleteProvider(){
            const item = provider();
            if(!item) return;
            if(isBuiltinApimart(item)){ return; }
            if(providers.length <= 1){ alert(tr('api.keepOne')); return; }
            pendingDeletedProviderId = item.id;
            providers = providers.filter(p => p.id !== item.id);
            selectedId = providers[0]?.id || '';
            renderEditor();
            saveProviders();
        }
        function addModel(kind){
            const item = provider();
            const key = kind === 'image' ? 'image_models' : kind === 'video' ? 'video_models' : 'chat_models';
            item[key] = [...(item[key] || []), ''];
            renderModels(kind);
            }
        function updateModel(kind, index, value){
            const item = provider();
            const key = kind === 'image' ? 'image_models' : kind === 'video' ? 'video_models' : 'chat_models';
            const current = item[key][index];
            if(isLockedBuiltinModel(kind, current)) return;
            item[key][index] = value;
            }
        function removeModel(kind, index){
            const item = provider();
            const key = kind === 'image' ? 'image_models' : kind === 'video' ? 'video_models' : 'chat_models';
            const current = item[key][index];
            if(isLockedBuiltinModel(kind, current)) return;
            item[key].splice(index, 1);
            renderModels(kind);
            }
        async function loadProviders(){
            setStatus(tr('api.loading'));
            try {
                const data = await fetch('/api/providers').then(r => r.json());
                providers = normalizeProviders(data.providers || []);
                selectedId = BUILTIN_APIMART_ID;
                renderEditor();
                setStatus('');
            } catch(err) {
                setStatus(tr('api.loadFailed'));
            }
        }
        async function saveProviders(){
            syncEditor();
            providers = normalizeProviders(providers);
            try {
                providers.forEach(item => {
                    if(isBuiltinApimart(item)){
                        Object.assign(item, applyBuiltinApimartLock(item));
                        return;
                    }
                    item.id = normalizeId(item.id);
                    item.protocol = ['openai', 'apimart'].includes(String(item.protocol || '').toLowerCase()) ? String(item.protocol).toLowerCase() : 'openai';
                    item.image_generation_endpoint = normalizeEndpointSetting(item.image_generation_endpoint);
                    item.image_edit_endpoint = normalizeEndpointSetting(item.image_edit_endpoint);
                    validateEndpointSetting(item.image_generation_endpoint, '文生图端口');
                    validateEndpointSetting(item.image_edit_endpoint, '图生图/编辑端口');
                    item.image_models = unique(item.image_models || []);
                    item.chat_models = unique(item.chat_models || []);
                    item.video_models = unique(item.video_models || []);
                });
            } catch(err) {
                setStatus(err.message || '高级端口设置不合法');
                toggleAdvancedEndpoints(true);
                return false;
            }
            if(new Set(providers.map(item => item.id)).size !== providers.length){
                alert(tr('api.duplicateId'));
                return false;
            }
            setStatus(tr('api.saving'));
            try {
                const res = await fetch('/api/providers', {
                    method:'PUT',
                    headers:{'Content-Type':'application/json'},
                    body:JSON.stringify(providers.map(item => ({
                        id:item.id,
                        name:item.name,
                        base_url:item.base_url,
                        protocol:(item.protocol || 'openai'),
                        image_generation_endpoint:item.image_generation_endpoint || '',
                        image_edit_endpoint:item.image_edit_endpoint || '',
                        enabled:item.enabled !== false,
                        primary:false,
                        image_models:item.image_models || [],
                        chat_models:item.chat_models || [],
                        video_models:item.video_models || [],
                        api_key:item.api_key || undefined,
                        clear_key:item._clearKey === true
                    })))
                });
                if(!res.ok) throw new Error((await res.json()).detail || tr('api.saveFailed'));
                const data = await res.json();
                providers = data.providers || providers;
                selectedId = provider()?.id || providers[0]?.id || '';
                renderEditor();
                setStatus(tr('api.saved'));
                if(window.StudioApiProviders){
                    StudioApiProviders.notifyProvidersChanged({
                        providers: data.providers || providers,
                        deletedId: pendingDeletedProviderId || undefined,
                    });
                } else {
                try { new BroadcastChannel('studio-api').postMessage({ type:'providers-changed' }); } catch(e) {}
                }
                pendingDeletedProviderId = '';
                return true;
            } catch(err) {
                setStatus(err.message || tr('api.saveFailed'));
                pendingDeletedProviderId = '';
                return false;
            }
        }
        function escapeHtml(str){
            return String(str || '').replace(/[&<>"']/g, s => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));
        }
        function escapeAttr(str){ return escapeHtml(str).replace(/`/g, '&#96;'); }
        window.addEventListener('message', event => {
            if(event.data?.type === 'studio-theme' && window.StudioTheme) window.StudioTheme.set(event.data.theme);
            if(event.data?.type === 'studio-lang' && window.StudioI18n) {
                window.StudioI18n.set(event.data.lang);
                renderEditor();
            }
        });
        window.addEventListener('studio-lang-change', () => {
            renderEditor();
        });
        window.onload = () => {
            if(window.StudioTheme) window.StudioTheme.apply();
            if(window.StudioI18n) window.StudioI18n.apply();
            loadProviders();
            // 平台名输入时实时预览生成的 ID
            if(nameInput) nameInput.addEventListener('input', updateIdPreview);
        };
    </script>
</body>
</html>
