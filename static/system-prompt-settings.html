<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Prompt</title>
    <script>
        (function(){
            try {
                localStorage.setItem('studio_theme', 'light');
                localStorage.setItem('canvas_theme', 'light');
                document.documentElement.classList.add('studio-theme-dark');
                document.documentElement.classList.add('theme-dark');
            } catch(e) {}
        })();
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="/static/theme.js?v=20260520-magnific-light"></script>
    <script src="/static/i18n.js?v=20260809-sp-reorder"></script>
    <link rel="stylesheet" href="/static/studio-magnific.css?v=20260520-ui-fix">
    <link rel="stylesheet" href="/static/runninghub-settings.css?v=20260530-rh-toast">
    <link rel="stylesheet" href="/static/settings-magnific.css?v=20260530-field-schema">
    <link rel="stylesheet" href="/static/theme.css?v=20260520-panel-26">
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; }
        button { font-family: inherit; cursor: pointer; border: 0; background: transparent; color: inherit; }
        .page { min-height: 100vh; padding: 40px 32px 80px; }
        .wrap { max-width: 1100px; margin: 0 auto; }
        .page-head { padding: 0 4px 28px; display: flex; justify-content: space-between; align-items: end; gap: 24px; flex-wrap: wrap; }
        .page-head .title { font-size: 26px; line-height: 1.05; font-weight: 900; letter-spacing: -0.015em; }
        .page-head .sub { margin-top: 8px; font-size: 12.5px; line-height: 1.55; font-weight: 600; max-width: 640px; }
        .page-head .status { font-size: 11.5px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; min-height: 16px; }
        .layout { display: grid; grid-template-columns: 260px minmax(0, 1fr); gap: 24px; align-items: start; }
        .prompt-list { display: flex; flex-direction: column; gap: 6px; padding-bottom: 8px; border-bottom: 1px solid rgba(255,255,255,.08); margin-bottom: 4px; max-height: calc(100vh - 260px); overflow-y: auto; user-select: none; }
        .prompt-list-hint { padding: 0 4px 6px; font-size: 10.5px; font-weight: 650; line-height: 1.4; opacity: 0.55; }
        .prompt-card { width: 100%; text-align: left; border: 1px solid transparent; background: transparent; padding: 8px 8px 8px 10px; display: flex; align-items: center; gap: 6px; min-height: 48px; border-radius: 10px; cursor: pointer; position: relative; }
        .prompt-card.active { background: rgba(255,255,255,.06); border-color: rgba(255,255,255,.1); }
        .prompt-card.is-dragging { opacity: 0.35; }
        .prompt-card.drag-over-before { box-shadow: inset 0 2px 0 0 rgba(255,77,148,0.85); }
        .prompt-card.drag-over-after { box-shadow: inset 0 -2px 0 0 rgba(255,77,148,0.85); }
        .prompt-drag { width: 22px; height: 32px; display: flex; align-items: center; justify-content: center; flex: 0 0 auto; opacity: 0.55; cursor: grab; color: inherit; touch-action: none; }
        .prompt-drag:active, .prompt-list.is-reordering .prompt-drag { cursor: grabbing; }
        .prompt-card:hover .prompt-drag { opacity: 0.95; }
        .prompt-drag svg { pointer-events: none; }
        .prompt-mark { width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; flex: 0 0 auto; }
        .prompt-main { min-width: 0; flex: 1; }
        .prompt-name { min-width: 0; font-size: 12.5px; font-weight: 800; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .prompt-meta { margin-top: 1px; font-size: 10px; font-weight: 700; opacity: .65; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .prompt-move { display: flex; flex-direction: column; gap: 2px; flex: 0 0 auto; }
        .prompt-move-btn { width: 22px; height: 16px; display: flex; align-items: center; justify-content: center; border-radius: 4px; opacity: 0.45; color: inherit; }
        .prompt-move-btn:hover:not(:disabled) { opacity: 1; background: rgba(255,255,255,0.08); }
        .prompt-move-btn:disabled { opacity: 0.18; cursor: default; }
        .prompt-move-btn svg { width: 12px; height: 12px; pointer-events: none; }
        .field-frame input, .field-frame textarea { width: 100%; border: 0; background: transparent; outline: none; }
        .field-frame input { height: 30px; padding: 0 10px; font-size: 12px; font-weight: 650; }
        .field-frame textarea { min-height: 320px; padding: 10px; resize: vertical; font-size: 12px; font-weight: 650; line-height: 1.55; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
        .sp-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 16px; }
        .sp-hint { margin-top: 8px; font-size: 11px; line-height: 1.55; font-weight: 600; opacity: .7; }
        .kind-row { display: flex; flex-wrap: wrap; gap: 8px; }
        .kind-opt {
            display: inline-flex; align-items: center; gap: 8px;
            min-height: 34px; padding: 0 12px; border-radius: 10px;
            border: 1px solid rgba(255,255,255,.12); background: rgba(255,255,255,.03);
            font-size: 12px; font-weight: 700; cursor: pointer; user-select: none;
        }
        .kind-opt:has(input:checked) {
            border-color: rgba(255,255,255,.28); background: rgba(255,255,255,.08);
        }
        .kind-opt:has(input:disabled) { opacity: .55; cursor: default; }
        .kind-opt input { accent-color: #c4c4c4; }
        .empty-editor { padding: 48px 24px; text-align: center; font-size: 12px; font-weight: 650; opacity: .55; }
        @media (max-width: 900px) { .layout { grid-template-columns: 1fr; } }
    </style>
</head>
<body class="mg-studio theme-dark studio-theme-dark settings-page rh-settings">
    <div id="spToast" class="rh-toast" role="status" aria-live="polite" aria-atomic="true"></div>
    <div class="page">
        <div class="wrap">
            <header class="page-head">
                <div>
                    <div class="title" data-i18n="sp.title">System Prompt</div>
                    <div class="sub" data-i18n="sp.subtitle">管理 Enhance 使用的全部系统提示词（含内置模式）。Enhance 会默认发送提示词框文字与所有已上传的图像、视频、音频。</div>
                </div>
                <div id="status" class="status"></div>
            </header>
            <div class="layout">
                <aside class="sidebar">
                    <div class="side-section-title" data-i18n="sp.listTitle">提示词列表</div>
                    <div class="prompt-list-hint" data-i18n="sp.reorderHint">按住左侧把手拖动，或点右侧箭头调整顺序；保存后生效</div>
                    <div id="promptList" class="prompt-list"></div>
                    <button class="add-btn" type="button" onclick="addPrompt()" data-i18n-title="sp.add"><i data-lucide="plus" class="w-4 h-4"></i></button>
                </aside>
                <main class="content rh-settings-main">
                    <div id="emptyEditor" class="empty-editor" data-i18n="sp.emptyHint">选择左侧提示词，或点击 + 新建</div>
                    <section class="rh-card" id="editorCard" hidden>
                        <h3 class="rh-card-title" data-i18n="sp.editorTitle">编辑系统提示词</h3>
                        <div class="rh-form-stack">
                            <label class="rh-field">
                                <span class="rh-field-label" data-i18n="sp.name">名称</span>
                                <div class="field-frame"><input id="nameInput" type="text" placeholder="视频反推"></div>
                            </label>
                            <div class="rh-field">
                                <span class="rh-field-label" data-i18n="sp.kind">模式</span>
                                <div class="kind-row" id="kindRow">
                                    <label class="kind-opt">
                                        <input type="radio" name="promptKind" value="fixed">
                                        <span data-i18n="sp.kindFixed">固定提示词</span>
                                    </label>
                                    <label class="kind-opt">
                                        <input type="radio" name="promptKind" value="local">
                                        <span data-i18n="sp.kindLocal">字符串拼接</span>
                                    </label>
                                    <label class="kind-opt">
                                        <input type="radio" name="promptKind" value="llm" checked>
                                        <span data-i18n="sp.kindLlm">LLM反推</span>
                                    </label>
                                </div>
                            </div>
                            <label class="rh-field full">
                                <span class="rh-field-label" id="systemPromptLabel" data-i18n="sp.systemPrompt">系统提示词</span>
                                <div class="field-frame"><textarea id="systemInput" placeholder="你是…"></textarea></div>
                            </label>
                            <div class="sp-actions" style="margin-top:8px" id="insertInputWrap" hidden>
                                <button class="action-btn ghost-btn settings-btn" type="button" id="insertInputBtn">
                                    <i data-lucide="braces"></i><span data-i18n="sp.insertInput">插入 {input}</span>
                                </button>
                            </div>
                            <p id="kindHint" class="sp-hint"></p>
                        </div>
                        <div class="sp-actions">
                            <button class="action-btn save-btn settings-btn" type="button" onclick="savePrompts()"><i data-lucide="save"></i><span data-i18n="sp.save">保存</span></button>
                            <button id="deleteBtn" class="action-btn ghost-btn settings-btn" type="button" onclick="deleteSelected()"><i data-lucide="trash-2"></i><span data-i18n="sp.delete">删除</span></button>
                            <button id="resetBtn" class="action-btn ghost-btn settings-btn" type="button" onclick="resetSelected()" hidden><i data-lucide="rotate-ccw"></i><span data-i18n="sp.reset">恢复默认</span></button>
                        </div>
                    </section>
                </main>
            </div>
        </div>
    </div>
    <script>
        lucide.createIcons();
        function tr(k){ return window.StudioI18n ? StudioI18n.t(k) : k; }
        function escapeHtml(s){ return String(s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

        let prompts = [];
        let selectedId = '';
        let toastTimer = null;

        function showToast(msg, ok){
            const el = document.getElementById('spToast');
            if(!el) return;
            el.textContent = msg;
            el.classList.toggle('ok', !!ok);
            el.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => el.classList.remove('show'), 2600);
        }

        function notifyEnhancePromptsChanged(){
            try { new BroadcastChannel('studio-api').postMessage({ type: 'enhance-prompts-changed' }); } catch(e) {}
            try { window.parent.postMessage({ type: 'enhance-prompts-changed' }, '*'); } catch(e) {}
        }

        function newPrompt(){
            return {
                id: 'sp_' + (crypto.randomUUID?.() || String(Date.now())).replace(/-/g, '').slice(0, 12),
                name: tr('sp.newName'),
                system_prompt: '',
                kind: 'llm',
                builtin: false,
            };
        }

        function normalizeKind(kind){
            return ['fixed', 'local', 'llm'].includes(kind) ? kind : 'llm';
        }

        function selectedKind(){
            const hit = document.querySelector('input[name="promptKind"]:checked');
            return normalizeKind(hit?.value);
        }

        function setKindInputs(kind, locked){
            const k = normalizeKind(kind);
            document.querySelectorAll('input[name="promptKind"]').forEach(el => {
                el.checked = el.value === k;
                el.disabled = !!locked;
            });
        }

        function kindHintText(kind){
            const k = normalizeKind(kind);
            if(k === 'fixed') return tr('sp.fixedHint');
            if(k === 'local') return tr('sp.localHint');
            return tr('sp.llmHint');
        }

        function kindLabel(item){
            if(!item) return '';
            const k = normalizeKind(item.kind);
            if(item.builtin){
                if(k === 'fixed') return tr('sp.tagFixed');
                if(k === 'local') return tr('sp.tagLocal');
                return tr('sp.tagBuiltin');
            }
            if(k === 'fixed') return tr('sp.tagCustomFixed');
            if(k === 'local') return tr('sp.tagCustomLocal');
            return tr('sp.tagCustomLlm');
        }

        function syncKindChrome(item){
            const kind = normalizeKind(item?.kind);
            const kindHint = document.getElementById('kindHint');
            const insertRow = document.getElementById('insertInputWrap');
            if(kindHint) kindHint.textContent = kindHintText(kind);
            if(insertRow) insertRow.hidden = kind !== 'local';
            lucide.createIcons({ nodes: [document.getElementById('insertInputBtn')].filter(Boolean) });
        }

        function escapeAttr(s){ return escapeHtml(s).replace(/'/g, '&#39;'); }

        let spDragFromIndex = -1;
        let spDragHoverIndex = -1;
        let spDragBefore = true;
        let spDragMoved = false;
        let spDragSuppressClick = false;
        let spDragPointerId = null;
        const promptListEl = () => document.getElementById('promptList');

        function clearPromptDragIndicators(){
            const list = promptListEl();
            if(!list) return;
            list.classList.remove('is-reordering');
            list.querySelectorAll('.prompt-card.drag-over-before, .prompt-card.drag-over-after, .prompt-card.is-dragging').forEach(el => {
                el.classList.remove('drag-over-before', 'drag-over-after', 'is-dragging');
            });
        }
        function reorderPrompt(fromIndex, toIndex){
            if(!prompts.length) return false;
            fromIndex = Number(fromIndex);
            toIndex = Number(toIndex);
            if(!Number.isInteger(fromIndex) || !Number.isInteger(toIndex)) return false;
            if(fromIndex < 0 || toIndex < 0 || fromIndex >= prompts.length || toIndex >= prompts.length) return false;
            if(fromIndex === toIndex) return false;
            readEditorIntoSelected();
            const [moved] = prompts.splice(fromIndex, 1);
            prompts.splice(toIndex, 0, moved);
            renderList();
            syncEditor();
            return true;
        }
        window.movePrompt = function(index, delta, ev){
            ev?.preventDefault?.();
            ev?.stopPropagation?.();
            spDragSuppressClick = true;
            reorderPrompt(index, index + delta);
            setTimeout(() => { spDragSuppressClick = false; }, 0);
        };
        function spDropIndexFromPointer(clientY){
            const list = promptListEl();
            const cards = [...(list?.querySelectorAll('.prompt-card') || [])];
            if(!cards.length || spDragFromIndex < 0) return spDragFromIndex;
            let hover = cards[cards.length - 1];
            let before = false;
            for(const card of cards){
                const rect = card.getBoundingClientRect();
                if(clientY < rect.top + rect.height / 2){
                    hover = card;
                    before = true;
                    break;
                }
                if(clientY <= rect.bottom){
                    hover = card;
                    before = false;
                    break;
                }
            }
            spDragHoverIndex = Number(hover.dataset.index);
            spDragBefore = before;
            cards.forEach(card => {
                const active = card === hover;
                card.classList.toggle('drag-over-before', active && before);
                card.classList.toggle('drag-over-after', active && !before);
            });
            let toIndex = before ? spDragHoverIndex : spDragHoverIndex + 1;
            if(spDragFromIndex < toIndex) toIndex -= 1;
            return Math.max(0, Math.min(prompts.length - 1, toIndex));
        }
        function onSpPointerMove(e){
            if(spDragFromIndex < 0 || (spDragPointerId !== null && e.pointerId !== spDragPointerId)) return;
            spDragMoved = true;
            spDragSuppressClick = true;
            spDropIndexFromPointer(e.clientY);
        }
        function onSpPointerUp(e){
            if(spDragFromIndex < 0 || (spDragPointerId !== null && e.pointerId !== spDragPointerId)) return;
            endSpPointerDrag(e.clientY);
        }
        function onSpPointerCancel(e){
            if(spDragFromIndex < 0 || (spDragPointerId !== null && e.pointerId !== spDragPointerId)) return;
            spDragMoved = false;
            endSpPointerDrag(e.clientY);
        }
        function unbindSpPointerListeners(){
            window.removeEventListener('pointermove', onSpPointerMove, true);
            window.removeEventListener('pointerup', onSpPointerUp, true);
            window.removeEventListener('pointercancel', onSpPointerCancel, true);
        }
        function endSpPointerDrag(clientY){
            if(spDragFromIndex < 0) return;
            const from = spDragFromIndex;
            const to = spDragMoved ? spDropIndexFromPointer(clientY) : from;
            spDragFromIndex = -1;
            spDragHoverIndex = -1;
            spDragPointerId = null;
            unbindSpPointerListeners();
            clearPromptDragIndicators();
            if(spDragMoved && from !== to){
                spDragSuppressClick = true;
                reorderPrompt(from, to);
            }
            spDragMoved = false;
            setTimeout(() => { spDragSuppressClick = false; }, 0);
        }
        function bindPromptListDnD(){
            const list = promptListEl();
            if(!list || list.dataset.dndBound === '1') return;
            list.dataset.dndBound = '1';
            list.addEventListener('pointerdown', e => {
                const handle = e.target.closest?.('.prompt-drag');
                if(!handle || !list.contains(handle)) return;
                const card = handle.closest('.prompt-card');
                if(!card) return;
                e.preventDefault();
                e.stopPropagation();
                unbindSpPointerListeners();
                spDragFromIndex = Number(card.dataset.index);
                spDragHoverIndex = spDragFromIndex;
                spDragBefore = true;
                spDragMoved = false;
                spDragSuppressClick = false;
                spDragPointerId = e.pointerId;
                list.classList.add('is-reordering');
                card.classList.add('is-dragging');
                window.addEventListener('pointermove', onSpPointerMove, true);
                window.addEventListener('pointerup', onSpPointerUp, true);
                window.addEventListener('pointercancel', onSpPointerCancel, true);
            });
        }

        function renderList(){
            const list = promptListEl();
            if(!list) return;
            if(!prompts.length){
                list.innerHTML = `<div class="empty-editor" style="padding:16px 8px">${escapeHtml(tr('sp.noItems'))}</div>`;
                return;
            }
            list.innerHTML = prompts.map((p, index) => {
                const atTop = index === 0;
                const atBottom = index === prompts.length - 1;
                return `
                <div class="prompt-card ${p.id === selectedId ? 'active' : ''}" role="button" tabindex="0" data-index="${index}" data-id="${escapeAttr(p.id)}" onclick="selectPrompt('${escapeAttr(p.id)}')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();selectPrompt('${escapeAttr(p.id)}')}">
                    <span class="prompt-drag" title="${escapeAttr(tr('sp.dragHandle'))}" aria-label="${escapeAttr(tr('sp.dragHandle'))}"><i data-lucide="grip-vertical" class="w-3.5 h-3.5"></i></span>
                    <span class="prompt-mark"><i data-lucide="scroll-text" class="w-4 h-4"></i></span>
                    <span class="prompt-main">
                        <div class="prompt-name">${escapeHtml(p.name || tr('sp.untitled'))}</div>
                        <div class="prompt-meta">${escapeHtml(kindLabel(p))}</div>
                    </span>
                    <span class="prompt-move">
                        <button class="prompt-move-btn" type="button" ${atTop ? 'disabled' : ''} title="${escapeAttr(tr('sp.moveUp'))}" aria-label="${escapeAttr(tr('sp.moveUp'))}" onclick="movePrompt(${index}, -1, event)"><i data-lucide="chevron-up"></i></button>
                        <button class="prompt-move-btn" type="button" ${atBottom ? 'disabled' : ''} title="${escapeAttr(tr('sp.moveDown'))}" aria-label="${escapeAttr(tr('sp.moveDown'))}" onclick="movePrompt(${index}, 1, event)"><i data-lucide="chevron-down"></i></button>
                    </span>
                </div>
            `;
            }).join('');
            bindPromptListDnD();
            lucide.createIcons({ nodes: list.querySelectorAll('[data-lucide]') });
        }

        function syncEditor(){
            const item = prompts.find(p => p.id === selectedId);
            const empty = document.getElementById('emptyEditor');
            const card = document.getElementById('editorCard');
            const deleteBtn = document.getElementById('deleteBtn');
            const resetBtn = document.getElementById('resetBtn');
            if(!item){
                empty.hidden = false;
                card.hidden = true;
                return;
            }
            empty.hidden = true;
            card.hidden = false;
            document.getElementById('nameInput').value = item.name || '';
            document.getElementById('systemInput').value = item.system_prompt || '';
            setKindInputs(item.kind, !!item.builtin);
            syncKindChrome(item);
            if(deleteBtn) deleteBtn.hidden = !!item.builtin;
            if(resetBtn) resetBtn.hidden = !item.builtin;
        }

        function readEditorIntoSelected(){
            const item = prompts.find(p => p.id === selectedId);
            if(!item) return null;
            item.name = document.getElementById('nameInput').value.trim();
            item.system_prompt = document.getElementById('systemInput').value.trim();
            if(!item.builtin){
                item.kind = selectedKind();
            }
            return item;
        }

        function insertInputPlaceholder(){
            const ta = document.getElementById('systemInput');
            if(!ta) return;
            const token = '{input}';
            const start = ta.selectionStart ?? ta.value.length;
            const end = ta.selectionEnd ?? start;
            ta.value = ta.value.slice(0, start) + token + ta.value.slice(end);
            const pos = start + token.length;
            ta.focus();
            ta.setSelectionRange(pos, pos);
            readEditorIntoSelected();
            renderList();
        }

        function selectPrompt(id){
            if(spDragSuppressClick) return;
            readEditorIntoSelected();
            selectedId = id;
            renderList();
            syncEditor();
        }

        function addPrompt(){
            readEditorIntoSelected();
            const item = newPrompt();
            prompts.push(item);
            selectedId = item.id;
            renderList();
            syncEditor();
        }

        async function loadPrompts(){
            try {
                const data = await fetch('/api/enhance-system-prompts').then(r => r.json());
                prompts = Array.isArray(data.prompts) ? data.prompts : [];
                if(!selectedId || !prompts.some(p => p.id === selectedId)){
                    selectedId = prompts[0]?.id || '';
                }
                renderList();
                syncEditor();
            } catch(e){
                showToast(tr('sp.loadFailed'), false);
            }
        }

        async function savePrompts(){
            readEditorIntoSelected();
            const valid = prompts.filter(p => String(p.name || '').trim() && String(p.system_prompt || '').trim());
            if(selectedId && !valid.some(p => p.id === selectedId)){
                showToast(tr('sp.invalid'), false);
                return;
            }
            try {
                const res = await fetch('/api/enhance-system-prompts', {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompts: valid }),
                });
                const data = await res.json().catch(() => ({}));
                if(!res.ok) throw new Error(data.detail || tr('sp.saveFailed'));
                prompts = data.prompts || valid;
                if(selectedId && !prompts.some(p => p.id === selectedId)){
                    selectedId = prompts[0]?.id || '';
                }
                renderList();
                syncEditor();
                showToast(tr('sp.saved'), true);
                notifyEnhancePromptsChanged();
            } catch(e){
                showToast(e.message || tr('sp.saveFailed'), false);
            }
        }

        async function deleteSelected(){
            if(!selectedId) return;
            const item = prompts.find(p => p.id === selectedId);
            if(item?.builtin){
                showToast(tr('sp.cannotDeleteBuiltin'), false);
                return;
            }
            if(!confirm(tr('sp.deleteConfirm'))) return;
            prompts = prompts.filter(p => p.id !== selectedId);
            selectedId = prompts[0]?.id || '';
            await savePrompts();
        }

        async function resetSelected(){
            const item = prompts.find(p => p.id === selectedId);
            if(!item?.builtin) return;
            if(!confirm(tr('sp.resetConfirm'))) return;
            try {
                const res = await fetch('/api/enhance-system-prompts/' + encodeURIComponent(selectedId) + '/reset', { method: 'POST' });
                const data = await res.json().catch(() => ({}));
                if(!res.ok) throw new Error(data.detail || tr('sp.saveFailed'));
                prompts = data.prompts || [];
                renderList();
                syncEditor();
                showToast(tr('sp.resetDone'), true);
                notifyEnhancePromptsChanged();
            } catch(e){
                showToast(e.message || tr('sp.saveFailed'), false);
            }
        }

        ['nameInput', 'systemInput'].forEach(id => {
            document.getElementById(id)?.addEventListener('input', () => {
                readEditorIntoSelected();
                renderList();
            });
        });

        document.getElementById('kindRow')?.addEventListener('change', () => {
            const item = readEditorIntoSelected();
            if(item) syncKindChrome(item);
            renderList();
        });
        document.getElementById('insertInputBtn')?.addEventListener('click', insertInputPlaceholder);

        loadPrompts();
    </script>
</body>
</html>
