<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
    <title>AI 视频</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="/static/theme.js?v=20260520-magnific-light"></script>
    <script src="/static/i18n.js?v=20260521-studio"></script>
    <script src="/static/studio-panel-bridge.js?v=20260530-task-fix"></script>
    <script src="/static/studio-ref-upload.js?v=20260530-no-slot-label"></script>
    <script src="/static/studio-media-ref-upload.js?v=20260530-global"></script>
    <link rel="stylesheet" href="/static/studio-panel.css?v=20260530-ref-fixed-size">
    <link rel="stylesheet" href="/static/studio-magnific.css?v=20260530-panel-radius">
    <link rel="stylesheet" href="/static/studio-borderless.css?v=20260530-range-white">
    <link rel="stylesheet" href="/static/studio-range-slider.css?v=20260530-range-white">
    <link rel="stylesheet" href="/static/studio-pullup-select.css?v=20260530-pullup-select">
    <script src="/static/studio-provider-label.js?v=20260530-provider-sync"></script>
    <script src="/static/studio-api-providers.js?v=20260530-provider-sync"></script>
    <script src="/static/studio-pullup-select.js?v=20260530-apimart-bear"></script>
    <link rel="stylesheet" href="/static/studio-prompt-enhance.css?v=20260809-enhance-confirm-out">
    <script src="/static/studio-prompt-enhance.js?v=20260809-enhance-confirm-out"></script>
    <script src="/static/studio-range-slider.js?v=20260530-range-white" defer></script>
    <style>
        :root { --accent:#ff4d94; --bg:#161616; --easing:cubic-bezier(0.22,1,0.36,1); }
        html, body { height:100%; overflow:hidden; }
        body { background:#161616; font-family:Inter,sans-serif; color:#f5f5f5; margin:0; }
        html.embed-panel body { background:#161616 !important; }
        html.embed-panel .container-box { max-width:none; padding:0; height:100%; box-sizing:border-box; }
        .container-box { max-width:1680px; margin:0 auto; padding:8px 14px 10px; height:100%; box-sizing:border-box; }
        .control-label { display:flex; align-items:center; gap:0; color:#737373; font-size:11px; font-weight:600; }
        .preview-img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
    </style>
</head>
<body class="mg-studio embed-panel">
    <div class="container-box">
        <main class="options-panel h-full">
            <section class="tool-panel">
                <label class="block">
                    <div class="control-label mb-1"><span data-i18n="api.provider">平台</span></div>
                    <select id="providerSelect" class="size-select" onchange="setProvider(this.value)"></select>
                </label>
                <label class="block">
                    <div class="control-label mb-1"><span data-i18n="video.model">模型</span></div>
                    <select id="modelSelect" class="size-select" onchange="onModelChange(this.value)"></select>
                </label>
            </section>
            <section class="tool-panel">
                <div>
                    <div class="control-label mb-1"><span data-i18n="video.prompt">提示�?/span></div>
                    <textarea id="promptInput" rows="12" class="nano-input" placeholder="描述你想生成的视�?.." data-i18n-placeholder="video.promptPlaceholder" oninput="syncGenBtnState()"></textarea>
                </div>
                <div>
                    <div class="control-label mb-1"><span data-i18n="video.referenceImages">参考图</span></div>
                    <div id="refGrid" class="ref-grid"></div>
                </div>
                <div id="seedanceRefWrap" class="seedance-ref-wrap" aria-hidden="true">
                    <div class="seedance-ref-block">
                        <div class="control-label mb-1"><span data-i18n="video.referenceVideos">参考视�?/span></div>
                        <div id="refVideoDropZone" class="media-ref-drop-zone" data-accept="video">
                            <div id="refVideoGrid" class="ref-grid"></div>
                        </div>
                    </div>
                    <div class="seedance-ref-block">
                        <div class="control-label mb-1"><span data-i18n="video.referenceAudio">参考音�?/span></div>
                        <div id="refAudioDropZone" class="media-ref-drop-zone" data-accept="audio">
                            <div id="refAudioGrid" class="ref-grid"></div>
                        </div>
                    </div>
                </div>
            </section>
            <section class="tool-panel panel-field-stack">
                <label class="block">
                    <div class="control-label mb-1" data-i18n="canvas.videoDuration">时长</div>
                    <select id="durationSelect" class="size-select"></select>
                </label>
                <label class="block">
                    <div class="control-label mb-1" data-i18n="canvas.videoAspect">比例</div>
                    <select id="aspectSelect" class="size-select"></select>
                </label>
                <label class="block">
                    <div class="control-label mb-1" data-i18n="canvas.videoResolution">分辨�?/div>
                    <select id="resolutionSelect" class="size-select">
                        <option value="480p">480p</option>
                        <option value="720p" selected>720p</option>
                        <option value="1080p">1080p</option>
                    </select>
                </label>
                <label id="generateAudioWrap" class="block hidden">
                    <div class="flex items-center gap-2 mt-1">
                        <input id="generateAudioInput" type="checkbox" class="accent-[#ff4d94]" checked>
                        <span class="control-label" data-i18n="video.generateAudio">生成配套音频</span>
                    </div>
                </label>
            </section>
            <span id="genBtnWrap" class="generate-btn-wrap">
                <button id="genBtn" onclick="submitVideo()" class="glass-btn generate-btn" type="button" disabled>
                    <span class="generate-btn-label" data-i18n="video.generate">生成视频</span>
                    <i data-lucide="sparkles" class="generate-btn-icon"></i>
                </button>
            </span>
        </main>
    </div>
    <script>
        lucide.createIcons();
        function tr(k){ return window.StudioI18n ? StudioI18n.t(k) : k; }
        function escapeHtml(s){ return String(s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

        let provider = 'comfly', selectedModel = 'veo3-fast', apiProviders = [];
        let pendingJobs = [];
        let mediaRelay = null;
        let videoRefGrid = null;
        let audioRefGrid = null;

        function onModelChange(model){
            selectedModel = model;
            syncVideoParams();
            syncSeedanceRefSections();
            syncSeedanceExtraOptions();
            syncSeedanceExtraOptions();
        }
        function syncSeedanceExtraOptions(){
            const wrap = document.getElementById('generateAudioWrap');
            const show = isDoubaoSeedance20Model(selectedModel);
            if(wrap) wrap.classList.toggle('hidden', !show);
        }
        function syncSeedanceRefSections(){
            StudioMediaRefUpload.setCollapsible('seedanceRefWrap', isDoubaoSeedance20Model(selectedModel), mediaRelay);
        }
        function notifyGalleryDragResult(accepted){
            try {
                window.parent.postMessage({ type:'studio-gallery-drag-result', accepted }, '*');
            } catch(e){}
        }
        function initMediaRefUploads(){
            mediaRelay = StudioMediaRefUpload.createGalleryRelay({
                isEnabled: () => isDoubaoSeedance20Model(selectedModel),
                onDropAccepted: () => notifyGalleryDragResult(true),
                onDropRejected: () => notifyGalleryDragResult(false),
            });
            mediaRelay.bind();
            videoRefGrid = StudioMediaRefUpload.mount({
                gridId: 'refVideoGrid',
                dropZoneId: 'refVideoDropZone',
                kind: 'video',
                maxSlots: 3,
                tr,
                galleryRelay: mediaRelay,
            });
            audioRefGrid = StudioMediaRefUpload.mount({
                gridId: 'refAudioGrid',
                dropZoneId: 'refAudioDropZone',
                kind: 'audio',
                maxSlots: 3,
                tr,
                galleryRelay: mediaRelay,
            });
        }
        window.getEnhanceReferenceVideos = function(){
            return videoRefGrid?.getUrls?.() || [];
        };
        window.getEnhanceReferenceAudios = function(){
            return audioRefGrid?.getUrls?.() || [];
        };
        function buildVideoPayload(){
            const payload = {
                prompt: document.getElementById('promptInput').value.trim(),
                provider_id: provider,
                model: selectedModel,
                duration: Number(document.getElementById('durationSelect').value || 5),
                aspect_ratio: document.getElementById('aspectSelect').value,
                resolution: document.getElementById('resolutionSelect').value,
                reference_images: getReferenceList(),
                enhance_prompt: false,
                enable_upsample: false,
                generate_audio: !!document.getElementById('generateAudioInput')?.checked,
            };
            if(isDoubaoSeedance20Model(selectedModel)){
                const videos = videoRefGrid?.getUrls() || [];
                const audios = audioRefGrid?.getUrls() || [];
                if(videos.length) payload.reference_videos = videos;
                if(audios.length) payload.reference_audios = audios;
            }
            return payload;
        }

        function syncGenBtnTip(showTip){
            const wrap = document.getElementById('genBtnWrap');
            if(!wrap) return;
            if(showTip) wrap.setAttribute('data-tip', tr('studio.genPromptTip'));
            else wrap.removeAttribute('data-tip');
        }
        function syncGenBtnState(){
            const btn = document.getElementById('genBtn');
            if(!btn) return;
            const prompt = document.getElementById('promptInput')?.value?.trim() || '';
            const promptMissing = !prompt;
            btn.disabled = promptMissing;
            syncGenBtnTip(promptMissing);
        }

        function getReferenceList(){
            return StudioRefUpload.getReferenceList();
        }

        function panelProviders(){
            const list = StudioApiProviders.enabledProviders(apiProviders);
            if(list.length) return list;
            return [{ id:'apimart', name:'🐻', has_key:false, enabled:true, video_models:['veo3.1-fast'] }];
        }
        function videoProviders(){
            return panelProviders();
        }
        function isDoubaoSeedance20Model(model){
            const id = String(model || '').toLowerCase();
            return /doubao-seedance-2(?:\.0|-0)/.test(id);
        }
        function isKling26Model(model){
            const id = String(model || '').toLowerCase();
            return /kling[-_]?v?2[-_.]?6|keling2\.6/.test(id);
        }
        const APIMART_VIDEO_MODEL_ALIASES = {
            'doubao-seedance-2-0-260128': 'doubao-seedance-2.0',
            'doubao-seedance-2-0-fast-260128': 'doubao-seedance-2.0-fast',
        };
        function apimartVideoModel(model){
            const id = String(model || '').toLowerCase();
            return APIMART_VIDEO_MODEL_ALIASES[id] || id;
        }
        function seedance20Supports1080p(model){
            const normalized = apimartVideoModel(model);
            return normalized === 'doubao-seedance-2.0' || normalized === 'doubao-seedance-2.0-face';
        }
        const DOUBAO_SEEDANCE_20_ASPECTS = ['9:16', '3:4', '1:1', '4:3', '16:9', '21:9', 'adaptive'];
        const DEFAULT_VIDEO_DURATIONS = [5, 8, 10];
        const DEFAULT_VIDEO_ASPECTS = ['16:9', '9:16', '1:1', '4:3', '3:4'];
        function kling26AspectOptions(){
            const en = window.StudioI18n?.lang?.() === 'en';
            return [
                {value:'16:9', label: en ? '16:9 (Landscape)' : '16:9 (横屏)'},
                {value:'9:16', label: en ? '9:16 (Portrait)' : '9:16 (竖屏)'},
                {value:'1:1', label: en ? '1:1 (Square)' : '1:1 (方形)'},
            ];
        }
        function getVideoModelParamProfile(model){
            if(isDoubaoSeedance20Model(model)){
                return {
                    durations: Array.from({length:12}, (_, i) => i + 4),
                    aspects: DOUBAO_SEEDANCE_20_ASPECTS,
                    aspectLabels: null,
                    defaultAspect: '16:9',
                    defaultDuration: 5,
                };
            }
            if(isKling26Model(model)){
                return {
                    durations: [5, 10],
                    aspects: kling26AspectOptions(),
                    aspectLabels: true,
                    defaultAspect: '16:9',
                    defaultDuration: 5,
                };
            }
            return null;
        }
        function syncVideoParams(){
            const durationSelect = document.getElementById('durationSelect');
            const aspectSelect = document.getElementById('aspectSelect');
            const resolutionSelect = document.getElementById('resolutionSelect');
            if(!durationSelect || !aspectSelect) return;
            const prevDuration = Number(durationSelect.value || 5);
            const prevAspect = aspectSelect.value || '16:9';
            const prevResolution = resolutionSelect?.value || '720p';
            const profile = getVideoModelParamProfile(selectedModel);
            const durations = profile?.durations || DEFAULT_VIDEO_DURATIONS;
            durationSelect.innerHTML = durations.map(v => `<option value="${v}">${v}s</option>`).join('');
            if(profile?.aspectLabels){
                aspectSelect.innerHTML = profile.aspects.map(item => `<option value="${escapeHtml(item.value)}">${escapeHtml(item.label)}</option>`).join('');
            } else {
                const aspects = profile?.aspects || DEFAULT_VIDEO_ASPECTS;
                aspectSelect.innerHTML = aspects.map(v => `<option value="${escapeHtml(v)}">${escapeHtml(v)}</option>`).join('');
            }
            if(resolutionSelect){
                const resolutions = isDoubaoSeedance20Model(selectedModel)
                    ? (seedance20Supports1080p(selectedModel) ? ['480p', '720p', '1080p'] : ['480p', '720p'])
                    : ['480p', '720p', '1080p'];
                resolutionSelect.innerHTML = resolutions.map(v => `<option value="${v}">${v}</option>`).join('');
                resolutionSelect.value = resolutions.includes(prevResolution) ? prevResolution : (profile?.defaultResolution || '720p');
            }
            const allowedAspects = profile?.aspectLabels
                ? profile.aspects.map(item => item.value)
                : (profile?.aspects || DEFAULT_VIDEO_ASPECTS);
            const nextDuration = durations.includes(prevDuration) ? prevDuration : (profile?.defaultDuration || durations[0] || 5);
            const nextAspect = allowedAspects.includes(prevAspect) ? prevAspect : (profile?.defaultAspect || allowedAspects[0] || '16:9');
            durationSelect.value = String(nextDuration);
            aspectSelect.value = nextAspect;
        }
        function renderProviderControls(deletedId){
            const providers = videoProviders();
            if(!providers.length) return;
            provider = StudioApiProviders.resolveProviderId(provider, providers, { deletedId, preferApimart: true });
            const models = providers.find(p => p.id === provider)?.video_models || [];
            if(!models.includes(selectedModel)) selectedModel = models[0] || '';
            document.getElementById('providerSelect').innerHTML = StudioApiProviders.buildProviderOptionsHtml(providers, provider, escapeHtml);
            document.getElementById('modelSelect').innerHTML = models.map(m => `<option value="${escapeHtml(m)}" ${m===selectedModel?'selected':''}>${escapeHtml(m)}</option>`).join('');
            syncVideoParams();
            syncSeedanceRefSections();
            syncSeedanceExtraOptions();
        }
        function setProvider(v){
            const item = panelProviders().find(p => p.id === v);
            if(item && !StudioApiProviders.providerHasKey(item)){
                StudioApiProviders.promptMissingKey(item);
            }
            provider = v;
            renderProviderControls();
        }

        async function refreshApiProviders(payload){
            try {
                apiProviders = await StudioApiProviders.fetchProviderList();
            } catch(e) {}
            renderProviderControls(payload && payload.deletedId);
        }

        async function loadConfig(){
            try {
                apiProviders = await StudioApiProviders.fetchProviderList();
                provider = StudioApiProviders.resolveProviderId(provider, panelProviders(), { preferApimart: true });
                renderProviderControls();
            } catch(e){}
        }

        function notifyGallery(){
            if(window.StudioPanelBridge){
                StudioPanelBridge.notifyPending(pendingJobs);
                StudioPanelBridge.notifyRefresh();
            }
        }

        async function clearPendingJob(jobId){
            pendingJobs = pendingJobs.filter(j => j.id !== jobId);
            if(window.deletePendingJobOnServer) deletePendingJobOnServer(jobId);
            notifyGallery();
        }

        function failPendingJob(jobId, message, delay = 8000){
            const job = pendingJobs.find(j => j.id === jobId);
            if(job) job.error = message || tr('video.failed');
            console.error('[video] generation failed:', jobId, message);
            notifyGallery();
            if(delay > 0){
                setTimeout(() => { clearPendingJob(jobId); }, delay);
            } else {
                clearPendingJob(jobId);
            }
        }

        function deliverResultToGallery(result){
            if(!result?.videos?.length && !result?.images?.length) return;
            if(window.StudioPanelBridge){
                StudioPanelBridge.notifyAddItem(result);
                StudioPanelBridge.notifyRefresh();
            }
        }

        const resumingJobIds = new Set();

        async function resumePendingJobPoll(job){
            if(!job?.id || !job.task_id || resumingJobIds.has(job.id)) return;
            resumingJobIds.add(job.id);
            try {
                const result = await pollCanvasVideoTask(job.task_id);
                deliverResultToGallery(result);
                resumingJobIds.delete(job.id);
                await clearPendingJob(job.id);
            } catch(err){
                resumingJobIds.delete(job.id);
                failPendingJob(job.id, err.message || tr('video.failed'));
            }
        }

        async function resumePendingJobs(){
            try {
                const jobs = await fetch('/api/online-pending').then(r => r.json());
                if(!Array.isArray(jobs) || !jobs.length) return;
                const now = Date.now() / 1000;
                let changed = false;
                for(const serverJob of jobs){
                    if(serverJob.error) continue;
                    if(serverJob.mediaKind && serverJob.mediaKind !== 'video') continue;
                    if(!serverJob.task_id){
                        if(serverJob.timestamp && now - serverJob.timestamp > 120){
                            fetch('/api/online-pending/' + encodeURIComponent(serverJob.id), { method:'DELETE' }).catch(()=>{});
                        }
                        continue;
                    }
                    let local = pendingJobs.find(j => j.id === serverJob.id);
                    if(!local){
                        local = { ...serverJob };
                        pendingJobs.unshift(local);
                        changed = true;
                    } else {
                        Object.assign(local, serverJob);
                    }
                    resumePendingJobPoll(local);
                }
                if(changed) notifyGallery();
            } catch(e){
                console.error('Resume pending jobs failed:', e);
            }
        }

        async function runJob(jobId, payload){
            try {
                const createRes = await fetch('/api/canvas-video-tasks', {
                    method:'POST',
                    headers:{'Content-Type':'application/json'},
                    body:JSON.stringify({ ...payload, job_id: jobId })
                }).then(async r => {
                    if(!r.ok) throw new Error((await r.json().catch(() => ({}))).detail || tr('video.failed'));
                    return r.json();
                });
                const taskId = createRes.task_id;
                const job = pendingJobs.find(j => j.id === jobId);
                if(job) job.task_id = taskId;
                if(window.updatePendingJobOnServer) updatePendingJobOnServer(jobId, { task_id: taskId });
                notifyGallery();

                const result = await pollCanvasVideoTask(taskId);
                deliverResultToGallery(result);
                await clearPendingJob(jobId);
            } catch(err){
                failPendingJob(jobId, err.message || tr('video.failed'));
            }
        }

        async function submitVideo(){
            const prompt = document.getElementById('promptInput').value.trim();
            if(!prompt){ alert(tr('video.promptRequired')); return; }
            if(!StudioApiProviders.guardProviderKey(provider, panelProviders())) return;
            const payload = buildVideoPayload();
            const jobId = `pending_${Date.now()}_${Math.random().toString(36).slice(2, 7)}`;
            const jobObj = { id: jobId, prompt, mediaKind: 'video', timestamp: Date.now() / 1000 };
            pendingJobs.unshift(jobObj);
            if(window.registerPendingJobOnServer) registerPendingJobOnServer(jobObj);
            notifyGallery();
            void runJob(jobId, { ...payload, job_id: jobId });
        }

        window.applyRecordParams = function(data){
            if(!data) return;
            if(data.prompt) document.getElementById('promptInput').value = data.prompt;
            syncGenBtnState();
            const p = data.params || {};
            if(p.provider_id) setProvider(p.provider_id);
            if(p.model){ selectedModel = p.model; renderProviderControls(); }
            else syncVideoParams();
            syncSeedanceRefSections();
            if(p.duration) document.getElementById('durationSelect').value = String(p.duration);
            if(p.aspect_ratio) document.getElementById('aspectSelect').value = p.aspect_ratio;
            if(p.resolution) document.getElementById('resolutionSelect').value = p.resolution;
            if(typeof p.generate_audio === 'boolean'){
                const audioInput = document.getElementById('generateAudioInput');
                if(audioInput) audioInput.checked = p.generate_audio;
            }
            if(Array.isArray(p.reference_images)) StudioRefUpload.setReferenceImages(p.reference_images);
            if(Array.isArray(p.reference_videos)) videoRefGrid?.setUrls(p.reference_videos);
            if(Array.isArray(p.reference_audios)) audioRefGrid?.setUrls(p.reference_audios);
        };

        window.addEventListener('message', e => {
            if(e.data?.type === 'studio-lang' && window.StudioI18n){
                StudioI18n.set(e.data.lang);
                syncGenBtnState();
                syncSeedanceRefSections();
            }
        });
        if(window.StudioI18n) document.title = tr('video.title');
        StudioRefUpload.init({ tr, escapeHtml, referenceFormat: 'video' });
        initMediaRefUploads();
        syncSeedanceRefSections();
        syncSeedanceExtraOptions();
        syncGenBtnState();
        loadConfig();
        resumePendingJobs();
        StudioApiProviders.onProvidersChanged(refreshApiProviders);
    </script>
</body>
</html>
