<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
    <title>AI 对话</title>
    <script>
        (function(){
            try {
                localStorage.setItem('studio_theme', 'light');
                localStorage.setItem('canvas_theme', 'light');
            } catch(e) {}
        })();
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="/static/theme.js?v=20260520-magnific-light"></script>
    <script src="/static/i18n.js?v=20260520-ai-chat"></script>
    <link rel="stylesheet" href="/static/studio-magnific.css?v=20260520-ui-fix">
    <link rel="stylesheet" href="/static/studio-panel.css?v=20260530-panel-radius">
    <link rel="stylesheet" href="/static/theme.css?v=20260520-panel-26">
    <link rel="stylesheet" href="/static/chat-magnific.css?v=20260530-input-38">
    <link rel="stylesheet" href="/static/studio-pullup-select.css?v=20260530-pullup-select">
    <script src="/static/studio-provider-label.js?v=20260530-provider-sync"></script>
    <script src="/static/studio-api-providers.js?v=20260530-provider-sync"></script>
    <script src="/static/studio-pullup-select.js?v=20260530-apimart-bear"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;800&display=swap');
        :root { --accent:#ff4d94; --bg:#1a1a1a; --card:#1a1a1a; --soft:#313131; --line:rgba(255,255,255,.08); --text:#f5f5f5; --muted:#a3a3a3; --faint:#737373; --ease:cubic-bezier(0.22,1,0.36,1); --content-width:1160px; --chat-radius:12px; --panel-radius:12px; --panel-control-bg:#262626; --panel-gap:10px; }
        * { box-sizing:border-box; }
        body { margin:0; height:100vh; overflow:hidden; background:var(--bg); color:var(--text); font-family:var(--mg-font,'Inter',-apple-system,sans-serif); -webkit-font-smoothing:antialiased; }
        .chat-shell { height:100vh; display:flex; flex-direction:column; min-width:0; background:var(--bg); position:relative; }
        .topbar { height:82px; padding:0 36px; border-bottom:1px solid var(--line); background:rgb(26,26,26); z-index:5; }
        .topbar-inner { width:min(var(--content-width),100%); height:100%; margin:0 auto; display:flex; align-items:center; justify-content:space-between; gap:18px; }
        .title-block { min-width:0; }
        .title-block h1 { font-size:14px; font-weight:600; letter-spacing:.02em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; color:var(--text); }
        .title-block p { margin-top:5px; font-size:10px; color:var(--muted); font-weight:600; }
        .top-actions { display:flex; align-items:center; gap:10px; position:relative; }
        .action-btn { height:40px; min-width:40px; padding:0 12px; border-radius:var(--chat-radius); display:flex; align-items:center; justify-content:center; gap:8px; background:var(--soft); border:1px solid var(--line); color:var(--muted); font-size:10px; font-weight:600; letter-spacing:.04em; transition:all .2s var(--ease); }
        .action-btn:hover { background:#3a3a3a; color:var(--text); border-color:rgba(255,255,255,.12); }
        .history-popover { position:absolute; top:54px; right:0; width:min(360px,calc(100vw - 36px)); max-height:520px; overflow:hidden; background:var(--card); border:1px solid var(--line); border-radius:var(--chat-radius); box-shadow:0 24px 60px rgba(0,0,0,.4); padding:12px; display:none; z-index:20; }
        .history-popover.open { display:block; animation:popIn .18s var(--ease); }
        .history-title { font-size:10px; font-weight:600; letter-spacing:.04em; color:var(--faint); }
        .history-close { color:var(--faint); transition:color .15s ease; }
        .history-close:hover { color:var(--text); }
        .thread-list { max-height:430px; overflow:auto; display:flex; flex-direction:column; gap:8px; padding-right:2px; }
        .thread-row { display:grid; grid-template-columns:minmax(0,1fr) 34px; gap:6px; align-items:stretch; }
        .thread-item { width:100%; border:1px solid transparent; background:var(--soft); border-radius:var(--chat-radius); padding:13px 14px; text-align:left; transition:all .2s var(--ease); min-height:58px; min-width:0; color:var(--muted); }
        .thread-item:hover { background:#3a3a3a; color:var(--text); }
        .thread-item.active { background:rgba(255,77,148,.14); color:var(--text); border-color:rgba(255,77,148,.35); box-shadow:0 0 0 1px rgba(255,77,148,.12); }
        .thread-delete { width:34px; border-radius:var(--chat-radius); display:flex; align-items:center; justify-content:center; color:var(--faint); transition:all .2s var(--ease); }
        .thread-delete:hover { background:rgba(255,77,148,.12); color:var(--accent); }
        .messages { flex:1; overflow:auto; padding:34px 42px 200px; display:flex; flex-direction:column; align-items:center; gap:18px; background:var(--bg); }
        .bubble-row { width:min(var(--content-width),100%); display:flex; gap:12px; align-items:flex-end; }
        .bubble-row.user { justify-content:flex-end; }
        .bubble { max-width:min(780px,78%); border-radius:var(--chat-radius); padding:15px 18px; font-size:14px; line-height:1.7; white-space:pre-wrap; word-break:break-word; }
        .bubble.user { background:var(--accent); color:#fff; box-shadow:0 4px 14px rgba(255,77,148,.22); }
        .bubble.assistant { background:var(--card); border:1px solid var(--line); color:var(--text); box-shadow:0 2px 16px rgba(0,0,0,.24); }
        .bubble.assistant.streaming::after { content:""; display:inline-block; width:7px; height:1.2em; margin-left:3px; border-radius:4px; background:var(--accent); vertical-align:-.2em; animation:cursorBlink .9s steps(2,end) infinite; }
        .bubble img.generated { display:block; width:min(460px,100%); border-radius:var(--chat-radius); margin-top:10px; border:1px solid var(--line); cursor:zoom-in; }
        .thumbs { display:flex; flex-wrap:wrap; gap:8px; margin-top:10px; }
        .thumb { width:58px; height:58px; border-radius:var(--chat-radius); object-fit:cover; border:1px solid rgba(255,255,255,.18); }
        .assistant .thumb { border-color:var(--line); }
        .composer-wrap { position:absolute; left:0; right:0; bottom:0; padding:0 42px 24px; background:transparent; pointer-events:none; }
        .composer-body { width:min(var(--content-width),100%); margin:0 auto; display:flex; flex-direction:column; gap:var(--panel-gap); background:transparent; border:none; box-shadow:none; padding:0; pointer-events:auto; }
        .composer-body.drag-over .chat-prompt-input { border-color:rgba(255,77,148,.35) !important; box-shadow:0 0 0 3px rgba(255,77,148,.12) !important; }
        .chat-prompt-input { min-height:88px; max-height:168px; font-size:12px; line-height:1.65; padding:12px 14px; box-sizing:border-box; background:rgb(38,38,38); }
        .chat-prompt-input::placeholder { color:#737373; }
        .composer-inside-foot { display:flex; align-items:flex-end; justify-content:space-between; gap:12px; }
        .left-tools { display:flex; align-items:center; gap:8px; min-width:0; flex-wrap:wrap; flex:1; }
        .chat-model-row { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:var(--panel-gap); width:min(420px,100%); }
        .chat-model-row .size-select { width:100%; min-width:0; }
        .send-btn { width:44px; height:44px; border-radius:var(--chat-radius); display:flex; align-items:center; justify-content:center; background:var(--accent); color:#fff; transition:all .2s var(--ease); flex:0 0 auto; box-shadow:0 4px 14px rgba(255,77,148,.28); border:none; cursor:pointer; }
        .send-btn:hover:not(:disabled) { background:#e8437f; transform:translateY(-1px); box-shadow:0 6px 18px rgba(255,77,148,.34); }
        .send-btn:disabled { opacity:.45; cursor:not-allowed; }
        .ref-strip { display:flex; align-items:center; gap:8px; overflow:auto; min-width:0; max-width:680px; min-height:0; }
        .ref-strip:empty { display:none; }
        .ref-chip { position:relative; width:54px; height:54px; border-radius:var(--chat-radius); overflow:hidden; border:1px solid var(--line); background:var(--card); flex:0 0 auto; }
        .ref-chip img { width:100%; height:100%; object-fit:cover; }
        .ref-chip button { position:absolute; top:3px; right:3px; width:18px; height:18px; border-radius:50%; background:rgba(49,49,49,.92); color:var(--text); font-size:12px; line-height:18px; border:1px solid var(--line); }
        .ms-badge { display:inline-flex; align-items:center; gap:4px; font-size:9px; font-weight:800; letter-spacing:.12em; text-transform:uppercase; background:#313131; color:#7ee787; border-radius:var(--chat-radius); padding:3px 8px; border:1px solid var(--line); }
        .empty-history { padding:32px 12px; text-align:center; font-size:11px; font-weight:600; color:var(--faint); letter-spacing:.04em; }
        @keyframes popIn { from { opacity:0; transform:translateY(-6px) scale(.98); } to { opacity:1; transform:translateY(0) scale(1); } }
        @keyframes cursorBlink { 0%,45% { opacity:1; } 46%,100% { opacity:0; } }
        @media (max-width:900px){
            .topbar { padding-left:18px; padding-right:18px; }
            .messages { padding:24px 18px 220px; }
            .composer-wrap { padding:0 18px 20px; }
            .chat-model-row { width:100%; grid-template-columns:1fr; }
            .composer-inside-foot { align-items:flex-end; }
            .ref-strip { max-width:100%; }
            .bubble { max-width:88%; }
            .action-btn span { display:none; }
        }
    </style>
</head>
<body class="mg-studio theme-dark">
    <div class="chat-shell">
        <header class="topbar">
            <div class="topbar-inner">
                <div class="title-block">
                    <h1 id="chatTitle" data-i18n="chat.newConversation">新对话</h1>
                    <p id="modelLabel">Ready</p>
                </div>
                <div class="top-actions">
                    <button onclick="newConversation()" class="action-btn" title="新建对话" data-i18n-title="chat.newConversation"><i data-lucide="plus" class="w-4 h-4"></i><span data-i18n="chat.new">NEW</span></button>
                    <button onclick="toggleHistory()" class="action-btn" title="历史对话" data-i18n-title="chat.history"><i data-lucide="history" class="w-4 h-4"></i><span data-i18n="chat.history">HISTORY</span></button>
                    <div id="historyPopover" class="history-popover">
                        <div class="flex items-center justify-between px-2 pb-3">
                            <span class="history-title" data-i18n="chat.historyTitle">Conversations</span>
                            <button onclick="toggleHistory(false)" class="history-close"><i data-lucide="x" class="w-4 h-4"></i></button>
                        </div>
                        <div id="threadList" class="thread-list"></div>
                    </div>
                </div>
            </div>
        </header>

        <section id="messages" class="messages"></section>

        <div class="composer-wrap">
            <div id="composerBody" class="composer-body">
                <textarea id="messageInput" rows="3" class="nano-input chat-prompt-input w-full outline-none resize-none" placeholder="输入消息，Enter 发送..." data-i18n-placeholder="chat.inputPlaceholder" oninput="autoGrow(this)" onkeydown="handleKey(event)"></textarea>
                <div id="refStrip" class="ref-strip"></div>
                <div class="composer-inside-foot">
                    <div class="left-tools">
                        <div class="chat-model-row">
                            <select id="providerSelect" class="size-select" onchange="setProvider(this.value)"></select>
                            <select id="modelSelect" class="size-select" onchange="setActiveModel(this.value)"></select>
                        </div>
                    </div>
                    <button id="sendBtn" onclick="sendMessage()" class="send-btn glass-btn" title="发送" data-i18n-title="chat.send"><i data-lucide="send" class="w-5 h-5"></i></button>
                </div>
            </div>
        </div>
    </div>

    <script>
        lucide.createIcons();
        function tr(key){ return window.StudioI18n ? StudioI18n.t(key) : key; }
        function defaultTitle(){ return tr('chat.newConversation'); }
        function setChatTitle(title){
            document.getElementById('chatTitle').textContent = title || defaultTitle();
        }
        function applyLanguage(lang){
            if(lang && window.StudioI18n) StudioI18n.set(lang);
            document.title = tr('chat.title');
            if(!currentConversation?.title || currentConversation.title === '新对话' || currentConversation.title === 'New Chat') setChatTitle('');
            renderThreads();
        }
        window.addEventListener('message', event => {
            if(event.data?.type === 'studio-lang') applyLanguage(event.data.lang);
        });
        window.addEventListener('studio-lang-change', () => {
            document.title = tr('chat.title');
            if(!currentConversation?.title || currentConversation.title === '新对话' || currentConversation.title === 'New Chat') setChatTitle('');
            renderThreads();
        });
        function uuid(){
            if(crypto?.randomUUID) return crypto.randomUUID();
            return 'u-' + Math.random().toString(16).slice(2) + Date.now();
        }

        const USER_KEY = 'gpt_chat_browser_user';
        const userId = localStorage.getItem(USER_KEY) || uuid();
        localStorage.setItem(USER_KEY, userId);

        let conversations = [];
        let currentConversation = null;
        let provider = 'comfly';
        let activeChatModel = '';
        let apiProviders = [];
        let chatProviderModels = {};
        let refs = [];
        let config = { chat_model: 'gpt-5.5', chat_models: [] };

        const headers = () => ({'Content-Type':'application/json', 'X-User-ID':userId});

        function uniqueModels(list){
            const seen = new Set();
            return (list || []).map(item => String(item || '').trim()).filter(item => item && !seen.has(item) && seen.add(item));
        }
        function panelProviders(){
            const list = StudioApiProviders.enabledProviders(apiProviders);
            if(list.length) return list;
            return [{id:'comfly', name:'API', has_key:false, enabled:true, chat_models:[config.chat_model || 'gpt-4o-mini']}];
        }
        function chatProviders(){
            return panelProviders();
        }
        function providerById(id){
            const list = chatProviders();
            return list.find(p => p.id === id) || list[0];
        }
        function modelListForCurrent(){
            return uniqueModels(providerById(provider)?.chat_models);
        }
        function renderProviderControls(deletedId){
            const providerSelect = document.getElementById('providerSelect');
            const modelSelect = document.getElementById('modelSelect');
            const providers = chatProviders();
            if(!providers.length) return;
            provider = StudioApiProviders.resolveProviderId(provider, providers, { deletedId, preferApimart: true });
            const models = modelListForCurrent();
            if(!models.includes(activeChatModel)) {
                activeChatModel = chatProviderModels[provider] && models.includes(chatProviderModels[provider])
                    ? chatProviderModels[provider]
                    : (models[0] || config.chat_model);
            }
            providerSelect.innerHTML = StudioApiProviders.buildProviderOptionsHtml(providers, provider, escapeHtml);
            modelSelect.innerHTML = models.map(m => `<option value="${escapeHtml(m)}" ${m === activeChatModel ? 'selected' : ''}>${escapeHtml(m)}</option>`).join('');
        }

        async function refreshApiProviders(payload){
            try {
                const data = await fetch('/api/config').then(r=>r.json());
                config = { ...config, ...data };
                apiProviders = await StudioApiProviders.fetchProviderList();
                config.chat_model = (config.chat_models || []).find(m => m === 'gpt-5.5') || config.chat_model || 'gpt-5.5';
                provider = StudioApiProviders.resolveProviderId(provider, chatProviders(), { deletedId: payload && payload.deletedId, preferApimart: true });
                activeChatModel = chatProviderModels[provider] || providerById(provider)?.chat_models?.[0] || config.chat_model;
            } catch(e) {
                try { apiProviders = await StudioApiProviders.fetchProviderList(); } catch(err) {}
            }
            renderProviderControls(payload && payload.deletedId);
            updateModelLabel();
        }

        async function loadConfig(){
            try {
                const data = await fetch('/api/config').then(r=>r.json());
                config = { ...config, ...data };
                apiProviders = await StudioApiProviders.fetchProviderList();
                config.chat_model = (config.chat_models || []).find(m => m === 'gpt-5.5') || config.chat_model || 'gpt-5.5';
                provider = StudioApiProviders.resolveProviderId(provider, chatProviders(), { preferApimart: true });
                activeChatModel = chatProviderModels[provider] || providerById(provider)?.chat_models?.[0] || config.chat_model;
                renderProviderControls();
                updateModelLabel();
            } catch(e) {}
        }
        StudioApiProviders.onProvidersChanged(refreshApiProviders);

        function setProvider(p) {
            const item = panelProviders().find(x => x.id === p);
            if(item && !StudioApiProviders.providerHasKey(item)){
                StudioApiProviders.promptMissingKey(item);
            }
            provider = p;
            const models = modelListForCurrent();
            activeChatModel = chatProviderModels[provider] && models.includes(chatProviderModels[provider])
                ? chatProviderModels[provider]
                : (models[0] || activeChatModel);
            renderProviderControls();
            updateModelLabel();
        }
        function setActiveModel(model){
            activeChatModel = model;
            chatProviderModels[provider] = model;
            updateModelLabel();
        }

        async function loadConversations(){
            const data = await fetch('/api/conversations', {headers:{'X-User-ID':userId}}).then(r=>r.json());
            conversations = data.conversations || [];
            renderThreads();
            if(!currentConversation && conversations[0]) await openConversation(conversations[0].id);
            if(!currentConversation) renderMessages([]);
        }

        function renderThreads(){
            const list = document.getElementById('threadList');
            list.innerHTML = '';
            if(!conversations.length){
                list.innerHTML = `<div class="empty-history">${tr('chat.noHistory')}</div>`;
                return;
            }
            conversations.forEach(item => {
                const row = document.createElement('div');
                row.className = 'thread-row';
                const btn = document.createElement('button');
                btn.className = `thread-item ${currentConversation?.id === item.id ? 'active' : ''}`;
                btn.onclick = () => openConversation(item.id, true);
                btn.innerHTML = `<div class="text-sm font-bold truncate">${escapeHtml(item.title || defaultTitle())}</div><div class="text-[11px] opacity-50 truncate mt-1">${escapeHtml(item.last_message || '')}</div>`;
                const del = document.createElement('button');
                del.className = 'thread-delete';
                del.title = tr('chat.deleteTitle');
                del.onclick = (event) => deleteConversation(item.id, event);
                del.innerHTML = '<i data-lucide="trash-2" class="w-4 h-4"></i>';
                row.appendChild(btn);
                row.appendChild(del);
                list.appendChild(row);
            });
            lucide.createIcons();
        }

        async function newConversation(){
            const data = await fetch('/api/conversations', {method:'POST', headers:headers(), body:JSON.stringify({title:'新对话'})}).then(r=>r.json());
            currentConversation = data.conversation;
            setChatTitle(currentConversation.title);
            await loadConversations();
            renderMessages([]);
            toggleHistory(false);
        }

        async function openConversation(id, closePanel=false){
            const data = await fetch(`/api/conversations/${id}`, {headers:{'X-User-ID':userId}}).then(r=>r.json());
            currentConversation = data.conversation;
            setChatTitle(currentConversation.title);
            renderThreads();
            renderMessages(currentConversation.messages || []);
            if(closePanel) toggleHistory(false);
        }

        async function deleteConversation(id, event){
            event.stopPropagation();
            if(!confirm(tr('chat.deleteConfirm'))) return;
            await fetch(`/api/conversations/${id}`, {method:'DELETE', headers:{'X-User-ID':userId}});
            const deletedCurrent = currentConversation?.id === id;
            if(deletedCurrent){ currentConversation = null; setChatTitle(''); renderMessages([]); }
            await loadConversations();
            if(deletedCurrent && conversations[0]) await openConversation(conversations[0].id);
        }

        function toggleHistory(force){
            const pop = document.getElementById('historyPopover');
            const shouldOpen = typeof force === 'boolean' ? force : !pop.classList.contains('open');
            pop.classList.toggle('open', shouldOpen);
            if(shouldOpen) lucide.createIcons();
        }

        document.addEventListener('click', (event) => {
            const actions = document.querySelector('.top-actions');
            if(actions && !actions.contains(event.target)) toggleHistory(false);
        });

        function updateModelLabel(){
            document.getElementById('modelLabel').textContent = activeChatModel || config.chat_model || 'Chat';
        }

        function renderMessages(messages){
            const box = document.getElementById('messages');
            box.innerHTML = '';
            if(!messages.length){
                box.innerHTML = `<div class="m-auto text-center opacity-20"><i data-lucide="messages-square" class="w-14 h-14 mx-auto stroke-[1px]"></i><div class="text-[10px] font-black tracking-[0.5em] uppercase mt-4">${tr('chat.ready')}</div></div>`;
                lucide.createIcons();
                return;
            }
            messages.forEach(addMessageBubble);
            scrollBottom();
        }

        function addMessageBubble(msg){
            const box = document.getElementById('messages');
            const row = document.createElement('div');
            row.className = `bubble-row ${msg.role === 'user' ? 'user' : 'assistant'}`;
            const bubble = document.createElement('div');
            bubble.className = `bubble ${msg.role === 'user' ? 'user' : 'assistant'}`;
            const text = document.createElement('div');
            text.textContent = msg.type === 'image' ? tr('chat.generated') : (msg.content || '');
            text.className = 'bubble-text';
            bubble.appendChild(text);
            if(msg.attachments?.length){
                const thumbs = document.createElement('div');
                thumbs.className = 'thumbs';
                msg.attachments.forEach(ref => thumbs.insertAdjacentHTML('beforeend', `<img class="thumb" src="${ref.url}">`));
                bubble.appendChild(thumbs);
            }
            if(msg.image_url){
                const img = document.createElement('img');
                img.className = 'generated';
                img.src = msg.image_url;
                img.onclick = () => window.open(msg.image_url, '_blank');
                bubble.appendChild(img);
            }
            // Show model badge for assistant messages
            if(msg.role === 'assistant' && msg.model){
                const badge = document.createElement('div');
                const modelShort = msg.model.split('/').pop().split(':')[0];
                const isMs = msg.model.includes('/') && !msg.model.includes('gpt');
                badge.style.cssText = `margin-top:8px;font-size:9px;font-weight:700;opacity:.45;letter-spacing:.06em;`;
                badge.textContent = modelShort;
                bubble.appendChild(badge);
            }
            row.appendChild(bubble);
            box.appendChild(row);
            return {row, bubble, text};
        }

        async function uploadFiles(files){
            if(!files?.length) return;
            const form = new FormData();
            [...files].slice(0, 4 - refs.length).forEach(file => form.append('files', file));
            const data = await fetch('/api/ai/upload', {method:'POST', body:form}).then(r=>r.json());
            refs.push(...(data.files || []));
            renderRefs();
        }

        function renderRefs(){
            const strip = document.getElementById('refStrip');
            strip.innerHTML = refs.map((ref,i) => `<div class="ref-chip"><img src="${ref.url}"><button onclick="removeRef(${i})">×</button></div>`).join('');
        }

        function removeRef(i){ refs.splice(i,1); renderRefs(); }

        window.addEventListener('paste', e => {
            const files = [...(e.clipboardData?.items || [])].filter(x => x.kind === 'file' && x.type.startsWith('image/')).map(x => x.getAsFile());
            if(files.length) uploadFiles(files);
        });

        const composerBody = document.getElementById('composerBody');
        composerBody.addEventListener('dragover', e => {
            if(!hasImageFiles(e.dataTransfer?.items)) return;
            e.preventDefault();
            composerBody.classList.add('drag-over');
        });
        composerBody.addEventListener('dragleave', e => {
            if(!composerBody.contains(e.relatedTarget)) composerBody.classList.remove('drag-over');
        });
        composerBody.addEventListener('drop', e => {
            if(!hasImageFiles(e.dataTransfer?.items)) return;
            e.preventDefault();
            composerBody.classList.remove('drag-over');
            const files = [...(e.dataTransfer?.files || [])].filter(file => file.type.startsWith('image/'));
            uploadFiles(files);
        });

        function hasImageFiles(items){ return [...(items || [])].some(item => item.kind === 'file' && item.type.startsWith('image/')); }
        function autoGrow(el){ el.style.height = 'auto'; el.style.height = Math.min(el.scrollHeight, 168) + 'px'; }
        function handleKey(e){ if(e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); sendMessage(); } }

        async function sendMessage(){
            const input = document.getElementById('messageInput');
            const message = input.value.trim();
            if(!message) return;
            if(!StudioApiProviders.guardProviderKey(provider, panelProviders())) return;
            const btn = document.getElementById('sendBtn');
            btn.disabled = true;
            const pendingRefs = refs.slice();
            refs = [];
            renderRefs();
            input.value = '';
            autoGrow(input);
            if(!currentConversation){
                currentConversation = {id:'', title:'新对话', messages:[]};
                document.getElementById('messages').innerHTML = '';
            }
            addMessageBubble({role:'user', content:message, attachments:pendingRefs});
            const assistantBubble = addMessageBubble({role:'assistant', content: ''});
            assistantBubble.bubble.classList.add('streaming');
            scrollBottom();
            try {
                await streamChatMessage(message, pendingRefs, assistantBubble);
            } catch(err) {
                renderMessages([...(currentConversation.messages || []), {role:'assistant', content:err.message || tr('chat.requestFailed')}]);
            } finally {
                btn.disabled = false;
                scrollBottom();
            }
        }

        async function streamChatMessage(message, pendingRefs, assistantBubble){
            const currentProvider = provider;
            const currentChatModel = activeChatModel || config.chat_model;

            const res = await fetch('/api/chat/stream', {
                method:'POST',
                headers:headers(),
                body:JSON.stringify({
                    conversation_id: currentConversation.id || '',
                    message,
                    mode:'chat',
                    model: currentChatModel,
                    provider: currentProvider,
                    reference_images: pendingRefs
                })
            });
            if(!res.ok) throw new Error((await res.json()).detail || tr('chat.requestFailed'));
            const reader = res.body.getReader();
            const decoder = new TextDecoder();
            let buffer = '';
            let fullText = '';
            while(true){
                const {value, done} = await reader.read();
                if(done) break;
                buffer += decoder.decode(value, {stream:true});
                const events = buffer.split('\n\n');
                buffer = events.pop() || '';
                for(const eventText of events){
                    const line = eventText.split('\n').find(item => item.startsWith('data:'));
                    if(!line) continue;
                    const event = JSON.parse(line.slice(5).trim());
                    if(event.type === 'meta'){
                        currentConversation = event.conversation;
                        setChatTitle(currentConversation.title);
                    }
                    if(event.type === 'delta'){
                        fullText += event.delta || '';
                        assistantBubble.text.textContent = fullText;
                        scrollBottom();
                    }
                    if(event.type === 'error') throw new Error(event.detail || tr('chat.requestFailed'));
                    if(event.type === 'done'){
                        assistantBubble.bubble.classList.remove('streaming');
                        currentConversation = event.conversation;
                        setChatTitle(currentConversation.title);
                        renderMessages(currentConversation.messages || []);
                        await loadConversations();
                    }
                }
            }
            assistantBubble.bubble.classList.remove('streaming');
        }

        function scrollBottom(){ requestAnimationFrame(() => { const box = document.getElementById('messages'); box.scrollTop = box.scrollHeight; }); }
        function escapeHtml(str){ return String(str).replace(/[&<>"']/g, s => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s])); }

        window.onload = async () => {
            applyLanguage();
            await loadConfig();
            await loadConversations();
        };
    </script>
</body>
