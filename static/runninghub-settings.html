<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RunningHub 设置</title>
    <script>
        (function(){
            try {
                localStorage.setItem('studio_theme', 'light');
                localStorage.setItem('canvas_theme', 'light');
                document.documentElement.classList.add('studio-theme-dark');
                document.documentElement.classList.add('theme-dark');
            } catch(e) {}
        })();
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="/static/theme.js?v=20260520-magnific-light"></script>
    <script src="/static/i18n.js?v=20260530-rh-options"></script>
    <link rel="stylesheet" href="/static/studio-magnific.css?v=20260520-ui-fix">
    <link rel="stylesheet" href="/static/runninghub-settings.css?v=20260530-rh-options">
    <link rel="stylesheet" href="/static/settings-magnific.css?v=20260530-field-schema">
    <link rel="stylesheet" href="/static/theme.css?v=20260520-panel-26">
    <link rel="stylesheet" href="/static/studio-pullup-select.css?v=20260530-pullup-select">
    <script src="/static/studio-pullup-select.js?v=20260530-pullup-select"></script>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; }
        button { font-family: inherit; cursor: pointer; border: 0; background: transparent; color: inherit; }
        .page { min-height: 100vh; padding: 40px 32px 80px; }
        .wrap { max-width: 1100px; margin: 0 auto; }
        .page-head { padding: 0 4px 28px; display: flex; justify-content: space-between; align-items: end; gap: 24px; flex-wrap: wrap; }
        .page-head .title { font-size: 26px; line-height: 1.05; font-weight: 900; letter-spacing: -0.015em; }
        .page-head .sub { margin-top: 8px; font-size: 12.5px; line-height: 1.55; font-weight: 600; max-width: 640px; }
        .page-head .status { font-size: 11.5px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; min-height: 16px; }
        .layout { display: grid; grid-template-columns: 260px minmax(0, 1fr); gap: 24px; align-items: start; }
        .workflow-list { display: flex; flex-direction: column; gap: 6px; padding-bottom: 8px; border-bottom: 1px solid rgba(255, 255, 255, 0.08); margin-bottom: 4px; }
        .workflow-card { width: 100%; text-align: left; border: 1px solid transparent; background: transparent; padding: 8px 10px; display: flex; align-items: center; gap: 10px; min-height: 48px; }
        .workflow-mark { width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; flex: 0 0 auto; }
        .workflow-name { min-width: 0; font-size: 12.5px; font-weight: 800; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .workflow-meta { margin-top: 1px; font-size: 10px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .field-frame input, .field-frame select, .field-frame textarea { width: 100%; border: 0; background: transparent; outline: none; }
        .field-frame input, .field-frame select { height: 30px; padding: 0 10px; font-size: 12px; font-weight: 650; }
        .field-frame textarea { min-height: 72px; padding: 8px 10px; resize: vertical; font-size: 12px; font-weight: 650; }
        .rh-node-block .node-list { grid-template-columns: 1fr; }
        .node-list { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; align-items: start; width: 100%; }
        .node-card { overflow: hidden; min-width: 0; height: fit-content; }
        .node-card.expanded { grid-column: 1 / -1; }
        .node-card-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; cursor: pointer; user-select: none; min-height: 72px; }
        .node-card.expanded .node-card-head { min-height: 0; }
        .node-card-head > div:first-child { min-width: 0; flex: 1; }
        .node-class { font-size: 12px; font-weight: 850; line-height: 1.35; word-break: break-word; }
        .node-meta { font-size: 10px; font-weight: 700; margin-top: 4px; line-height: 1.45; word-break: break-word; }
        .node-card-head .node-head-actions { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; flex: 0 0 auto; }
        .node-chev { transition: transform 0.22s cubic-bezier(0.22, 1, 0.36, 1); }
        .node-card.expanded .node-chev { transform: rotate(180deg); }
        .node-inputs { display: none; flex-direction: column; }
        .node-card.expanded .node-inputs { display: flex; }
        .input-row { display: grid; grid-template-columns: 32px minmax(0, 1fr); gap: 10px; align-items: start; min-width: 0; }
        .input-key { font-size: 12px; font-weight: 800; }
        .input-orig { font-size: 10.5px; font-weight: 700; margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        @media (max-width: 900px) {
            .layout { grid-template-columns: 1fr; }
        }
        @media (max-width: 560px) {
            .node-list { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body class="mg-studio theme-dark studio-theme-dark settings-page rh-settings">
    <div class="page">
        <div class="wrap">
            <header class="page-head">
                <div>
                    <div class="title" data-i18n="rh.title">RunningHub 设置</div>
                    <div class="sub" data-i18n="rh.subtitle">配置 RunningHub API Key 与云端 ComfyUI 工作流。从 RunningHub 工作流页面地址栏获取 Workflow ID，并设置要在画布节点上暴露的参数。</div>
                </div>
                <div id="status" class="status"></div>
            </header>

            <div class="layout">
                <aside class="sidebar">
                    <div class="side-section-title" data-i18n="rh.workflowList">工作流列表</div>
                    <div id="workflowList" class="workflow-list"></div>
                    <button class="add-btn" type="button" onclick="addWorkflow()" data-i18n-title="rh.addWorkflow"><i data-lucide="plus" class="w-4 h-4"></i></button>
                </aside>

                <main class="content rh-settings-main">
                    <header class="rh-editor-header" id="rhEditorHeader">
                        <div class="rh-editor-header-top">
                            <div>
                                <h2 id="editorTitle" class="rh-editor-title">—</h2>
                                <p class="rh-editor-sub" data-i18n="rh.editorSub">配置 Workflow ID 与暴露参数</p>
                            </div>
                        </div>
                    </header>

                    <section class="rh-card" id="apiKeyCard">
                        <h3 class="rh-card-title" data-i18n="rh.apiKeyBlock">API Key</h3>
                        <div class="rh-key-row">
                            <div class="field-frame"><input id="apiKeyInput" type="password" placeholder="输入 RunningHub API Key"></div>
                            <button class="action-btn save-btn settings-btn" type="button" onclick="saveApiKey()"><i data-lucide="save"></i><span data-i18n="rh.saveApiKey">保存 Key</span></button>
                        </div>
                        <span id="keyHint" class="rh-key-hint"></span>
                    </section>

                    <section class="rh-card" id="workflowBasicsCard" hidden>
                        <h3 class="rh-card-title" data-i18n="rh.workflowConfig">Workflow Configuration</h3>
                        <div class="rh-form-stack">
                            <label class="rh-field">
                                <span class="rh-field-label" data-i18n="rh.workflowName">Display name</span>
                                <div class="field-frame"><input id="wfNameInput" type="text" placeholder="文生图"></div>
                            </label>
                            <label class="rh-field full">
                                <span class="rh-field-label">Workflow ID</span>
                                <div class="rh-wf-id-row">
                                    <div class="field-frame"><input id="wfIdInput" type="text" placeholder="1850925505116598274"></div>
                                    <div class="rh-btn-group">
                                        <button class="action-btn settings-btn" type="button" id="fetchJsonBtn" onclick="fetchWorkflowJson()"><i data-lucide="download-cloud"></i><span data-i18n="rh.fetchJson">拉取 JSON</span></button>
                                        <button class="ghost-btn settings-btn" type="button" onclick="autoExposeSuggested()"><i data-lucide="wand-2"></i><span data-i18n="rh.autoExpose">智能暴露</span></button>
                                    </div>
                                </div>
                            </label>
                        </div>
                    </section>

                    <section class="rh-card" id="workflowParamsCard" hidden>
                        <div class="rh-card-head">
                            <h3 class="rh-card-title" data-i18n="rh.paramsTitle">暴露参数</h3>
                            <button class="ghost-btn settings-btn" type="button" onclick="addParam()"><i data-lucide="plus"></i><span data-i18n="rh.addParam">添加参数</span></button>
                        </div>
                        <div id="rhNodeBlock" class="rh-node-block" hidden>
                            <div id="nodeExplorer" class="node-explorer">
                                <div class="node-explorer-head">
                                    <div>
                                        <h4 class="rh-node-block-title" data-i18n="rh.nodeExplorer">工作流节点</h4>
                                    </div>
                                </div>
                                <div id="nodeList" class="node-list"></div>
                            </div>
                        </div>
                        <div id="paramList" class="rh-param-list"></div>
                    </section>

                    <div class="rh-action-bar rh-action-bar--footer" id="rhActionBar" hidden>
                        <button id="deleteBtn" class="action-btn danger-btn settings-btn" type="button" onclick="deleteWorkflow()"><i data-lucide="trash-2"></i><span data-i18n="rh.delete">删除</span></button>
                        <button class="action-btn save-btn settings-btn" type="button" onclick="saveConfig()"><i data-lucide="save"></i><span data-i18n="rh.save">保存</span></button>
                    </div>
                </main>
            </div>
        </div>
    </div>

    <script>
        let config = { has_key: false, key_preview: '', workflows: [] };
        let selectedId = '';
        let rhWorkflowJson = null;
        let rhSuggestedFields = [];
        let rhInputMeta = {};
        const RH_SDXL_DIMENSIONS = [
            '1536 x 640 (landscape)', '1344 x 768 (landscape)', '1216 x 832 (landscape)',
            '1152 x 896 (landscape)', '1024 x 1024 (square)', '896 x 1152 (portrait)',
            '832 x 1216 (portrait)', '768 x 1344 (portrait)', '640 x 1536 (portrait)',
        ];
        const RH_SAMPLER_NAMES = [
            'euler', 'euler_ancestral', 'heun', 'heunpp2', 'dpm_2', 'dpm_2_ancestral', 'lms',
            'dpm_fast', 'dpm_adaptive', 'dpmpp_2s_ancestral', 'dpmpp_sde', 'dpmpp_2m',
            'dpmpp_sde_gpu', 'dpmpp_3m_sde', 'dpmpp_3m_sde_gpu', 'ddpm', 'lcm', 'uni_pc', 'uni_pc_bh2',
        ];
        const RH_SCHEDULERS = ['normal', 'karras', 'exponential', 'sgm_uniform', 'simple', 'ddim_uniform', 'beta'];
        const RH_SELECT_PRESETS = {
            dimensions: RH_SDXL_DIMENSIONS,
            resolution: RH_SDXL_DIMENSIONS,
            preset: RH_SDXL_DIMENSIONS,
            sampler_name: RH_SAMPLER_NAMES,
            scheduler: RH_SCHEDULERS,
        };
        function rhNormSpaces(text){ return String(text || '').trim().replace(/\s+/g, ' '); }
        function rhCanonicalOption(options, value){
            if(value === null || value === undefined || value === '') return value;
            const sv = String(value);
            if(options.includes(sv)) return sv;
            const nv = rhNormSpaces(sv);
            const hit = options.find(o => rhNormSpaces(o) === nv);
            return hit || sv;
        }
        function rhEnsureOptions(options, value){
            const opts = (options || []).map(o => String(o)).filter(Boolean);
            if(value === null || value === undefined || value === '') return opts;
            const canonical = rhCanonicalOption(opts, value);
            return opts.includes(canonical) ? opts : [String(canonical), ...opts];
        }
        function rhInferSelectOptions(node, fieldName, value){
            if(typeof value !== 'string') return null;
            const fn = String(fieldName || '').toLowerCase();
            if(/prompt|text|description|caption|提示|正向|负向/.test(fn) || value.length > 120) return null;
            if(/image|filename|path/.test(fn)) return null;
            const presets = RH_SELECT_PRESETS[fn];
            if(presets) return rhEnsureOptions(presets, value);
            if(/\d+\s*x\s*\d+/i.test(value)) return rhEnsureOptions(RH_SDXL_DIMENSIONS, value);
            return null;
        }
        function rhResolveFieldMeta(nodeId, fieldName, rawValue){
            const cached = rhInputMeta?.[nodeId]?.[fieldName];
            if(cached?.type === 'select' && (cached.options || []).length){
                const options = cached.options;
                return { type: 'select', options, default: rhCanonicalOption(options, rawValue) };
            }
            const node = rhWorkflowJson?.[nodeId];
            const selectOptions = rhInferSelectOptions(node, fieldName, rawValue);
            if(selectOptions){
                return { type: 'select', options: selectOptions, default: rhCanonicalOption(selectOptions, rawValue) };
            }
            return { type: guessRhType(rawValue, fieldName), options: [], default: rawValue };
        }
        const workflowList = document.getElementById('workflowList');
        const workflowBasicsCard = document.getElementById('workflowBasicsCard');
        const workflowParamsCard = document.getElementById('workflowParamsCard');
        const rhNodeBlock = document.getElementById('rhNodeBlock');
        const rhActionBar = document.getElementById('rhActionBar');
        const deleteBtn = document.getElementById('deleteBtn');
        const editorTitle = document.getElementById('editorTitle');
        const statusEl = document.getElementById('status');
        const apiKeyInput = document.getElementById('apiKeyInput');
        const keyHint = document.getElementById('keyHint');
        const wfNameInput = document.getElementById('wfNameInput');
        const wfIdInput = document.getElementById('wfIdInput');
        const paramList = document.getElementById('paramList');
        const nodeExplorer = document.getElementById('nodeExplorer');
        const nodeList = document.getElementById('nodeList');
        function tr(key){ return window.StudioI18n ? StudioI18n.t(key) : key; }
        function tf(key, vars={}){
            return Object.entries(vars).reduce((text, [k, v]) => text.replaceAll(`{${k}}`, String(v ?? '')), tr(key));
        }
        function refreshIcons(){ if(window.lucide) lucide.createIcons(); }
        function setStatus(text){ statusEl.textContent = text || ''; }
        function escapeHtml(str){ return String(str == null ? '' : str).replace(/[&<>"']/g, s => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s])); }
        function escapeAttr(str){ return escapeHtml(str).replace(/`/g, '&#96;'); }
        function uid(prefix='rh'){ return `${prefix}-${Math.random().toString(36).slice(2, 8)}`; }
        const RH_DATA_TYPES = ['text', 'textarea', 'number', 'image'];
        function rhFieldIsDropdown(field){
            rhNormalizeFieldSchema(field);
            return String(field.inputMethod || '').toLowerCase() === 'dropdown';
        }
        function rhSyncLegacyType(field){
            const dt = String(field.dataType || 'text').toLowerCase();
            const im = String(field.inputMethod || 'manual').toLowerCase();
            field.dataType = RH_DATA_TYPES.includes(dt) ? dt : 'text';
            field.inputMethod = im === 'dropdown' ? 'dropdown' : 'manual';
            field.type = field.inputMethod === 'dropdown' ? 'select' : field.dataType;
            return field;
        }
        function rhNormalizeFieldSchema(field){
            if(!field) return field;
            const legacy = String(field.type || 'text').toLowerCase();
            let dt = String(field.dataType || '').toLowerCase();
            let im = String(field.inputMethod || '').toLowerCase();
            if(!dt || !im){
                if(legacy === 'select'){
                    dt = dt || 'text';
                    im = im || 'dropdown';
                } else if(legacy === 'textarea'){
                    dt = 'textarea';
                    im = 'manual';
                } else if(RH_DATA_TYPES.includes(legacy)){
                    dt = legacy;
                    im = 'manual';
                } else {
                    dt = 'text';
                    im = 'manual';
                }
            }
            field.dataType = RH_DATA_TYPES.includes(dt) ? dt : 'text';
            field.inputMethod = im === 'dropdown' ? 'dropdown' : 'manual';
            return rhSyncLegacyType(field);
        }
        function rhSchemaFromResolved(resolved){
            if(resolved?.type === 'select'){
                return { dataType: 'text', inputMethod: 'dropdown' };
            }
            const dt = RH_DATA_TYPES.includes(String(resolved?.type || '').toLowerCase())
                ? String(resolved.type).toLowerCase()
                : 'text';
            return { dataType: dt, inputMethod: 'manual' };
        }
        function rhOptionsFromWorkflowJson(field){
            const nodeId = String(field?.nodeId || '').trim();
            const fieldName = String(field?.fieldName || '').trim();
            if(!nodeId || !fieldName) return [];
            const raw = rhWorkflowJson?.[nodeId]?.inputs?.[fieldName];
            const cached = rhInputMeta?.[nodeId]?.[fieldName];
            if(cached?.type === 'select' && (cached.options || []).length){
                return cached.options.map(o => String(o));
            }
            const resolved = rhResolveFieldMeta(nodeId, fieldName, raw ?? field.default);
            if((resolved.options || []).length){
                return resolved.options.map(o => String(o));
            }
            if(raw !== undefined && raw !== null && raw !== '' && typeof raw !== 'object'){
                return [String(raw)];
            }
            return [];
        }
        function rhEnsureOptionRows(options){
            const list = (options || []).map(o => String(o));
            return list.length ? list : [''];
        }
        function rhHydrateDropdownField(field, preferJson = false){
            if(!field || !rhFieldIsDropdown(field)) return;
            const raw = rhWorkflowJson?.[field.nodeId]?.inputs?.[field.fieldName];
            if(typeof raw === 'string' && !field.apiValue) field.apiValue = raw;
            const jsonOpts = rhOptionsFromWorkflowJson(field);
            const existing = (field.options || []).map(o => String(o)).filter(o => o.trim());
            if(preferJson || !existing.length){
                field.options = jsonOpts.length ? jsonOpts : rhEnsureOptionRows(existing);
            } else if(jsonOpts.length && jsonOpts.length > existing.length){
                field.options = jsonOpts;
            } else {
                field.options = rhEnsureOptionRows(field.options);
            }
            field.options = rhEnsureOptionRows(field.options);
            if(field.default !== undefined && field.default !== null && field.default !== ''){
                field.default = rhCanonicalOption(field.options.filter(o => o.trim()), field.default);
            } else {
                const first = field.options.find(o => String(o).trim());
                if(first !== undefined) field.default = first;
            }
            rhSyncLegacyType(field);
        }
        function renderParamOptionEditor(field, index){
            const opts = rhEnsureOptionRows(field.options);
            field.options = opts;
            const jsonOpts = rhOptionsFromWorkflowJson(field);
            const fromJsonHint = jsonOpts.length
                ? `<span class="rh-options-json-hint">${escapeHtml(tr('rh.optionsFromJson'))}</span>`
                : '';
            const rows = opts.map((opt, optIdx) => `
                <div class="rh-option-row">
                    <div class="field-frame"><input type="text" value="${escapeAttr(String(opt))}" placeholder="${escapeAttr(tr('rh.optionValue'))}" oninput="updateParamOption(${index}, ${optIdx}, this.value)"></div>
                    <button class="action-btn danger-btn rh-option-delete settings-btn" type="button" onclick="removeParamOption(${index}, ${optIdx})" title="${tr('rh.delete')}"><i data-lucide="x"></i></button>
                </div>
            `).join('');
            return `
                <div class="rh-param-options-block">
                    <div class="rh-param-options-head">
                        <span class="rh-field-label">${tr('rh.selectOptions')}</span>
                        ${fromJsonHint}
                        <button class="ghost-btn settings-btn rh-option-add" type="button" onclick="addParamOption(${index})"><i data-lucide="plus"></i><span>${tr('rh.addOption')}</span></button>
                    </div>
                    <div class="rh-option-list">${rows}</div>
                </div>
            `;
        }
        function normalizeAllWorkflowFieldSchemas(){
            (config.workflows || []).forEach(wf => {
                wf.fields = (wf.fields || []).map(f => rhNormalizeFieldSchema(f));
            });
        }
        window.toggleRhField = toggleRhField;
        window.updateRhFieldName = updateRhFieldName;
        window.fetchWorkflowJson = fetchWorkflowJson;
        window.autoExposeSuggested = autoExposeSuggested;

        function currentWorkflow(){
            return (config.workflows || []).find(w => w.id === selectedId) || null;
        }

        function renderWorkflowList(){
            const items = config.workflows || [];
            if(!items.length){
                workflowList.innerHTML = `<div class="hint" style="padding:8px 4px">${tr('rh.emptyList')}</div>`;
                return;
            }
            workflowList.innerHTML = items.map(item => {
                const active = item.id === selectedId ? 'active' : '';
                return `
                    <button class="workflow-card ${active}" type="button" onclick="selectWorkflow('${escapeHtml(item.id)}')">
                        <span class="workflow-mark"><i data-lucide="zap" class="w-4 h-4"></i></span>
                        <span class="min-w-0">
                            <div class="workflow-name">${escapeHtml(item.name || item.id)}</div>
                            <div class="workflow-meta">${escapeHtml(item.workflow_id || tr('rh.noWorkflowId'))}</div>
                        </span>
                    </button>
                `;
            }).join('');
            refreshIcons();
        }

        function renderParamList(){
            const wf = currentWorkflow();
            if(!wf){
                paramList.innerHTML = '';
                return;
            }
            const fields = wf.fields || [];
            if(!fields.length){
                paramList.innerHTML = `<div class="rh-empty-hint">${tr('rh.noParams')}</div>`;
                return;
            }
            paramList.innerHTML = fields.map((field, index) => {
                rhNormalizeFieldSchema(field);
                const isDropdown = rhFieldIsDropdown(field);
                const dataType = field.dataType || 'text';
                const inputMethod = field.inputMethod || 'manual';
                return `
                <div class="rh-param-row" data-index="${index}">
                    <div class="rh-param-row-main">
                        <label class="rh-field">
                            <span class="rh-field-label">${tr('rh.paramName')}</span>
                            <div class="field-frame"><input value="${escapeHtml(field.name || '')}" oninput="updateParam(${index}, 'name', this.value)" placeholder="提示词"></div>
                        </label>
                        <label class="rh-field">
                            <span class="rh-field-label">nodeId</span>
                            <div class="field-frame"><input value="${escapeHtml(field.nodeId || '')}" oninput="updateParam(${index}, 'nodeId', this.value)" placeholder="6"></div>
                        </label>
                        <label class="rh-field">
                            <span class="rh-field-label">fieldName</span>
                            <div class="field-frame"><input value="${escapeHtml(field.fieldName || '')}" oninput="updateParam(${index}, 'fieldName', this.value)" placeholder="text"></div>
                        </label>
                        <label class="rh-field">
                            <span class="rh-field-label">${tr('rh.dataType')}</span>
                            <div class="field-frame field-frame--select">
                                <select class="size-select" onchange="updateParamDataType(${index}, this.value)">
                                    <option value="text" ${dataType === 'text' ? 'selected' : ''}>text</option>
                                    <option value="textarea" ${dataType === 'textarea' ? 'selected' : ''}>textarea</option>
                                    <option value="number" ${dataType === 'number' ? 'selected' : ''}>number</option>
                                    <option value="image" ${dataType === 'image' ? 'selected' : ''}>image</option>
                                </select>
                            </div>
                        </label>
                        <label class="rh-field">
                            <span class="rh-field-label">${tr('rh.inputMethod')}</span>
                            <div class="field-frame field-frame--select">
                                <select class="size-select" onchange="updateParamInputMethod(${index}, this.value)">
                                    <option value="manual" ${inputMethod === 'manual' ? 'selected' : ''}>${escapeHtml(tr('rh.inputManual'))}</option>
                                    <option value="dropdown" ${inputMethod === 'dropdown' ? 'selected' : ''}>${escapeHtml(tr('rh.inputDropdown'))}</option>
                                </select>
                            </div>
                        </label>
                        <button class="action-btn danger-btn param-delete-btn settings-btn" type="button" onclick="removeParam(${index})" title="${tr('rh.delete')}"><i data-lucide="trash-2"></i></button>
                    </div>
                    <div class="rh-param-options-wrap ${isDropdown ? 'is-open' : ''}" aria-hidden="${isDropdown ? 'false' : 'true'}">
                        <div class="rh-param-options-inner">
                            ${renderParamOptionEditor(field, index)}
                        </div>
                    </div>
                </div>
            `;
            }).join('');
            refreshIcons();
        }

        function isLinkInput(value){
            return Array.isArray(value) && value.length === 2 && typeof value[0] === 'string' && typeof value[1] === 'number';
        }
        function rhFieldFor(nodeId, fieldName){
            const wf = currentWorkflow();
            return (wf?.fields || []).find(f => String(f.nodeId) === String(nodeId) && String(f.fieldName) === String(fieldName));
        }
        function nodeLabel(node){
            return node?._meta?.title || node?.class_type || tr('rh.unnamedNode');
        }
        function guessRhType(value, inputName){
            const lc = String(inputName || '').toLowerCase();
            if(typeof value === 'number') return 'number';
            if(typeof value === 'string'){
                if(/prompt|text|description|caption|提示|正向|负向/.test(lc) || value.length > 80) return value.length > 80 ? 'textarea' : 'text';
                return 'text';
            }
            return 'text';
        }
        function toggleRhField(nodeId, fieldName){
            const wf = currentWorkflow();
            if(!wf) return;
            const rawValue = rhWorkflowJson?.[nodeId]?.inputs?.[fieldName];
            wf.fields = wf.fields || [];
            const existing = rhFieldFor(nodeId, fieldName);
            if(existing){
                wf.fields = wf.fields.filter(f => f !== existing);
            } else {
                const resolved = rhResolveFieldMeta(nodeId, fieldName, rawValue);
                const schema = rhSchemaFromResolved(resolved);
                let fname = String(fieldName || '').trim();
                if((schema.dataType === 'text' || schema.dataType === 'textarea') && !fname) fname = 'text';
                const item = {
                    id: uid('f'),
                    name: fname,
                    nodeId: String(nodeId),
                    fieldName: fname,
                    dataType: schema.dataType,
                    inputMethod: schema.inputMethod,
                    default: resolved.default ?? ((rawValue !== null && typeof rawValue !== 'object') ? rawValue : ''),
                };
                rhSyncLegacyType(item);
                if(rhFieldIsDropdown(item)){
                    item.options = rhOptionsFromWorkflowJson(item);
                    if(!item.options.length && rawValue !== undefined && rawValue !== null && rawValue !== '' && typeof rawValue !== 'object'){
                        item.options = [String(rawValue)];
                    }
                    item.options = rhEnsureOptionRows(item.options);
                    if(typeof rawValue === 'string') item.apiValue = rawValue;
                }
                wf.fields.push(item);
            }
            renderParamList();
            renderNodeExplorer();
        }
        function updateRhFieldName(fieldId, name){
            const f = (currentWorkflow()?.fields || []).find(x => x.id === fieldId);
            if(f) f.name = name;
        }
        function renderRhInputRow(nodeId, inputKey, rawValue){
            const f = rhFieldFor(nodeId, inputKey);
            const active = !!f;
            let badge = '';
            if(typeof rawValue === 'string'){
                const preview = rawValue.length > 48 ? rawValue.slice(0, 48) + '…' : rawValue;
                badge = `"${escapeHtml(preview)}"`;
            } else if(typeof rawValue === 'number'){
                badge = String(rawValue);
            } else if(typeof rawValue === 'boolean'){
                badge = rawValue ? 'true' : 'false';
            } else {
                badge = escapeHtml(String(rawValue));
            }
            return `
                <div class="input-row ${active ? 'is-active' : ''}">
                    <div class="check-toggle ${active ? 'checked' : ''}" onclick="toggleRhField('${escapeAttr(nodeId)}','${escapeAttr(inputKey)}')">
                        ${active ? '<i data-lucide="check" class="w-3 h-3"></i>' : ''}
                    </div>
                    <div>
                        <div class="input-key">${escapeHtml(inputKey)}</div>
                        <div class="input-orig">${tr('rh.defaultValue')}${badge}</div>
                    </div>
                </div>
            `;
        }
        function syncRhNodeBlockVisibility(){
            const hasNodes = !!(rhWorkflowJson && Object.keys(rhWorkflowJson).length);
            if(rhNodeBlock) rhNodeBlock.hidden = !hasNodes;
        }
        function setWorkflowPanelsVisible(visible){
            if(workflowBasicsCard) workflowBasicsCard.hidden = !visible;
            if(workflowParamsCard) workflowParamsCard.hidden = !visible;
            if(rhActionBar) rhActionBar.hidden = !visible;
        }
        function renderNodeExplorer(){
            if(!nodeExplorer || !nodeList) return;
            syncRhNodeBlockVisibility();
            if(!rhWorkflowJson || !Object.keys(rhWorkflowJson).length){
                return;
            }
            const nodes = Object.entries(rhWorkflowJson).sort((a, b) => {
                const an = parseInt(a[0], 10), bn = parseInt(b[0], 10);
                if(!isNaN(an) && !isNaN(bn)) return an - bn;
                return String(a[0]).localeCompare(String(b[0]));
            });
            nodeList.innerHTML = nodes.map(([nodeId, node]) => {
                const inputs = Object.entries(node?.inputs || {}).filter(([k, v]) => !isLinkInput(v));
                const exposedCount = inputs.filter(([k]) => rhFieldFor(nodeId, k)).length;
                const expanded = exposedCount > 0;
                return `
                    <div class="node-card ${expanded ? 'expanded' : ''}" id="rh-node-${escapeAttr(nodeId)}">
                        <div class="node-card-head" onclick="this.parentElement.classList.toggle('expanded')">
                            <div style="min-width:0">
                                <div class="node-class">${escapeHtml(nodeLabel(node))}</div>
                                <div class="node-meta">#${escapeHtml(nodeId)} · ${escapeHtml(node?.class_type || '')} · ${tf('rh.configurableCount', {count: inputs.length})}</div>
                            </div>
                            <div class="node-head-actions">
                                <i data-lucide="chevron-down" class="w-4 h-4 node-chev"></i>
                            </div>
                        </div>
                        <div class="node-inputs">
                            ${inputs.length ? inputs.map(([k, v]) => renderRhInputRow(nodeId, k, v)).join('') : `<div class="explorer-empty">${tr('rh.noConfigInputs')}</div>`}
                        </div>
                    </div>
                `;
            }).join('');
            refreshIcons();
        }
        async function fetchWorkflowJson(){
            syncEditorToModel();
            const wf = currentWorkflow();
            if(!wf) return;
            const workflowId = wfIdInput.value.trim();
            if(!workflowId){ alert(tr('rh.workflowIdRequired')); return; }
            if(!config.has_key){ alert(tr('rh.noKey')); return; }
            const btn = document.getElementById('fetchJsonBtn');
            if(btn){ btn.disabled = true; }
            setStatus(tr('rh.fetchingJson'));
            try {
                const data = await fetch('/api/runninghub/fetch-workflow-json', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ workflow_id: workflowId }),
                }).then(async r => {
                    const body = await r.json().catch(() => ({}));
                    if(!r.ok) throw new Error(apiErrorMessage(r, body));
                    return body;
                });
                rhWorkflowJson = data.workflow || null;
                rhSuggestedFields = data.suggested_fields || [];
                rhInputMeta = data.input_meta || {};
                wf.workflow_id = data.workflow_id || workflowId;
                (wf.fields || []).forEach(field => {
                    if(rhFieldIsDropdown(field)) rhHydrateDropdownField(field, true);
                });
                syncExposedFieldMeta(wf);
                renderWorkflowList();
                renderParamList();
                renderNodeExplorer();
                setStatus(tf('rh.fetchJsonOk', { nodes: data.node_count || 0 }));
            } catch(err) {
                setStatus('');
                alert(err.message || tr('rh.fetchJsonFailed'));
            } finally {
                if(btn){ btn.disabled = false; }
                refreshIcons();
            }
        }
        function autoExposeSuggested(){
            const wf = currentWorkflow();
            if(!wf || !rhSuggestedFields.length){ alert(tr('rh.fetchJsonFirst')); return; }
            wf.fields = wf.fields || [];
            rhSuggestedFields.forEach(item => {
                if(rhFieldFor(item.nodeId, item.fieldName)) return;
                const schema = rhSchemaFromResolved(item);
                const entry = {
                    id: uid('f'),
                    name: item.name || item.fieldName,
                    nodeId: String(item.nodeId),
                    fieldName: String(item.fieldName || 'text'),
                    dataType: schema.dataType,
                    inputMethod: schema.inputMethod,
                    default: item.default ?? '',
                };
                rhSyncLegacyType(entry);
                if(rhFieldIsDropdown(entry)){
                    entry.options = item.options?.length ? item.options : rhOptionsFromWorkflowJson(entry);
                    entry.options = rhEnsureOptionRows(entry.options);
                    if(item.apiValue !== undefined) entry.apiValue = item.apiValue;
                }
                wf.fields.push(entry);
            });
            renderParamList();
            renderNodeExplorer();
        }
        function renderEditor(){
            const wf = currentWorkflow();
            setWorkflowPanelsVisible(!!wf);
            if(!wf){
                editorTitle.textContent = tr('rh.selectWorkflow');
                rhWorkflowJson = null;
                syncRhNodeBlockVisibility();
                return;
            }
            editorTitle.textContent = wf.name || wf.id;
            wfNameInput.value = wf.name || '';
            wfIdInput.value = wf.workflow_id || '';
            syncExposedFieldMeta(wf);
            renderParamList();
            renderNodeExplorer();
        }

        function normalizeRhField(field){
            rhNormalizeFieldSchema(field);
            const dt = String(field.dataType || 'text').toLowerCase();
            const nodeId = String(field.nodeId || '').trim();
            let fieldName = String(field.fieldName || '').trim();
            if(nodeId && !fieldName && (dt === 'text' || dt === 'textarea')) fieldName = 'text';
            field.nodeId = nodeId;
            field.fieldName = fieldName;
            return field;
        }
        function normalizeWorkflowFields(wf){
            if(!wf) return;
            wf.fields = (wf.fields || []).map(normalizeRhField);
        }
        function validateWorkflowsBeforeSave(){
            for(const wf of config.workflows || []){
                normalizeWorkflowFields(wf);
                if(!String(wf.workflow_id || '').trim()) continue;
                for(const field of wf.fields || []){
                    const nodeId = String(field.nodeId || '').trim();
                    const fieldName = String(field.fieldName || '').trim();
                    if(nodeId && !fieldName){
                        return `工作流「${wf.name || wf.id}」的参数缺少 fieldName（有 nodeId=${nodeId}）。文本节点请填 text。`;
                    }
                }
            }
            return '';
        }
        function syncParamOptionsFromDom(){
            const wf = currentWorkflow();
            if(!wf || !paramList) return;
            paramList.querySelectorAll('.rh-param-row[data-index]').forEach(row => {
                const index = Number(row.dataset.index);
                const field = wf.fields?.[index];
                if(!field || !rhFieldIsDropdown(field)) return;
                const inputs = row.querySelectorAll('.rh-option-list .rh-option-row input');
                field.options = Array.from(inputs).map(input => input.value);
            });
        }
        function syncParamOptionsForSave(field){
            if(!field || !rhFieldIsDropdown(field)) return;
            field.options = (field.options || []).map(o => String(o).trim()).filter(Boolean);
        }
        function hydrateRhSelectFields(wf){
            if(!wf) return;
            (wf.fields || []).forEach(field => {
                rhNormalizeFieldSchema(field);
                rhHydrateDropdownField(field);
            });
        }
        function hydrateAllWorkflowSelectFields(){
            (config.workflows || []).forEach(hydrateRhSelectFields);
        }
        function syncEditorToModel(){
            const wf = currentWorkflow();
            if(!wf) return;
            syncParamOptionsFromDom();
            wf.name = wfNameInput.value.trim() || wf.id;
            wf.workflow_id = wfIdInput.value.trim();
            normalizeWorkflowFields(wf);
            hydrateRhSelectFields(wf);
        }

        window.selectWorkflow = function(id){
            syncEditorToModel();
            selectedId = id;
            const wf = currentWorkflow();
            if(wf) hydrateRhSelectFields(wf);
            renderWorkflowList();
            renderEditor();
        };

        window.addWorkflow = function(){
            syncEditorToModel();
            const item = { id: uid('rh-wf'), name: tr('rh.newWorkflow'), workflow_id: '', fields: [] };
            config.workflows = config.workflows || [];
            config.workflows.push(item);
            selectedId = item.id;
            renderWorkflowList();
            renderEditor();
        };

        window.deleteWorkflow = function(){
            const wf = currentWorkflow();
            if(!wf) return;
            if(!confirm(tr('rh.deleteConfirm'))) return;
            config.workflows = (config.workflows || []).filter(w => w.id !== wf.id);
            selectedId = (config.workflows[0] || {}).id || '';
            renderWorkflowList();
            renderEditor();
        };

        window.addParam = function(){
            const wf = currentWorkflow();
            if(!wf) return;
            wf.fields = wf.fields || [];
            wf.fields.push({
                id: uid('f'),
                name: '提示词',
                nodeId: '',
                fieldName: 'text',
                dataType: 'text',
                inputMethod: 'manual',
                type: 'text',
                default: '',
            });
            renderParamList();
        };

        window.updateParam = function(index, key, value){
            const wf = currentWorkflow();
            if(!wf || !wf.fields || !wf.fields[index]) return;
            wf.fields[index][key] = value;
            const field = wf.fields[index];
            if(rhFieldIsDropdown(field) && (key === 'nodeId' || key === 'fieldName')){
                rhHydrateDropdownField(field, true);
                renderParamList();
            }
        };
        window.updateParamDataType = function(index, value){
            const wf = currentWorkflow();
            const field = wf?.fields?.[index];
            if(!field) return;
            field.dataType = RH_DATA_TYPES.includes(String(value || '').toLowerCase()) ? String(value).toLowerCase() : 'text';
            rhSyncLegacyType(field);
            renderParamList();
        };
        window.updateParamInputMethod = function(index, value){
            const wf = currentWorkflow();
            const field = wf?.fields?.[index];
            if(!field) return;
            field.inputMethod = String(value || '').toLowerCase() === 'dropdown' ? 'dropdown' : 'manual';
            if(field.inputMethod === 'dropdown'){
                rhHydrateDropdownField(field, true);
            } else {
                field.options = [];
                delete field.apiValue;
            }
            rhSyncLegacyType(field);
            renderParamList();
        };
        window.updateParamOption = function(index, optIdx, value){
            const wf = currentWorkflow();
            const field = wf?.fields?.[index];
            if(!field) return;
            field.options = rhEnsureOptionRows(field.options);
            field.options[optIdx] = value;
            if(field.default !== undefined && field.default !== null && field.default !== ''){
                const trimmed = field.options.map(o => String(o).trim()).filter(Boolean);
                field.default = rhCanonicalOption(trimmed, field.default);
            }
        };
        window.addParamOption = function(index){
            const wf = currentWorkflow();
            const field = wf?.fields?.[index];
            if(!field) return;
            field.options = rhEnsureOptionRows(field.options);
            field.options.push('');
            renderParamList();
        };
        window.removeParamOption = function(index, optIdx){
            const wf = currentWorkflow();
            const field = wf?.fields?.[index];
            if(!field) return;
            field.options = rhEnsureOptionRows(field.options);
            if(field.options.length <= 1){
                field.options = [''];
            } else {
                field.options.splice(optIdx, 1);
            }
            renderParamList();
        };
        window.reloadParamOptionsFromJson = function(index){
            const wf = currentWorkflow();
            const field = wf?.fields?.[index];
            if(!field || !rhFieldIsDropdown(field)) return;
            rhHydrateDropdownField(field, true);
            renderParamList();
        };
        function syncExposedFieldMeta(wf){
            hydrateRhSelectFields(wf);
        }

        window.removeParam = function(index){
            const wf = currentWorkflow();
            if(!wf || !wf.fields) return;
            wf.fields.splice(index, 1);
            renderParamList();
        };

        wfNameInput.oninput = () => { const wf = currentWorkflow(); if(wf) wf.name = wfNameInput.value; renderWorkflowList(); };
        wfIdInput.oninput = () => { const wf = currentWorkflow(); if(wf) wf.workflow_id = wfIdInput.value; renderWorkflowList(); };

        function applyKeyHint(){
            keyHint.textContent = config.has_key ? `${tr('rh.keySaved')} ${config.key_preview || ''}` : tr('rh.noKey');
            apiKeyInput.placeholder = config.has_key ? tr('rh.keepKey') : tr('rh.enterKey');
        }

        function apiErrorMessage(res, body){
            if(res.status === 404) return tr('rh.serverRestart');
            const d = body?.detail;
            if(typeof d === 'string') return d;
            if(Array.isArray(d) && d.length) return d[0]?.msg || String(d[0]);
            return tr('rh.saveFailed');
        }

        async function saveApiKey(){
            const key = apiKeyInput.value.trim();
            if(!key && !config.has_key){
                alert(tr('rh.enterKey'));
                return;
            }
            setStatus(tr('rh.saving'));
            try {
                const res = await fetch('/api/runninghub/config', {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ api_key: key })
                });
                const body = await res.json().catch(() => ({}));
                if(!res.ok) throw new Error(apiErrorMessage(res, body));
                const data = body;
                config = data;
                apiKeyInput.value = '';
                applyKeyHint();
                setStatus(tr('rh.saved'));
                try { new BroadcastChannel('studio-api').postMessage({ type: 'runninghub-changed' }); } catch(e) {}
            } catch(err) {
                setStatus('');
                alert(err.message || '保存失败');
            }
        }

        function serializeWorkflowsForSave(){
            hydrateAllWorkflowSelectFields();
            syncEditorToModel();
            return (config.workflows || []).map(wf => ({
                id: wf.id,
                name: wf.name,
                workflow_id: wf.workflow_id,
                fields: (wf.fields || []).map(f => {
                    rhNormalizeFieldSchema(f);
                    rhSyncLegacyType(f);
                    syncParamOptionsForSave(f);
                    const item = {
                        id: f.id,
                        name: f.name,
                        nodeId: f.nodeId,
                        fieldName: f.fieldName,
                        type: f.type,
                        dataType: f.dataType,
                        inputMethod: f.inputMethod,
                        default: f.default,
                    };
                    if(rhFieldIsDropdown(f)){
                        item.options = Array.isArray(f.options) ? f.options : [];
                        if(f.apiValue !== undefined && f.apiValue !== null && f.apiValue !== ''){
                            item.apiValue = f.apiValue;
                        }
                    }
                    return item;
                }),
            }));
        }

        async function saveConfig(){
            const err = validateWorkflowsBeforeSave();
            if(err){ alert(err); return; }
            setStatus(tr('rh.saving'));
            try {
                const res = await fetch('/api/runninghub/config', {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ workflows: serializeWorkflowsForSave() })
                });
                const body = await res.json().catch(() => ({}));
                if(!res.ok) throw new Error(apiErrorMessage(res, body));
                const data = body;
                config.has_key = data.has_key;
                config.key_preview = data.key_preview;
                config.workflows = data.workflows || [];
                normalizeAllWorkflowFieldSchemas();
                applyKeyHint();
                hydrateAllWorkflowSelectFields();
                renderWorkflowList();
                renderEditor();
                setStatus(tr('rh.saved'));
                try { new BroadcastChannel('studio-api').postMessage({ type: 'runninghub-changed' }); } catch(e) {}
            } catch(err) {
                setStatus('');
                alert(err.message || '保存失败');
            }
        }

        async function loadConfig(){
            try {
                const data = await fetch('/api/runninghub/config').then(r => r.json());
                config.has_key = data.has_key;
                config.key_preview = data.key_preview;
                config.workflows = data.workflows || [];
                normalizeAllWorkflowFieldSchemas();
                applyKeyHint();
                hydrateAllWorkflowSelectFields();
                selectedId = (config.workflows || [])[0]?.id || '';
                renderWorkflowList();
                renderEditor();
            } catch(err) {
                setStatus('加载失败');
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            if(window.StudioI18n) StudioI18n.apply();
            loadConfig();
            refreshIcons();
        });
    </script>
</body>
</html>
