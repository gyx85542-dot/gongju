        .result-frame { background:#1a1a1a; border-radius:10px; border:1px solid rgba(255,255,255,.08); display:flex; flex-direction:column; min-height:0; flex:1; overflow:hidden; }

        .output-scroll-wrap { flex:1; min-height:0; overflow-y:auto; }
        .output-grid { display:grid; gap:12px; width:100%; padding:12px; align-content:start; }
        .output-grid-cell { position:relative; aspect-ratio:1; border-radius:6px; overflow:hidden; background:#141414; border:1px solid rgba(255,255,255,.06); }
        .output-grid-cell img, .output-grid-cell video { width:100%; height:100%; object-fit:contain; border-radius:6px; }
        .output-grid-cell .cell-actions { position:absolute; left:0; right:0; bottom:0; height:20%; min-height:36px; z-index:5; display:flex; align-items:center; justify-content:center; gap:6px; padding:0 8px 5px; opacity:0; transition:opacity .18s; pointer-events:none; background:linear-gradient(to top,rgba(26,26,26,.92),transparent); }
        .output-grid-cell:hover .cell-actions { opacity:1; pointer-events:auto; }
        .cell-action-btn { width:24px; height:24px; border:none; border-radius: 4px; background:rgba(49,49,49,.96); display:flex; align-items:center; justify-content:center; cursor:pointer; border:1px solid rgba(255,255,255,.08); color:#a3a3a3; padding:0; }
        .cell-action-btn:hover, .cell-action-btn.active { background:#ff4d94; color:#fff; border-color:#ff4d94; }
        .cell-action-btn.fav-active { background:#ffaa00; color:#fff; border-color:#ffaa00; }
        .output-grid-cell.is-pending { background:#141414; }
        .cell-pending { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; color:#94a3b8; }
        .pending-spin { width:28px; height:28px; border:2px solid #e5e7eb; border-top-color:#ff4d94; border-radius:50%; animation:spin .8s linear infinite; }
        @keyframes spin { to { transform:rotate(360deg); } }
        .gallery-lightbox { background:rgba(16,16,16,.96); backdrop-filter:blur(22px); }
        html.embed-panel { --bg:#161616; }

        html.embed-panel .page-main { grid-template-columns:minmax(0,1fr) !important; }

    <script>
        lucide.createIcons();
        function tr(k){ return window.StudioI18n ? StudioI18n.t(k) : k; }
        function escapeHtml(s){ return String(s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
        function escapeAttr(s){ return escapeHtml(s); }

        const HISTORY_TYPE = 'runninghub';
        const CLIENT_ID = localStorage.getItem('client_id') || (()=>{ const id=crypto.randomUUID?.()||String(Date.now()); localStorage.setItem('client_id',id); return id; })();
        const META_SCOPE = 'runninghub';
        const META_PIN = 'rh_pinned', META_FAV = 'rh_favorites', META_ORDER = 'rh_display_order';
        const RH_MAX_CONCURRENT = 5;

        function activePendingCount(){
            return pendingJobs.filter(j => !j.error).length;
        }
        function buildRunSnapshot(){
            return {
                workflow_id: selectedId,
                fields: collectRunFields(),
                prompt: collectPrimaryPrompt(),
                reference_images: collectReferenceImages(),
            };
        }

        let workflows = [], selectedId = '', currentWorkflow = null;
        const RH_SDXL_DIMENSIONS = [
            '1536 x 640 (landscape)', '1344 x 768 (landscape)', '1216 x 832 (landscape)',
            '1152 x 896 (landscape)', '1024 x 1024 (square)', '896 x 1152 (portrait)',
            '832 x 1216 (portrait)', '768 x 1344 (portrait)', '640 x 1536 (portrait)',
        ];
        const RH_SAMPLER_NAMES = [
            'euler', 'euler_ancestral', 'heun', 'heunpp2', 'dpm_2', 'dpm_2_ancestral', 'lms',
            'dpm_fast', 'dpm_adaptive', 'dpmpp_2s_ancestral', 'dpmpp_sde', 'dpmpp_2m',
            'dpmpp_sde_gpu', 'dpmpp_3m_sde', 'dpmpp_3m_sde_gpu', 'ddpm', 'lcm', 'uni_pc', 'uni_pc_bh2',
        ];
        const RH_SCHEDULERS = ['normal', 'karras', 'exponential', 'sgm_uniform', 'simple', 'ddim_uniform', 'beta'];
        const RH_SELECT_PRESETS = {
            dimensions: RH_SDXL_DIMENSIONS,
            resolution: RH_SDXL_DIMENSIONS,
            preset: RH_SDXL_DIMENSIONS,
            sampler_name: RH_SAMPLER_NAMES,
            scheduler: RH_SCHEDULERS,
        };
        function rhNormSpaces(text){ return String(text || '').trim().replace(/\s+/g, ' '); }
        function rhCanonicalOption(options, value){
            if(value === null || value === undefined || value === '') return value;
            const sv = String(value);
            const opts = options || [];
            if(opts.some(o => String(o) === sv)) return sv;
            const nv = rhNormSpaces(sv);
            const hit = opts.find(o => rhNormSpaces(o) === nv);
            return hit || sv;
        }
        function rhSelectMatch(options, value){
            const canonical = rhCanonicalOption(options, value);
            return (options || []).map(o => ({
                value: String(o),
                selected: rhNormSpaces(o) === rhNormSpaces(canonical) || String(o) === String(canonical),
            }));
        }
        let fieldValues = {}, fieldImageUrls = {}, fieldMediaUrls = {}, batchCount = 1, outputCols = 2;
        let rhMediaGrids = {}, rhMediaRelay = null;
        let allHistory = [], pendingJobs = [], historyLoading = false, currentLightboxData = null;
        let pinnedIds = [], favoriteIds = [], displayOrder = [];
        const RH_FORM_CACHE_KEY = 'rh_workflow_form_cache_v1';

        function rhCacheableUrl(url){
            const s = String(url || '').trim();
            if(!s || s.startsWith('blob:')) return '';
            return s;
        }
        function readRhFormCacheStore(){
            try {
                const raw = sessionStorage.getItem(RH_FORM_CACHE_KEY);
                if(!raw) return {};
                const parsed = JSON.parse(raw);
                return parsed && typeof parsed === 'object' ? parsed : {};
            } catch(e){ return {}; }
        }
        function writeRhFormCacheStore(store){
            try { sessionStorage.setItem(RH_FORM_CACHE_KEY, JSON.stringify(store || {})); } catch(e){}
        }
        function persistCurrentWorkflowForm(){
            if(!selectedId) return;
            const values = {};
            Object.entries(fieldValues || {}).forEach(([fid, val]) => {
                if(val === undefined || val === null) return;
                if(typeof val === 'string' && val.startsWith('blob:')) return;
                values[fid] = val;
            });
            const images = {};
            Object.entries(fieldImageUrls || {}).forEach(([fid, url]) => {
                const u = rhCacheableUrl(url);
                if(u) images[fid] = u;
            });
            const media = {};
            Object.entries(fieldMediaUrls || {}).forEach(([fid, url]) => {
                const u = rhCacheableUrl(url);
                if(u) media[fid] = u;
            });
            // Prefer live media grid urls when present
            Object.entries(rhMediaGrids || {}).forEach(([fid, grid]) => {
                const u = rhCacheableUrl(grid?.getUrls?.()?.[0] || '');
                if(u){
                    media[fid] = u;
                    values[fid] = u;
                }
            });
            const store = readRhFormCacheStore();
            store[selectedId] = { values, images, media, savedAt: Date.now() };
            writeRhFormCacheStore(store);
        }
        function applyCachedWorkflowForm(workflowId){
            if(!workflowId) return false;
            const snap = readRhFormCacheStore()[workflowId];
            if(!snap || typeof snap !== 'object') return false;
            const known = new Set((currentWorkflow?.fields || []).map(f => f.id));
            Object.entries(snap.values || {}).forEach(([fid, val]) => {
                if(!known.has(fid) || val === undefined || val === null) return;
                if(typeof val === 'string' && val.startsWith('blob:')) return;
                fieldValues[fid] = val;
            });
            Object.entries(snap.images || {}).forEach(([fid, url]) => {
                const u = rhCacheableUrl(url);
                if(!known.has(fid) || !u) return;
                fieldImageUrls[fid] = u;
                fieldValues[fid] = u;
            });
            Object.entries(snap.media || {}).forEach(([fid, url]) => {
                const u = rhCacheableUrl(url);
                if(!known.has(fid) || !u) return;
                fieldMediaUrls[fid] = u;
                fieldValues[fid] = u;
            });
            return true;
        }

        function openRhSettings(){
            try { window.parent.postMessage({ type:'studio-navigate', page:'runninghub-settings' }, '*'); } catch(e) {}
        }
        window.openRhSettings = openRhSettings;

        function rhEffectiveFieldType(f){
            const im = String(f?.inputMethod || '').toLowerCase();
            if(im === 'dropdown') return 'select';
            const legacy = String(f?.type || '').toLowerCase();
            if(legacy === 'select') return 'select';
            const dt = String(f?.dataType || f?.type || 'text').toLowerCase();
            return dt || 'text';
        }
        function rhNormalizeFieldSchema(f){
            if(!f) return f;
            const legacy = String(f.type || 'text').toLowerCase();
            let dt = String(f.dataType || '').toLowerCase();
            let im = String(f.inputMethod || '').toLowerCase();
            if(!dt || !im){
                if(legacy === 'select'){ dt = dt || 'text'; im = im || 'dropdown'; }
                else if(legacy === 'textarea'){ dt = 'textarea'; im = 'manual'; }
                else if(['text','number','image','video','audio','textarea'].includes(legacy)){ dt = legacy; im = 'manual'; }
                else { dt = 'text'; im = 'manual'; }
            }
            f.dataType = dt;
            f.inputMethod = im === 'dropdown' ? 'dropdown' : 'manual';
            f.type = f.inputMethod === 'dropdown' ? 'select' : f.dataType;
            return f;
        }
        function rhFieldKind(f){
            if(String(f?.inputMethod || '').toLowerCase() === 'dropdown') return 'setting';
            if(rhEffectiveFieldType(f) === 'select') return 'setting';
            const t = rhEffectiveFieldType(f);
            if(t === 'image') return 'image';
            if(t === 'video') return 'video';
            if(t === 'audio') return 'audio';
            if(t === 'number' || t === 'boolean') return 'setting';
            if(t === 'text' || t === 'textarea') return 'prompt';
            return 'setting';
        }
        function promptFields(){ return effectiveFields().filter(f => rhFieldKind(f) === 'prompt'); }
        function promptFieldLabel(f, prompts){
            const name = String(f.name || '').trim();
            if(name) return name;
            if((prompts || promptFields()).length === 1) return tr('rhPage.mainPrompt');
            return String(f.fieldName || '').trim() || tr('rhPage.mainPrompt');
        }
        function syncGenBtnTip(showTip){
            const wrap = document.getElementById('genBtnWrap');
            if(!wrap) return;
            if(showTip) wrap.setAttribute('data-tip', tr('studio.genPromptTip'));
            else wrap.removeAttribute('data-tip');
        }
        function syncGenBtnState(){
            const btn = document.getElementById('genBtn');
            if(!btn) return;
            const wfReady = workflows.length > 0 && selectedId && String(currentWorkflow?.workflow_id || '').trim();
            const needsPrompt = promptFields().length > 0;
            const promptMissing = needsPrompt && !collectPrimaryPrompt();
            const atCapacity = activePendingCount() >= RH_MAX_CONCURRENT;
            btn.disabled = !wfReady || promptMissing || atCapacity;
            const wrap = document.getElementById('genBtnWrap');
            if(!wrap) return;
            if(atCapacity) wrap.setAttribute('data-tip', tr('rhPage.concurrentLimit'));
            else syncGenBtnTip(wfReady && promptMissing);
        }
        function effectiveFields(){ return currentWorkflow?.fields || []; }
        function rhEnsureOptions(options, value){
            const opts = (options || []).map(o => String(o)).filter(Boolean);
            if(value === null || value === undefined || value === '') return opts;
            const canonical = rhCanonicalOption(opts, value);
            return opts.includes(canonical) ? opts : [String(canonical), ...opts];
        }
        function hydrateRhFieldOptions(field){
            if(!field || rhEffectiveFieldType(field) !== 'select') return;
            const fn = String(field.fieldName || '').toLowerCase();
            const presets = RH_SELECT_PRESETS[fn];
            const existing = field.options || [];
            if(presets && existing.length <= 1){
                field.options = rhEnsureOptions(presets, field.apiValue ?? field.default ?? existing[0]);
            } else if(!existing.length && (field.apiValue || field.default)){
                field.options = [String(field.apiValue ?? field.default)];
            }
            if(field.apiValue && !field.options.includes(field.apiValue)){
                field.options = [String(field.apiValue), ...(field.options || [])];
            }
            if(field.default !== undefined && field.default !== null && field.default !== ''){
                field.default = rhCanonicalOption(field.options || [], field.default);
            }
        }
        function hydrateWorkflowFields(wf){
            (wf?.fields || []).forEach(f => {
                rhNormalizeFieldSchema(f);
                hydrateRhFieldOptions(f);
            });
        }

        async function loadWorkflowList(){
            try {
                const data = await fetch('/api/runninghub/workflows').then(r=>r.json());
                workflows = (data.workflows || []).filter(w => String(w.workflow_id||'').trim());
                const sel = document.getElementById('workflowSelect');
                if(!workflows.length){
                    sel.innerHTML = `<option value="">${tr('rhPage.noWorkflows')}</option>`;
                    document.getElementById('dynamicPanel').innerHTML = `<div class="empty-hint">${tr('rhPage.noWorkflowsHint')} <a onclick="openRhSettings()">${tr('common.runninghubSettings')}</a></div>`;
                    document.getElementById('genBtn').disabled = true;
                    return;
                }
                sel.innerHTML = workflows.map(w => `<option value="${escapeAttr(w.id)}" ${w.id===selectedId?'selected':''}>${escapeHtml(w.name || w.id)}</option>`).join('');
                if(!selectedId || !workflows.some(w => w.id === selectedId)) await selectWorkflow(workflows[0].id);
            } catch(e){ console.error(e); }
        }

        async function selectWorkflow(id){
            if(!id) return;
            if(selectedId && selectedId !== id) persistCurrentWorkflowForm();
            selectedId = id;
            document.getElementById('workflowSelect').value = id;
            try {
                const data = await fetch(`/api/runninghub/workflows/${encodeURIComponent(id)}`).then(r=>r.json());
                currentWorkflow = data.workflow;
                hydrateWorkflowFields(currentWorkflow);
                fieldValues = {}; fieldImageUrls = {}; fieldMediaUrls = {}; rhMediaGrids = {};
                (currentWorkflow?.fields||[]).forEach(f => {
                    rhNormalizeFieldSchema(f);
                    if(f.default === undefined || f.default === null || f.default === '') return;
                    const dt = rhEffectiveFieldType(f);
                    if(dt === 'video' || dt === 'audio'){
                        const url = StudioMediaRefUpload.normalizeUrl(String(f.default));
                        if(url){
                            fieldMediaUrls[f.id] = url;
                            fieldValues[f.id] = url;
                        }
                        return;
                    }
                    // Image defaults are RH server filenames; don't treat them as filled uploads.
                    if(dt === 'image') return;
                    const eff = rhEffectiveFieldType(f);
                    if(eff === 'select' && (f.options||[]).length){
                        fieldValues[f.id] = rhCanonicalOption(f.options, f.default);
                    } else {
                        fieldValues[f.id] = f.default;
                    }
                });
                applyCachedWorkflowForm(id);
                renderDynamicPanel();
                syncGenBtnState();
            } catch(e){
                alert(tr('rhPage.loadFailed'));
            }
        }

        function renderDynamicPanel(){
            const panel = document.getElementById('dynamicPanel');
            const fields = effectiveFields();
            if(!fields.length){
                panel.innerHTML = `<div class="empty-hint">${tr('rhPage.noFieldsHint')}</div>`;
                syncGenBtnState();
                return;
            }
            const prompts = fields.filter(f => rhFieldKind(f) === 'prompt');
            const images = fields.filter(f => rhFieldKind(f) === 'image');
            const videos = fields.filter(f => rhFieldKind(f) === 'video');
            const audios = fields.filter(f => rhFieldKind(f) === 'audio');
            const settings = fields.filter(f => rhFieldKind(f) === 'setting');
            let html = '';
            if(prompts.length || images.length || videos.length || audios.length){
                html += `<section class="tool-panel">`;
                prompts.forEach(f => {
                    const rows = prompts.length === 1 ? 16 : (f.type === 'textarea' ? 16 : 8);
                    html += `<div>
                        <div class="control-label mb-1"><span>${escapeHtml(promptFieldLabel(f, prompts))}</span></div>
                        <textarea class="nano-input w-full outline-none resize-none" rows="${rows}" data-field-id="${escapeAttr(f.id)}" oninput="setFieldValue('${escapeAttr(f.id)}',this.value);syncGenBtnState()">${escapeHtml(fieldValues[f.id] ?? '')}</textarea>
                    </div>`;
                });
                if(images.length){
                    html += `<div>
                        <div class="control-label mb-1"><span data-i18n="online.referenceImages">参考图�?/span></div>
                        <div id="rhRefGrid" class="ref-grid"></div>
                    </div>`;
                }
                videos.forEach(f => {
                    html += `<div class="rh-media-field-block">
                        <div class="control-label mb-1"><span>${escapeHtml(f.name || f.fieldName || tr('video.referenceVideos'))}</span></div>

                });

                    html += `<div class="rh-media-field-block">

        function ensureRhMediaRelay(){
            if(rhMediaRelay) return rhMediaRelay;
            rhMediaRelay = StudioMediaRefUpload.createGalleryRelay({
                isEnabled: () => true,
                onDropAccepted: () => {
                    try { window.parent.postMessage({ type:'studio-gallery-drag-result', accepted:true }, '*'); } catch(e){}
                },
                onDropRejected: () => {
                    try { window.parent.postMessage({ type:'studio-gallery-drag-result', accepted:false }, '*'); } catch(e){}
                },
            });
            rhMediaRelay.bind();
            return rhMediaRelay;
        }
        function syncRhMediaFieldValue(fieldId){
            const urls = rhMediaGrids[fieldId]?.getUrls?.() || [];
            const url = urls[0] || '';
            if(url){
                fieldMediaUrls[fieldId] = url;
                fieldValues[fieldId] = url;
            } else {
                delete fieldMediaUrls[fieldId];
                delete fieldValues[fieldId];
            }
            persistCurrentWorkflowForm();
        }
        function mountRhMediaField(field){
            if(!field?.id || !window.StudioMediaRefUpload) return;
            const kind = rhEffectiveFieldType(field);
            if(kind !== 'video' && kind !== 'audio') return;
            const gridId = `rhMediaGrid_${field.id}`;
            const dropZoneId = `rhMediaDrop_${field.id}`;
            rhMediaGrids[field.id] = StudioMediaRefUpload.mount({
                gridId,
                dropZoneId,
                kind,
                maxSlots: 1,
                tr,
                galleryRelay: ensureRhMediaRelay(),
                onGalleryDrop: ok => {
                    if(ok) syncRhMediaFieldValue(field.id);
                },
                onUrlsChange: () => syncRhMediaFieldValue(field.id),
            });
            const saved = fieldMediaUrls[field.id] || fieldValues[field.id] || '';
            if(saved) rhMediaGrids[field.id].setUrls([saved]);
        }
        function rhMediaFieldUrl(field){
            const id = field?.id;
            if(!id) return '';
            const fromGrid = rhMediaGrids[id]?.getUrls?.()?.[0] || '';
            const raw = fromGrid || fieldMediaUrls[id] || fieldValues[id] || '';
            return StudioMediaRefUpload.normalizeUrl(raw);
        }

        function mountWorkflowRefGrid(images){
            StudioRefUpload.mountFixed('rhRefGrid', images.map(f => ({
                id: f.id,
                ref: fieldImageUrls[f.id] ? {
                    url: fieldImageUrls[f.id],
                    name: String(fieldValues[f.id] || f.name || f.fieldName || '')
                } : null
            })), {
                tr,
                escapeHtml,
                onFileUpload: uploadImageFile,
                onUrlAssign: assignImageFromUrl,
                onRemove: (fieldId) => {
                    delete fieldValues[fieldId];
                    if(fieldImageUrls[fieldId]?.startsWith('blob:')) try { URL.revokeObjectURL(fieldImageUrls[fieldId]); } catch(e){}
                    delete fieldImageUrls[fieldId];
                    persistCurrentWorkflowForm();
                },
                onBoardPickUI: syncOutputDragState
            });
        }
        function refreshRefGrid(){
            const images = effectiveFields().filter(f => rhFieldKind(f) === 'image');
            if(!images.length) return;
            mountWorkflowRefGrid(images);
        }
        function isServerAssetUrl(url){
            const n = StudioRefUpload.normalizeImageUrl(url);
            return n.startsWith('/assets/') || n.startsWith('/output/');
        }
        function syncOutputDragState(){
            const pickId = StudioRefUpload.getBoardPickSlotId();
            document.querySelectorAll('#outputGrid .output-grid-cell img.draggable-output').forEach(img => {
                img.draggable = !pickId;
            });
        }

        function renderSettingField(f){
            const t = rhEffectiveFieldType(f);
            const v = fieldValues[f.id] ?? f.default ?? (t==='boolean'?false:'');
            const label = `<div class="control-label mb-1"><span>${escapeHtml(f.name || f.fieldName)}</span></div>`;
            if(t === 'number'){
                return `<label class="block">${label}<input class="size-select" type="number" value="${escapeAttr(v)}" oninput="setFieldValue('${escapeAttr(f.id)}', this.value)"></label>`;
            }
            if(t === 'boolean'){
                return `<label class="block flex items-center gap-2">${label}<input type="checkbox" ${v?'checked':''} onchange="setFieldValue('${escapeAttr(f.id)}', this.checked)"></label>`;
            }
            if(t === 'select'){
                const options = f.options || [];
                if(!options.length){
                    return `<label class="block">${label}<input class="size-select" type="text" value="${escapeAttr(v)}" oninput="setFieldValue('${escapeAttr(f.id)}', this.value)"></label>`;
                }
                const opts = rhSelectMatch(options, v).map(o => `<option value="${escapeAttr(o.value)}" ${o.selected?'selected':''}>${escapeHtml(o.value)}</option>`).join('');
                return `<label class="block">${label}<select class="size-select" onchange="setFieldValue('${escapeAttr(f.id)}', this.value)">${opts}</select></label>`;
            }
            if(t === 'textarea'){
                return `<label class="block">${label}<textarea class="size-select min-h-[72px] resize-y" oninput="setFieldValue('${escapeAttr(f.id)}', this.value)">${escapeHtml(v)}</textarea></label>`;
            }
            return `<label class="block">${label}<input class="size-select" type="text" value="${escapeAttr(v)}" oninput="setFieldValue('${escapeAttr(f.id)}', this.value)"></label>`;
        }

        function setFieldValue(id, value){
            fieldValues[id] = value;
            const f = effectiveFields().find(x => x.id === id);
            if(f && rhFieldKind(f) === 'prompt') syncGenBtnState();
            persistCurrentWorkflowForm();
        }
        function setBatchCount(n){
            batchCount = Math.min(4, Math.max(1, Number(n)||1));
            try { localStorage.setItem('rh_batch_count', String(batchCount)); } catch(e){}
            const label = document.getElementById('batchValue');
            const slider = document.getElementById('batchSlider');
            if(label) label.textContent = batchCount;
            if(slider) slider.value = batchCount;
        }

        async function uploadImageFile(file, fieldId){
            if(!file || !fieldId) return;
            const preview = URL.createObjectURL(file);
            fieldImageUrls[fieldId] = preview;
            refreshRefGrid();
            const form = new FormData();
            form.append('files', file);
            try {
                const data = await fetch('/api/ai/upload', { method:'POST', body:form }).then(r=>r.json());
                const savedUrl = StudioRefUpload.normalizeImageUrl(data.files?.[0]?.url || '');
                if(savedUrl){
                    if(fieldImageUrls[fieldId]?.startsWith('blob:')) try { URL.revokeObjectURL(fieldImageUrls[fieldId]); } catch(e){}
                    fieldImageUrls[fieldId] = savedUrl;
                    fieldValues[fieldId] = savedUrl;
                    persistCurrentWorkflowForm();
                }
                refreshRefGrid();
                syncGenBtnState();
            } catch(e){
                alert(tr('comfy.imageUploadFailed'));
                delete fieldValues[fieldId];
                delete fieldImageUrls[fieldId];
                persistCurrentWorkflowForm();
                refreshRefGrid();
                syncGenBtnState();
            }
        }
        async function assignImageFromUrl(url, fieldId){
            const normalized = StudioRefUpload.normalizeImageUrl(url);
            if(!normalized || !fieldId) return;
            fieldImageUrls[fieldId] = normalized;
            fieldValues[fieldId] = normalized;
            persistCurrentWorkflowForm();
            refreshRefGrid();
            syncGenBtnState();
            cancelBoardPick();
        }

        function collectRunFields(){
            const out = { ...fieldValues };
            effectiveFields().forEach(f => {
                const t = rhEffectiveFieldType(f);
                if(t === 'video' || t === 'audio'){
                    const url = rhMediaFieldUrl(f);
                    if(url) out[f.id] = url;
                    else delete out[f.id];
                    return;
                }
                if(t === 'number' && out[f.id] !== undefined && out[f.id] !== ''){
                    out[f.id] = Number(out[f.id]);
                } else if(t === 'select' && out[f.id] !== undefined && out[f.id] !== null){
                    out[f.id] = String(out[f.id]);
                }
            });
            return out;
        }
        function collectPrimaryPrompt(){
            const exposed = promptFields();
            if(!exposed.length) return '';
            for(const f of exposed){
                const v = String(fieldValues[f.id] ?? '').trim();
                if(v) return v;
            }
            return '';
        }
        function collectReferenceImages(){
            return effectiveFields().filter(f => rhFieldKind(f)==='image').map(f => {
                const url = StudioRefUpload.normalizeImageUrl(fieldImageUrls[f.id] || fieldValues[f.id] || '');
                if(!url || url.startsWith('blob:')) return null;
                return { url, name: f.name || f.fieldName || '', role: '' };
            }).filter(Boolean);
        }
        async function validateBeforeRun(){
            if(!selectedId){ alert(tr('rhPage.selectWorkflow')); return false; }
            const cfg = await fetch('/api/runninghub/config').then(r=>r.json()).catch(()=>({}));
            if(!cfg.has_key){ alert(tr('rhPage.noApiKey')); openRhSettings(); return false; }
            if(promptFields().length && !collectPrimaryPrompt()){ alert(tr('rhPage.promptRequired')); return false; }
            for(const f of effectiveFields().filter(x => rhFieldKind(x)==='image')){
                const url = StudioRefUpload.normalizeImageUrl(fieldImageUrls[f.id] || fieldValues[f.id] || '');
                if(!url || url.startsWith('blob:')){ alert(tr('rhPage.imageRequired')); return false; }
            }
            for(const f of effectiveFields().filter(x => rhFieldKind(x)==='video')){
                const url = rhMediaFieldUrl(f);
                if(!url || url.startsWith('blob:')){ alert(tr('rhPage.videoRequired')); return false; }
            }
            for(const f of effectiveFields().filter(x => rhFieldKind(x)==='audio')){
                const url = rhMediaFieldUrl(f);
                if(!url || url.startsWith('blob:')){ alert(tr('rhPage.audioRequired')); return false; }
            }
            return true;
        }

        async function clearPendingJob(jobId){
            pendingJobs = pendingJobs.filter(j => j.id !== jobId);
            if(window.deletePendingJobOnServer) deletePendingJobOnServer(jobId);
            renderOutputGrid();
            syncGenBtnState();
        }

        function failPendingJob(jobId, message, delay = 3200){
            const job = pendingJobs.find(j => j.id === jobId);
            if(job) job.error = message || tr('rhPage.generateFailed');
            renderOutputGrid();
            syncGenBtnState();
            if(delay > 0){
                setTimeout(() => { clearPendingJob(jobId); }, delay);
            } else {
                clearPendingJob(jobId);
            }
        }

        const resumingJobIds = new Set();

        async function resumePendingJobPoll(job){
            if(!job?.id || !job.task_id || resumingJobIds.has(job.id)) return;
            resumingJobIds.add(job.id);
            try {
                const data = await pollCanvasRunningHubTask(job.task_id);
                const images = Array.isArray(data.images) ? data.images : [];
                const videos = Array.isArray(data.videos) ? data.videos : [];
                const audios = Array.isArray(data.audios) ? data.audios : [];
                if(!images.length && !videos.length && !audios.length) throw new Error(tr('rhPage.noOutput'));
                upsertHistoryItem({
                    prompt: data.prompt || job.prompt || '',
                    images,
                    videos,
                    audios,
                    timestamp: data.timestamp || Date.now()/1000,
                    type: HISTORY_TYPE,
                    workflow_id: data.workflow_id || selectedId,
                    params: data.params || {},
                });
                resumingJobIds.delete(job.id);
                await clearPendingJob(job.id);
            } catch(err){
                resumingJobIds.delete(job.id);
                failPendingJob(job.id, err.message || tr('rhPage.generateFailed'));
            }
        }

        async function resumePendingJobs(){
            try {
                const jobs = await fetch('/api/online-pending').then(r => r.json());
                if(!Array.isArray(jobs) || !jobs.length) return;
                const now = Date.now() / 1000;
                let changed = false;
                for(const serverJob of jobs){
                    if(serverJob.error) continue;
                    if(serverJob.mediaKind && serverJob.mediaKind !== 'runninghub') continue;
                    if(!serverJob.task_id){
                        if(serverJob.timestamp && now - serverJob.timestamp > 120){
                            fetch('/api/online-pending/' + encodeURIComponent(serverJob.id), { method:'DELETE' }).catch(()=>{});
                        }
                        continue;
                    }
                    let local = pendingJobs.find(j => j.id === serverJob.id);
                    if(!local){
                        local = { ...serverJob };
                        pendingJobs.unshift(local);
                        changed = true;
                    } else {
                        Object.assign(local, serverJob);
                    }
                    resumePendingJobPoll(local);
                }
                if(changed) renderOutputGrid();
                syncGenBtnState();
            } catch(e){
                console.error('Resume pending jobs failed:', e);
            }
        }

        async function runGenerateJob(jobId, snapshot){
            const snap = snapshot || buildRunSnapshot();
            try {
                const createRes = await fetch('/api/canvas-runninghub-tasks', {
                    method:'POST',
                    headers:{'Content-Type':'application/json'},
                    body:JSON.stringify({
                        workflow_id: snap.workflow_id,
                        fields: snap.fields,
                        prompt: snap.prompt,
                        reference_images: snap.reference_images,
                        client_id: CLIENT_ID,
                    })
                }).then(async r => {
                    if(!r.ok){
                        const data = await r.json().catch(() => ({}));
                        const d = data.detail;
                        const msg = typeof d === 'string' ? d : (Array.isArray(d) ? (d[0]?.msg || String(d[0])) : '') || data.msg;
                        throw new Error(msg || tr('rhPage.generateFailed'));
                    }
                    return r.json();
                });
                const taskId = createRes.task_id;
                const job = pendingJobs.find(j => j.id === jobId);
                if(job) job.task_id = taskId;
                if(window.updatePendingJobOnServer) updatePendingJobOnServer(jobId, { task_id: taskId });
                renderOutputGrid();

                const data = await pollCanvasRunningHubTask(taskId);
                const images = Array.isArray(data.images) ? data.images : [];
                const videos = Array.isArray(data.videos) ? data.videos : [];
                const audios = Array.isArray(data.audios) ? data.audios : [];
                if(!images.length && !videos.length && !audios.length) throw new Error(tr('rhPage.noOutput'));
                upsertHistoryItem({
                    prompt: data.prompt || snap.prompt || '',
                    images,
                    videos,
                    audios,
                    timestamp: data.timestamp || Date.now()/1000,
                    type: HISTORY_TYPE,
                    workflow_id: data.workflow_id || snap.workflow_id,
                    params: data.params || { fields: snap.fields, reference_images: snap.reference_images },
                });
                await clearPendingJob(jobId);
            } catch(err){
                const msg = typeof err.message === 'string' ? err.message : tr('rhPage.generateFailed');
                failPendingJob(jobId, msg);
            }
        }

        async function submitGenerate(){
            if(activePendingCount() >= RH_MAX_CONCURRENT){
                alert(tr('rhPage.concurrentLimit'));
                return;
            }
            if(!(await validateBeforeRun())) return;
            document.getElementById('placeholder')?.classList.add('hidden');
            const promptText = collectPrimaryPrompt() || currentWorkflow?.name || tr('rhPage.generate');
            const snapshot = { ...buildRunSnapshot(), prompt: promptText };
            const slotsLeft = RH_MAX_CONCURRENT - activePendingCount();
            const launches = Math.min(batchCount, slotsLeft);
            if(!launches) return;
            for(let i=0; i<launches; i++){
                const jobId = `rh_${Date.now()}_${i}_${Math.random().toString(36).slice(2, 7)}`;
                const jobObj = { id: jobId, prompt: promptText, mediaKind: 'runninghub' };
                pendingJobs.unshift(jobObj);
                if(window.registerPendingJobOnServer) registerPendingJobOnServer(jobObj);
                void runGenerateJob(jobId, snapshot);
            }
            renderOutputGrid();
            syncGenBtnState();
        }

        function historyKey(item){ return StudioHistoryMeta.historyKey(item); }
        function loadMeta(){
            try {
                pinnedIds = StudioHistoryMeta.normalizeIdList(JSON.parse(localStorage.getItem(META_PIN)||'[]'));
                favoriteIds = StudioHistoryMeta.normalizeIdList(JSON.parse(localStorage.getItem(META_FAV)||'[]'));
                displayOrder = StudioHistoryMeta.normalizeIdList(JSON.parse(localStorage.getItem(META_ORDER)||'[]'));
            } catch(e){ pinnedIds=[]; favoriteIds=[]; displayOrder=[]; }
        }
        function saveMeta(){
            try {
                pinnedIds = StudioHistoryMeta.normalizeIdList(pinnedIds);
                favoriteIds = StudioHistoryMeta.normalizeIdList(favoriteIds);
                displayOrder = StudioHistoryMeta.normalizeIdList(displayOrder);
                localStorage.setItem(META_PIN, JSON.stringify(pinnedIds));
                localStorage.setItem(META_FAV, JSON.stringify(favoriteIds));
                localStorage.setItem(META_ORDER, JSON.stringify(displayOrder));
                StudioHistoryMeta.saveUserMeta(META_SCOPE, { pinnedIds, favoriteIds, displayOrder });
            } catch(e){}
        }
        async function loadMetaFromServer(){
            loadMeta();
            const remote = await StudioHistoryMeta.loadUserMeta(META_SCOPE);
            const merged = StudioHistoryMeta.mergeMetaSources({ pinnedIds, favoriteIds, displayOrder }, remote);
            pinnedIds = merged.pinnedIds;
            favoriteIds = merged.favoriteIds;
            displayOrder = merged.displayOrder;
            saveMeta();
        }
        function syncDisplayOrder(opts){
            const persist = !!(opts && opts.persist);
            const synced = StudioHistoryMeta.syncMetaState({ pinnedIds, favoriteIds, displayOrder }, allHistory);
            pinnedIds = synced.pinnedIds;
            favoriteIds = synced.favoriteIds;
            displayOrder = synced.displayOrder;
            if(persist) saveMeta();
        }
        function findHistoryByKey(key){ return allHistory.find(h => StudioHistoryMeta.keysEqual(historyKey(h), key)); }
        function sortedHistory(){
            syncDisplayOrder();
            const seen = new Set();
            const out = [];
            displayOrder.forEach(id => {
                const item = findHistoryByKey(id);
                if(!item) return;
                const k = historyKey(item);
                if(!k || seen.has(k)) return;
                seen.add(k);
                out.push(item);
            });
            allHistory.forEach(item => {
                const k = historyKey(item);
                if(!k || seen.has(k)) return;
                seen.add(k);
                out.push(item);
            });
            return out;
        }
        function upsertHistoryItem(item){
            if(!item?.images?.[0] && !item?.videos?.[0] && !item?.audios?.[0]) return;
            const key = historyKey(item);
            const idx = allHistory.findIndex(h => historyKey(h) === key);
            if(idx >= 0) allHistory[idx] = item; else allHistory.unshift(item);
            if(key && !displayOrder.includes(key)) displayOrder.unshift(key);
            saveMeta();
        }
        function mediaPreview(item){
            if(item?.videos?.[0]) return { kind:'video', url: item.videos[0] };
            if(item?.audios?.[0]) return { kind:'audio', url: item.audios[0] };
            return { kind:'image', url: item.images?.[0] || '' };
        }
        function renderOutputGrid(){
            const grid = document.getElementById('outputGrid');
            const box = document.getElementById('resultBox');
            const placeholder = document.getElementById('placeholder');
            const items = sortedHistory();
            const hasContent = items.length || pendingJobs.length;
            if(!hasContent){
                grid.classList.add('hidden'); grid.innerHTML = '';
                box.classList.remove('has-outputs');
                placeholder.classList.remove('hidden');
                return;
            }
            placeholder.classList.add('hidden');
            box.classList.add('has-outputs');
            grid.classList.remove('hidden');
            grid.style.gridTemplateColumns = `repeat(${outputCols}, minmax(0,1fr))`;
            grid.innerHTML = pendingJobs.map(j => `<div class="output-grid-cell is-pending"><div class="cell-pending">${j.error?`<p>${escapeHtml(j.error)}</p>`:`<div class="pending-spin"></div><p>${tr('online.generating')}</p>`}</div></div>`).join('')
                + items.map(d => {
                    const key = historyKey(d), pinned = StudioHistoryMeta.includesKey(pinnedIds, key), fav = StudioHistoryMeta.includesKey(favoriteIds, key);
                    const media = mediaPreview(d);
                    const inner = media.kind === 'video'
                        ? `<video src="${escapeHtml(media.url)}" muted loop playsinline></video>`
                        : `<img src="${escapeHtml(media.url)}" alt="" class="draggable-output" draggable="true" loading="lazy">`;
                    return `<div class="output-grid-cell${pinned?' is-pinned':''}${fav?' is-favorite':''}" data-ts="${escapeHtml(key)}" data-img-url="${escapeAttr(media.url)}">${inner}
                        <div class="cell-actions">
                            <button type="button" class="cell-action-btn${pinned?' active':''}" onclick="togglePin('${escapeHtml(key)}',event)"><i data-lucide="arrow-up-to-line"></i></button>
                            <button type="button" class="cell-action-btn${fav?' fav-active active':''}" onclick="toggleFavorite('${escapeHtml(key)}',event)"><i data-lucide="heart"></i></button>
                            <button type="button" class="cell-action-btn" onclick="applyRecordParams(historyItem('${escapeHtml(key)}'),event)"><i data-lucide="clipboard-copy"></i></button>
                            <a href="${escapeHtml(media.url)}" download class="cell-action-btn" onclick="event.stopPropagation()"><i data-lucide="download"></i></a>
                            <button type="button" class="cell-action-btn" onclick="deleteHistoryItem('${escapeHtml(key)}',event)"><i data-lucide="trash-2"></i></button>
                        </div></div>`;
                }).join('');
            bindOutputGridCells(items);
            lucide.createIcons();
            syncOutputDragState();
        }
        function bindOutputGridCells(items){
            const itemMap = new Map(items.map(item => [historyKey(item), item]));
            document.querySelectorAll('#outputGrid .output-grid-cell[data-ts]').forEach(cell => {
                const data = itemMap.get(cell.dataset.ts);
                if(!data) return;
                const media = mediaPreview(data);
                const img = cell.querySelector('img.draggable-output');
                const pickId = StudioRefUpload.getBoardPickSlotId();
                if(img && media.kind === 'image'){
                    img.draggable = !pickId;
                    img.ondragstart = e => {
                        if(pickId){ e.preventDefault(); return; }
                        e.stopPropagation();
                        StudioRefUpload.setImageDragData(e, media.url);
                    };
                }
                cell.onclick = e => {
                    if(pickId && !e.target.closest('.cell-actions') && media.kind === 'image'){
                        assignImageFromUrl(media.url, pickId);
                        return;
                    }
                    if(!e.target.closest('.cell-actions')) openLightbox(data);
                };
            });
        }
        function historyItem(key){ return findHistoryByKey(key); }
        function togglePin(key, ev){
            ev?.stopPropagation();
            if(StudioHistoryMeta.includesKey(pinnedIds, key)) pinnedIds = pinnedIds.filter(x => !StudioHistoryMeta.keysEqual(x, key));
            else pinnedIds = [...pinnedIds.filter(x => !StudioHistoryMeta.keysEqual(x, key)), key];
            saveMeta(); renderOutputGrid();
        }
        function toggleFavorite(key, ev){
            ev?.stopPropagation();
            if(StudioHistoryMeta.includesKey(favoriteIds, key)) favoriteIds = favoriteIds.filter(x => !StudioHistoryMeta.keysEqual(x, key));
            else favoriteIds = [key, ...favoriteIds.filter(x => !StudioHistoryMeta.keysEqual(x, key))];
            saveMeta(); renderOutputGrid();
        }
        async function deleteHistoryItem(key, ev){
            ev?.stopPropagation();
            if(!confirm(tr('online.deleteConfirm'))) return;
            const item = historyItem(key); if(!item) return;
            await fetch('/api/history/delete', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({timestamp:item.timestamp}) });
            allHistory = allHistory.filter(h => historyKey(h) !== key);
            pinnedIds = pinnedIds.filter(x => x !== key); favoriteIds = favoriteIds.filter(x => x !== key); displayOrder = displayOrder.filter(x => x !== key);
            saveMeta(); renderOutputGrid();
        }
        async function applyRecordParams(data, ev){
            ev?.stopPropagation();
            if(!data) return;
            const wfId = data.workflow_id || data.params?.workflow_id;
            if(wfId) await selectWorkflow(wfId);
            const saved = data.params?.fields || {};
            Object.entries(saved).forEach(([fid, val]) => { fieldValues[fid] = val; });
            const promptText = String(data.prompt || '').trim();
            if(promptText){
                promptFields().forEach((f, i) => {
                    if(i === 0 || !String(fieldValues[f.id] ?? '').trim()) fieldValues[f.id] = promptText;
                });
            }
            const refs = data.params?.reference_images || [];
            effectiveFields().filter(f => rhFieldKind(f)==='image').forEach((f, i) => {
                const ref = refs[i];
                if(ref?.url){
                    const url = StudioRefUpload.normalizeImageUrl(ref.url);
                    fieldImageUrls[f.id] = url;
                    fieldValues[f.id] = url;
                }
            });
            effectiveFields().filter(f => rhFieldKind(f)==='video' || rhFieldKind(f)==='audio').forEach(f => {
                const url = StudioMediaRefUpload.normalizeUrl(fieldValues[f.id] || '');
                if(url){
                    fieldMediaUrls[f.id] = url;
                }
            });
            persistCurrentWorkflowForm();
            renderDynamicPanel();
            syncGenBtnState();
        }
        window.applyRecordParams = applyRecordParams;
        async function loadAllHistory(){
            if(historyLoading) return; historyLoading = true;
            try {
                allHistory = await fetch(`/api/history?type=${HISTORY_TYPE}`).then(r=>r.json());
                if(!Array.isArray(allHistory)) allHistory = [];
                syncDisplayOrder({ persist: true }); renderOutputGrid();
            } finally { historyLoading = false; }
        }
        function setOutputCols(n){
            outputCols = Math.min(6, Math.max(1, Number(n)||2));
            try { localStorage.setItem('rh_output_cols', String(outputCols)); } catch(e){}
            document.getElementById('outputColsValue').textContent = outputCols;
            document.getElementById('outputColsSlider').value = outputCols;
            renderOutputGrid();
        }
        function openLightbox(data){
            currentLightboxData = data;
            const media = mediaPreview(data);
            const img = document.getElementById('lightboxImg');
            const vid = document.getElementById('lightboxVideo');
            if(media.kind === 'video'){
                img.classList.add('hidden');
                vid.classList.remove('hidden');
                vid.src = media.url;
            } else {
                vid.classList.add('hidden');
                vid.pause?.();
                img.classList.remove('hidden');
                img.src = media.url;
            }
            document.getElementById('lightboxPrompt').textContent = data.prompt || '';
            document.getElementById('lightbox').classList.replace('hidden','flex');
        }
        function closeLightbox(){
            document.getElementById('lightbox').classList.replace('flex','hidden');
            document.getElementById('lightboxVideo').pause?.();
        }

        window.addEventListener('message', e => {
            if(e.data?.type === 'studio-lang'){
                window.StudioI18n?.set(e.data.lang);
                syncGenBtnState();
            }
            if(e.data?.type === 'runninghub-changed'){
                loadWorkflowList();
            }
        });
        try {
            new BroadcastChannel('studio-api').onmessage = e => { if(e.data?.type === 'runninghub-changed') loadWorkflowList(); };
        } catch(e){}

        const socket = new WebSocket(`${location.protocol==='https:'?'wss:':'ws:'}//${location.host}/ws/stats?client_id=${encodeURIComponent(CLIENT_ID)}`);
        socket.onmessage = e => {
            try {
                const msg = JSON.parse(e.data);
                if(msg.type === 'new_image' && msg.data?.type === HISTORY_TYPE){
                    upsertHistoryItem(msg.data);
                    renderOutputGrid();
                }
            } catch(err){}
        };

        window.onload = async () => {
            if(window.StudioI18n){ StudioI18n.apply(); document.title = tr('rhPage.title'); }
            lucide.createIcons();
            await loadMetaFromServer();
            try { const s = parseInt(localStorage.getItem('rh_batch_count')||'1',10); if(s>=1&&s<=4) batchCount=s; } catch(e){}
            try { const s = parseInt(localStorage.getItem('rh_output_cols')||'2',10); if(s>=1&&s<=6) outputCols=s; } catch(e){}
            setOutputCols(outputCols);
            document.getElementById('outputColsSlider').oninput = e => setOutputCols(e.target.value);
            await loadWorkflowList();
            await loadAllHistory();
            await resumePendingJobs();
            if(window.StudioPanelBridge){
                const bridge = StudioPanelBridge;
                renderOutputGrid = function(){ bridge.notifyPending(pendingJobs); bridge.notifyRefresh(); };
                loadAllHistory = async function(){ bridge.notifyRefresh(); };
                upsertHistoryItem = function(item){
                    if(!item?.images?.[0] && !item?.videos?.[0] && !item?.audios?.[0]) return;
                    bridge.notifyAddItem(item);
                };
            }
        };
    </script>
</body>
</html>
