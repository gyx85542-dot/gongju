<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
    <title>🐻 studio</title>
    <style>
        html.studio-route-booting body {
            visibility: hidden !important;
        }
    </style>
    <script>
        (function(){
            try {
                localStorage.setItem('studio_theme', 'light');
                localStorage.setItem('canvas_theme', 'light');
                document.documentElement.classList.add('studio-route-booting');
            } catch(e) {}
        })();
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="/static/theme.js?v=20260520-magnific-light"></script>
    <script src="/static/i18n.js?v=20260809-text-tool"></script>
    <link rel="stylesheet" href="/static/studio-magnific.css?v=20260530-cell-hover">
    <link rel="stylesheet" href="/static/studio-borderless.css?v=20260530-range-white">
    <link rel="stylesheet" href="/static/studio-range-slider.css?v=20260530-range-white">
    <link rel="stylesheet" href="/static/studio-media-viewer.css?v=20260809-bw-swatch">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap');

        /* 本地 Tailwind 工具类兜底：CDN 慢/未就绪时也能立刻给图标尺寸，避免首屏左侧栏空白 */
        .w-1\.5 { width: 0.375rem; }
        .h-1\.5 { height: 0.375rem; }
        .w-4 { width: 1rem; }
        .h-4 { height: 1rem; }
        .w-5 { width: 1.25rem; }
        .h-5 { height: 1.25rem; }
        .flex-shrink-0 { flex-shrink: 0; }
        .rounded-full { border-radius: 9999px; }
        .mb-12 { margin-bottom: 3rem; }
        .transition-colors { transition-property: color, background-color, border-color, fill, stroke; transition-duration: 150ms; transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1); }
        .animate-pulse { animation: studio-pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
        @keyframes studio-pulse { 0%, 100% { opacity: 1; } 50% { opacity: .5; } }

        :root {
            --accent: #ff4d94;
            --accent-fg: #ffffff;
            --fluid-ease: cubic-bezier(0.22, 1, 0.36, 1);
            --bg: #101010;
            --sidebar-bg: #1a1a1a;
            --stage-bg: #101010;
            --border: rgba(255, 255, 255, 0.08);
            --stage-border: transparent;
            --text: #f5f5f5;
            --muted: #737373;
            --nav-hover-bg: #333333;
            --nav-active-bg: #333333;
            --nav-active-text: #fafafa;
            --monitor-bg: rgba(26, 26, 26, 0.92);
            --monitor-border: rgba(255, 255, 255, 0.08);
            --monitor-shadow: 0 2px 12px rgba(0, 0, 0, 0.24);
            --divider: rgba(255, 255, 255, 0.08);
            --scrollbar: rgba(255, 255, 255, 0.18);
            --scrollbar-hover: rgba(255, 255, 255, 0.28);
            --shell-gap: 8px;
            --shell-pad: 8px;
            --module-radius: 12px;
            --panel-radius: 12px;
            --workspace-card-bg: #161616;
            --params-bg: #161616;
            --gallery-bg: #1a1a1a;
            --sidebar-control-radius: 12px;
            --studio-panel-width: 320px;
            --studio-panel-min: 280px;
            --studio-panel-max: 500px;
        }

        /* 三栏模块：统一高度与圆角 */
        .studio-module {
            border-radius: var(--module-radius);
            overflow: hidden;
            min-height: 0;
            height: 100%;
            box-sizing: border-box;
        }

        /* 极简滚动条 */
        html,
        body {
            overscroll-behavior: auto;
        }

        *::-webkit-scrollbar {
            width: 10px !important;
            height: 10px !important;
            background: transparent !important;
        }

        *::-webkit-scrollbar-track {
            background: transparent !important;
            border: none !important;
        }

        *::-webkit-scrollbar-thumb {
            background-color: var(--scrollbar) !important;
            border: 3px solid transparent !important;
            border-right-width: 3px !important;
            background-clip: padding-box !important;
            border-radius: 5px !important;
            min-height: 36px;
        }

        *::-webkit-scrollbar-thumb:hover {
            background-color: var(--scrollbar-hover) !important;
        }

        *::-webkit-scrollbar-corner {
            background: transparent !important;
        }

        * {
            scrollbar-width: thin !important;
            scrollbar-color: var(--scrollbar) transparent !important;
        }

        body {
            background: var(--bg);
            font-family: var(--mg-display, 'Space Grotesk'), 'Inter', sans-serif;
            overflow: hidden;
            height: 100vh;
            color: var(--text);
            transition: background 0.35s var(--fluid-ease), color 0.35s var(--fluid-ease);
        }

        .app-shell {
            display: flex;
            align-items: stretch;
            width: 100%;
            height: 100vh;
            background: var(--bg);
            position: relative;
            transition: background 0.35s;
            gap: var(--shell-gap);
            padding: var(--shell-pad);
            box-sizing: border-box;
        }

        /* 侧边栏 */
        .sidebar {
            width: 60px;
            min-width: 60px;
            background: var(--sidebar-bg);
            display: flex;
            flex-direction: column;
            align-items: center;
            align-self: stretch;
            border-right: none;
            box-shadow: none;
            padding: 20px 0 16px;
            transition: width 0.35s var(--fluid-ease), background 0.35s;
            z-index: 50;
        }

        .sidebar.expanded {
            width: 196px;
        }

        /* 首次加载时与 iframe 的 0.5s 淡入同步播放，避免侧栏"焊死"在原地造成视觉断层 */
        @keyframes sidebar-enter {
            from { opacity: 0; transform: translateX(-6px); }
            to { opacity: 1; transform: translateX(0); }
        }
        html:not(.studio-route-booting) .sidebar {
            animation: sidebar-enter 0.5s var(--fluid-ease);
        }

        .logo-ring {
            width: 34px;
            height: 34px;
            border: none;
            border-radius: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: visible;
            position: relative;
            flex-shrink: 0;
            transition: border-radius 0.35s var(--fluid-ease), border-color 0.35s, box-shadow 0.35s;
        }

        .logo-ring .logo-emoji {
            font-size: 22px;
            line-height: 1;
            display: block;
            user-select: none;
            transition: opacity 0.25s var(--fluid-ease), transform 0.25s var(--fluid-ease);
            border-radius: inherit;
        }

        .logo-ring .logo-emoji-expanded {
            display: none;
        }

        .logo-ring .logo-emoji-collapsed {
            display: block;
        }

        .sidebar.expanded .logo-ring .logo-emoji-expanded {
            display: block;
        }

        .sidebar.expanded .logo-ring .logo-emoji-collapsed {
            display: none;
        }

        .logo-status-dot {
            position: absolute;
            right: 1px;
            bottom: 1px;
            width: 7px;
            height: 7px;
            border-radius: 50%;
            border: 1.5px solid var(--sidebar-bg);
            background: var(--text);
            transition: background-color 0.25s var(--fluid-ease);
            pointer-events: none;
            z-index: 2;
        }

        .sidebar.expanded .logo-ring {
            border-radius: 50%;
        }

        .sidebar.expanded .logo-status-dot {
            right: -1px;
            bottom: -1px;
        }

        .sidebar-toggle-wrap {
            width: 100%;
            display: flex;
            justify-content: center;
            margin-bottom: 8px;
            padding: 0;
            box-sizing: border-box;
            transition: padding 0.35s var(--fluid-ease);
        }

        .sidebar.expanded .sidebar-toggle-wrap {
            justify-content: flex-end;
            padding: 0 12px;
        }

        .sidebar-toggle {
            width: 40px;
            height: 32px;
            border: 1px solid transparent;
            border-radius: var(--sidebar-control-radius);
            background: transparent;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            margin-bottom: 0;
            flex-shrink: 0;
            transition: background-color 0.2s, color 0.2s, border-color 0.2s;
        }

        .sidebar-toggle:hover {
            background: var(--nav-hover-bg);
            color: #ffffff;
        }

        .sidebar-toggle svg {
            width: 14px !important;
            height: 14px !important;
            stroke-width: 2;
        }

        .sidebar nav {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            gap: 2px;
        }

        .sidebar.expanded nav {
            align-items: stretch;
            padding: 0 12px;
            box-sizing: border-box;
        }

        .sidebar-toggle .icon-expand { display: block; }
        .sidebar-toggle .icon-collapse { display: none; }
        .sidebar.expanded .sidebar-toggle .icon-expand { display: none; }
        .sidebar.expanded .sidebar-toggle .icon-collapse { display: block; }

        /* 导航项 */
        .nav-item {
            position: relative;
            width: 40px;
            height: 34px;
            margin: 3px 0;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: var(--sidebar-control-radius);
            cursor: pointer;
            transition: width 0.35s var(--fluid-ease), background-color 0.2s, color 0.2s, box-shadow 0.2s, border-color 0.2s;
            color: #ffffff;
            overflow: hidden;
            padding: 0;
            border: 1px solid transparent;
            box-sizing: border-box;
        }

        .sidebar.expanded .nav-item {
            width: 172px;
            height: auto;
            min-height: 38px;
            justify-content: flex-start;
            padding: 7px 0 7px 6px;
            gap: 10px;
            overflow: visible;
        }

        .nav-icon {
            width: 28px;
            height: 28px;
            flex-shrink: 0;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: inherit;
            transition: color 0.2s;
            background: transparent;
        }

        .nav-icon svg {
            width: 15px !important;
            height: 15px !important;
            stroke-width: 2;
        }

        .nav-item:hover {
            background: var(--nav-hover-bg);
            color: #ffffff;
        }

        .nav-item.active {
            background: rgba(255, 255, 255, 0.12);
            color: #ffffff;
        }

        .nav-item:not(.active) .nav-icon {
            color: #ffffff;
        }

        .nav-item.active .nav-icon {
            color: #ffffff;
        }

        .nav-text {
            opacity: 0;
            max-width: 0;
            overflow: hidden;
            font-weight: 500;
            font-size: 12px;
            letter-spacing: -0.01em;
            white-space: nowrap;
            transition: opacity 0.25s var(--fluid-ease), max-width 0.3s var(--fluid-ease);
            line-height: 1.25;
            color: #ffffff;
        }

        .sidebar.expanded .nav-text {
            opacity: 1;
            max-width: 132px;
        }

        .sidebar:not(.expanded) .nav-item {
            gap: 0;
        }

        /* 主舞台区 — 透明布局槽，三栏模块在 studio-shell 内对齐 */
        .stage {
            flex: 1;
            min-width: 0;
            min-height: 0;
            background: transparent;
            margin: 0;
            border-radius: 0;
            overflow: visible;
            border: none;
            box-shadow: none;
            position: relative;
            display: flex;
            flex-direction: column;
            transition: background 0.35s var(--fluid-ease);
        }

        iframe {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            border: none;
            opacity: 0;
            transform: translateY(6px);
            filter: blur(6px);
            transition: opacity 0.45s var(--fluid-ease), transform 0.45s var(--fluid-ease), filter 0.45s var(--fluid-ease);
            pointer-events: none;
        }

        iframe.active {
            opacity: 1;
            transform: translateY(0);
            filter: blur(0);
            pointer-events: auto;
        }

        .studio-shell {
            display: none;
            flex: 1;
            min-height: 0;
            width: 100%;
            gap: var(--shell-gap);
            padding: 0;
            box-sizing: border-box;
        }

        .studio-shell.active {
            display: flex;
            flex-direction: row;
            align-items: stretch;
            width: 100%;
            height: 100%;
        }

        .studio-panels {
            position: relative;
            flex: 0 0 var(--studio-panel-width);
            width: var(--studio-panel-width);
            min-width: var(--studio-panel-min);
            max-width: min(var(--studio-panel-max), 35vw);
            background: var(--params-bg);
            border-right: none;
        }

        .studio-panel-resize-handle {
            position: absolute;
            top: 0;
            right: 0;
            width: 8px;
            height: 100%;
            cursor: col-resize;
            z-index: 30;
            touch-action: none;
        }

        .studio-panel-resize-handle::after {
            content: '';
            position: absolute;
            top: 0;
            bottom: 0;
            right: 0;
            width: 1px;
            background: transparent;
            transition: background 0.18s var(--fluid-ease);
            pointer-events: none;
        }

        .studio-panel-resize-handle:hover::after,
        .studio-shell.is-resizing-panel .studio-panel-resize-handle::after {
            background: rgba(255, 255, 255, 0.38);
        }

        .studio-shell.is-resizing-panel {
            user-select: none;
            -webkit-user-select: none;
        }

        .studio-shell.is-resizing-panel .studio-panels iframe,
        .studio-shell.is-resizing-panel .studio-gallery-wrap iframe {
            pointer-events: none;
        }

        .studio-gallery-wrap {
            position: relative;
            flex: 1;
            min-width: 0;
            background: var(--gallery-bg);
        }

        .studio-panels iframe,
        .studio-gallery-wrap iframe {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            border: none;
            border-radius: 0;
            opacity: 0;
            transform: translateY(6px);
            filter: blur(6px);
            transition: opacity 0.45s var(--fluid-ease), transform 0.45s var(--fluid-ease), filter 0.45s var(--fluid-ease);
            pointer-events: none;
        }

        .studio-panels iframe.active,
        .studio-gallery-wrap iframe.active {
            opacity: 1;
            transform: translateY(0);
            filter: blur(0);
            pointer-events: auto;
        }

        .full-stage {
            display: none;
            position: relative;
            flex: 1;
            min-height: 0;
            border-radius: var(--module-radius);
            overflow: hidden;
        }

        .full-stage.active {
            display: block;
        }

        .full-stage iframe {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            border: none;
            border-radius: 0;
            opacity: 0;
            transform: translateY(6px);
            filter: blur(6px);
            transition: opacity 0.45s var(--fluid-ease), transform 0.45s var(--fluid-ease), filter 0.45s var(--fluid-ease);
            pointer-events: none;
        }

        .full-stage iframe.active {
            opacity: 1;
            transform: translateY(0);
            filter: blur(0);
            pointer-events: auto;
        }

        /* 右下角监视器 */
        .nano-monitor {
            position: absolute;
            bottom: 20px;
            right: 20px;
            left: auto;
            z-index: 100;
            display: flex;
            align-items: center;
            gap: 10px;
            background: var(--monitor-bg);
            backdrop-filter: blur(16px) saturate(1.2);
            -webkit-backdrop-filter: blur(16px) saturate(1.2);
            padding: 8px 16px;
            border-radius: 4px;
            border: none;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.28);
            font-family: var(--mg-font, 'Inter'), ui-monospace, monospace;
            font-size: 11px;
            transition: all 0.35s var(--fluid-ease);
        }

        .nano-monitor.is-hidden {
            display: none !important;
        }

        .nano-monitor.is-busy {
            background: var(--text);
            color: var(--bg);
            border-color: transparent;
        }

        .stat-group {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 11px;
            font-weight: 700;
            color: var(--text);
        }

        .nano-monitor.is-busy .stat-group {
            color: #fff;
        }

        .divider {
            width: 1px;
            height: 12px;
            background: var(--divider);
        }

        .is-busy .divider {
            background: rgba(255, 255, 255, 0.2);
        }

        .pulse-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #10b981;
        }

        .spinner-nano {
            width: 10px;
            height: 10px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            display: none;
        }

        .is-busy .spinner-nano { display: block; }
        .is-busy .pulse-dot { display: none; }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .label-nano {
            text-transform: uppercase;
            letter-spacing: 0.5px;
            opacity: 0.5;
            font-size: 9px;
        }

        /* 侧栏底部操作区 */
        .side-actions {
            margin-top:auto;
            margin-bottom:12px;
            display:flex;
            flex-direction:column;
            align-items:center;
            gap:8px;
            width:100%;
        }

        .side-pill {
            width: 40px;
            height: 32px;
            border-radius: var(--sidebar-control-radius);
            background: transparent;
            border: 1px solid transparent;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: width 0.35s var(--fluid-ease), gap 0.35s var(--fluid-ease), background-color 0.2s, color 0.2s, border-color 0.2s;
            flex-shrink: 0;
            overflow: hidden;
            gap: 0;
            position: relative;
            padding: 0;
        }

        .sidebar.expanded .side-pill {
            width: 172px;
            gap: 8px;
            justify-content: flex-start;
            padding-left: 10px;
        }

        .side-pill:hover {
            background: var(--nav-hover-bg);
            color: #ffffff;
        }

        .side-pill.active {
            background: rgba(255, 255, 255, 0.12);
            color: #ffffff;
        }

        .side-pill-icon {
            width: 16px;
            height: 16px;
            flex: 0 0 auto;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .side-pill-icon svg {
            width: 14px !important;
            height: 14px !important;
            stroke-width: 2;
        }
        .side-pill-text {
            opacity:0;
            max-width:0;
            font-size:12px;
            font-weight:800;
            letter-spacing:.02em;
            white-space:nowrap;
            overflow:hidden;
            color:#ffffff;
            transition: opacity 0.25s var(--fluid-ease), max-width 0.3s var(--fluid-ease);
        }
        .sidebar.expanded .side-pill-text {
            opacity: 1;
            max-width: 120px;
        }
        .side-pill { gap: 0; }
    </style>
    <script src="/static/studio-range-slider.js?v=20260530-range-white" defer></script>
</head>

<body>

    <div class="app-shell">
        <aside class="sidebar studio-module">
            <div class="logo-ring mb-12" id="logoRing" role="img" aria-label="Logo">
                <span class="logo-emoji logo-emoji-collapsed" aria-hidden="true">🐻‍❄️</span>
                <span class="logo-emoji logo-emoji-expanded" aria-hidden="true">🐻</span>
                <div class="logo-status-dot" id="logo-dot"></div>
            </div>

            <div class="sidebar-toggle-wrap">
                <button type="button" class="sidebar-toggle" id="sidebarToggle" onclick="toggleSidebar()" title="展开侧栏" aria-label="Toggle sidebar">
                    <i data-lucide="chevron-right" class="icon-expand"></i>
                    <i data-lucide="chevron-left" class="icon-collapse"></i>
                </button>
            </div>

            <nav>
                <div class="nav-item active" onclick="switchUI(this, 'online')">
                    <span class="nav-icon"><i data-lucide="image"></i></span>
                    <span class="nav-text" data-i18n="nav.online">AI 生图</span>
                </div>
                <div class="nav-item" onclick="switchUI(this, 'video')">
                    <span class="nav-icon"><i data-lucide="clapperboard"></i></span>
                    <span class="nav-text" data-i18n="nav.video">AI 视频</span>
                </div>
                <div class="nav-item" onclick="switchUI(this, 'local')">
                    <span class="nav-icon"><i data-lucide="workflow"></i></span>
                    <span class="nav-text" data-i18n="nav.local">ComfyUI</span>
                </div>
                <div class="nav-item" onclick="switchUI(this, 'runninghub')">
                    <span class="nav-icon"><i data-lucide="zap"></i></span>
                    <span class="nav-text" data-i18n="nav.runninghub">RunningHub</span>
                </div>
                <div class="nav-item" onclick="switchUI(this, 'gpt-chat')">
                    <span class="nav-icon"><i data-lucide="messages-square"></i></span>
                    <span class="nav-text" data-i18n="nav.gpt">AI 对话</span>
                </div>
                <div class="nav-item" onclick="switchUI(this, 'reverse')">
                    <span class="nav-icon"><i data-lucide="scan-search"></i></span>
                    <span class="nav-text" data-i18n="nav.reverse">提示词反推</span>
                </div>
            </nav>

            <div class="side-actions">
                <button class="side-pill" onclick="toggleLanguage()" id="lang-toggle-btn" type="button" title="Language">
                    <span class="side-pill-icon"><i data-lucide="languages"></i></span>
                    <span class="side-pill-text" data-i18n="common.language">中文</span>
                </button>
                <button class="side-pill" onclick="switchUI(this, 'api-settings')" type="button" title="API 设置">
                    <span class="side-pill-icon"><i data-lucide="link-2"></i></span>
                    <span class="side-pill-text" data-i18n="common.apiSettings">API 设置</span>
                </button>
                <button class="side-pill" onclick="switchUI(this, 'comfyui-settings')" type="button" title="ComfyUI 设置">
                    <span class="side-pill-icon"><i data-lucide="blocks"></i></span>
                    <span class="side-pill-text" data-i18n="common.comfyuiSettings">ComfyUI 设置</span>

                const logoRing = document.getElementById('logoRing');
                if(!sidebar) return;
                sidebar.classList.toggle('expanded', expanded);

                if(persist){

    <script src="/static/studio-media-viewer.js?v=20260809-bw-swatch"></script>
    <script>
        function generateUUID() {
            if (typeof crypto !== 'undefined' && crypto.randomUUID) {
                try { return crypto.randomUUID(); } catch (e) { }
            }
            return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function (c) {
                var r = Math.random() * 16 | 0, v = c == 'x' ? r : (r & 0x3 | 0x8);
                return v.toString(16);
            });
        }
        const CID = localStorage.getItem("client_id") || generateUUID();
        localStorage.setItem("client_id", CID);
        const ACTIVE_PAGE_KEY = 'studio_active_page';
        const DEFAULT_PAGE_ID = 'online';
        const PAGE_IDS = ['online','local','video','gpt-chat','reverse','runninghub','api-settings','comfyui-settings','runninghub-settings','system-prompt-settings'];

        const STUDIO_PAGE_IDS = ['online','local','video','runninghub'];
        const STUDIO_AUDIO_EXT = /\.(mp3|wav|m4a|aac|ogg|flac|opus|weba)(\?|$)/i;
        window.__studioViewerCtx = { items: [], pinnedKeys: [], favoriteKeys: [] };

        function studioHistoryKey(item){ return window.StudioHistoryMeta ? StudioHistoryMeta.historyKey(item) : String(item?.timestamp ?? ''); }
        function studioEscapeHtml(s){ return String(s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
        function studioMediaUrl(item){ return (item?.videos && item.videos[0]) || (item?.audios && item.audios[0]) || (item?.images && item.images[0]) || ''; }
        function studioIsAudioItem(item){
            if(item?.audios?.length) return true;
            const url = studioMediaUrl(item);
            return STUDIO_AUDIO_EXT.test(url || '') || item?.type === 'online-audio';
        }
        function studioIsVideoItem(item){ if(studioIsAudioItem(item)) return false; return !!(item?.videos && item.videos.length); }
        function studioIsImageItem(item){ if(studioIsAudioItem(item) || studioIsVideoItem(item)) return false; return !!(item?.images && item.images.length); }

        function postGalleryViewerAction(action, item, options = {}){
            const frame = document.getElementById('frame-gallery');
            try {
                frame?.contentWindow?.postMessage({ type:'studio-viewer-action', action, item, reply: options.reply !== false }, '*');
            } catch(e) {}
        }

        function studioPageForHistoryItem(item){
            if(window.StudioHistoryMeta?.studioPageForHistoryType){
                return StudioHistoryMeta.studioPageForHistoryType(item?.type);
            }
            const t = String(item?.type || '').trim().toLowerCase();
            if(t === 'runninghub') return 'runninghub';
            if(t === 'local-comfy') return 'local';
            if(t === 'online-video' || t === 'online-audio') return 'video';
            return 'online';
        }

        function postApplyParamsToPanel(page, item){
            if(!item || !STUDIO_PAGE_IDS.includes(page)) return;
            const frame = document.getElementById('frame-' + page);
            if(!frame) return;
            const payload = { type: 'gallery-apply-params', item };
            const send = () => {
                try { frame.contentWindow?.postMessage(payload, '*'); } catch(e) {}
            };
            ensureFrameLoaded(frame);
            send();
            frame.addEventListener('load', send, { once: true });
        }

        function applyStudioHistoryParams(item){
            if(!item) return;
            const page = studioPageForHistoryItem(item);
            switchUI(navTriggerForPage(page), page);
            postApplyParamsToPanel(page, item);
        }

        function initStudioViewerHost(){
            if(!window.StudioMediaViewer) return;
            StudioMediaViewer.init({
                tr: (k) => window.StudioI18n ? StudioI18n.t(k) : k,
                escapeHtml: studioEscapeHtml,
                historyKey: studioHistoryKey,
                mediaUrl: studioMediaUrl,
                isVideoItem: studioIsVideoItem,
                isAudioItem: studioIsAudioItem,
                isImageItem: studioIsImageItem,
                lightboxItems: () => window.__studioViewerCtx.items || [],
                isPinned: (item) => (window.__studioViewerCtx.pinnedKeys || []).includes(studioHistoryKey(item)),
                isFavorite: (item) => (window.__studioViewerCtx.favoriteKeys || []).includes(studioHistoryKey(item)),
                togglePin: (item) => postGalleryViewerAction('togglePin', item),
                toggleFavorite: (item) => postGalleryViewerAction('toggleFavorite', item),
                onApplyParams: (item) => { applyStudioHistoryParams(item); StudioMediaViewer.close(); },
                onUpsertItem: (item) => postGalleryViewerAction('upsertItem', item),
                onRefresh: () => postGalleryViewerAction('refresh', null, { reply: false }),
                providerById: () => null
            });
        }

        window.addEventListener('message', e => {
            const data = e.data || {};
            if(data.type === 'studio-viewer-open'){
                window.__studioViewerCtx = {
                    items: data.items || [],
                    pinnedKeys: data.pinnedKeys || [],
                    favoriteKeys: data.favoriteKeys || []
                };
                StudioMediaViewer?.open(data.item);
                if(window.lucide) lucide.createIcons();
            }
            if(data.type === 'studio-viewer-context'){
                window.__studioViewerCtx = {
                    items: data.items || [],
                    pinnedKeys: data.pinnedKeys || [],
                    favoriteKeys: data.favoriteKeys || []
                };
                StudioMediaViewer?.refresh();
            }
        });

        const STUDIO_BUILD = '20260530-pending-fix';
        const STUDIO_BUILD_KEY = 'studio_shell_build';

        function frameTargetHref(frame){
            if(!frame?.dataset?.src) return '';
            try { return new URL(frame.dataset.src, location.origin).href; }
            catch(e) { return ''; }
        }

        function frameLooksBlank(frame){
            try {
                const doc = frame?.contentDocument;
                if(!doc?.body) return !frame?.src;
                return doc.body.childElementCount === 0;
            } catch(e){
                return false;
            }
        }

        function ensureFrameLoaded(frame){
            if(!frame?.dataset?.src) return;
            const target = frameTargetHref(frame);
            if(!target) return;
            const normalizedTarget = target.replace(/#.*$/, '');
            const current = frame.src ? frame.src.replace(/#.*$/, '') : '';
            if(!current || current !== normalizedTarget || frameLooksBlank(frame)){
                frame.src = frame.dataset.src;
            }
        }

        function preloadStudioPanelFrames(){
            STUDIO_PAGE_IDS.forEach((id, index) => {
                setTimeout(() => {
                    ensureFrameLoaded(document.getElementById('frame-' + id));
                }, index * 250);
            });
            ensureFrameLoaded(document.getElementById('frame-gallery'));
        }

        function preloadFullStageFrames(){
            ['gpt-chat', 'reverse', 'api-settings', 'comfyui-settings', 'runninghub-settings', 'system-prompt-settings'].forEach((id, index) => {
                setTimeout(() => {
                    ensureFrameLoaded(document.getElementById('frame-' + id));
                }, index * 300);
            });
        }

        function resetStudioFramesIfBuildChanged(){
            try {
                const prev = localStorage.getItem(STUDIO_BUILD_KEY);
                if(prev && prev !== STUDIO_BUILD){
                    document.querySelectorAll('#studio-shell iframe[data-src], #full-stage iframe[data-src]').forEach(frame => {
                        frame.removeAttribute('src');
                    });
                }
                localStorage.setItem(STUDIO_BUILD_KEY, STUDIO_BUILD);
            } catch(e){}
        }

        function updateMonitorVisibility() {
            const monitor = document.getElementById('nano-monitor');
            if(monitor) monitor.classList.add('is-hidden');
        }

        function navTriggerForPage(id){
            const nodes = document.querySelectorAll('.nav-item[onclick], .side-pill[onclick]');
            for(const node of nodes){
                const onclick = node.getAttribute('onclick') || '';
                const match = onclick.match(/switchUI\([^,]+,\s*['"]([^'"]+)['"]/);
                if(match && match[1] === id) return node;
            }
            return null;
        }

        function notifyGalleryRefresh(){
            try {
                new BroadcastChannel('studio-gallery').postMessage({ type: 'gallery-refresh' });
            } catch(e) {}
        }

        function switchUI(el, id, options = {}) {
            if(!PAGE_IDS.includes(id)) id = DEFAULT_PAGE_ID;
            document.querySelectorAll('.nav-item,.side-pill').forEach(n => n.classList.remove('active'));
            const trigger = el || navTriggerForPage(id);
            if(trigger) trigger.classList.add('active');

            const studioShell = document.getElementById('studio-shell');
            const fullStage = document.getElementById('full-stage');
            const gallery = document.getElementById('frame-gallery');
            const isStudio = STUDIO_PAGE_IDS.includes(id);

            if(studioShell) studioShell.classList.toggle('active', isStudio);
            if(fullStage) fullStage.classList.toggle('active', !isStudio);

            document.querySelectorAll('#studio-shell .studio-panels iframe').forEach(f => f.classList.remove('active'));
            document.querySelectorAll('#full-stage iframe').forEach(f => f.classList.remove('active'));

            if(isStudio){
                const panel = document.getElementById('frame-' + id);
                if(panel) panel.classList.add('active');
                if(gallery){
                    gallery.classList.add('active');
                    gallery.style.visibility = '';
                }
                ensureFrameLoaded(panel);
                ensureFrameLoaded(gallery);
                syncThemeToFrame(panel);
                syncLanguageToFrame(panel);
                syncThemeToFrame(gallery);
                syncLanguageToFrame(gallery);
                notifyGalleryRefresh();
                if(id === 'runninghub') refreshRunningHubPanel();
            } else {
                const target = document.getElementById('frame-' + id);
                if(target) target.classList.add('active');
                ensureFrameLoaded(target);
                syncThemeToFrame(target);
                syncLanguageToFrame(target);
            }

            if(!options.skipRemember) localStorage.setItem(ACTIVE_PAGE_KEY, id);
            updateMonitorVisibility();
        }

        function restoreActivePage() {
            try {
                const id = PAGE_IDS.includes(localStorage.getItem(ACTIVE_PAGE_KEY)) ? localStorage.getItem(ACTIVE_PAGE_KEY) : DEFAULT_PAGE_ID;
                switchUI(navTriggerForPage(id), id, { skipRemember:true });
            } finally {
                document.documentElement.classList.remove('studio-route-booting');
            }
        }
        document.addEventListener('DOMContentLoaded', () => {
            resetStudioFramesIfBuildChanged();
            initStudioPanelResize();
            restoreActivePage();
            preloadStudioPanelFrames();
            if(typeof requestIdleCallback === 'function'){
                requestIdleCallback(() => preloadFullStageFrames(), { timeout: 2500 });
            } else {
                setTimeout(preloadFullStageFrames, 1500);
            }
        }, { once:true });

        const STUDIO_PANEL_WIDTH_KEY = 'studio_panel_width';
        function getStudioPanelMaxWidth(){
            return Math.min(
                parseInt(getComputedStyle(document.documentElement).getPropertyValue('--studio-panel-max'), 10) || 500,
                Math.floor(window.innerWidth * 0.35)
            );
        }
        function getStudioPanelWidth(){
            const raw = getComputedStyle(document.documentElement).getPropertyValue('--studio-panel-width').trim();
            const parsed = parseInt(raw, 10);
            return Number.isFinite(parsed) ? parsed : 320;
        }
        function clampStudioPanelWidth(px){
            const min = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--studio-panel-min'), 10) || 280;
            return Math.round(Math.max(min, Math.min(getStudioPanelMaxWidth(), px)));
        }
        function setStudioPanelWidth(px, persist = true){
            const width = clampStudioPanelWidth(px);
            document.documentElement.style.setProperty('--studio-panel-width', `${width}px`);
            if(persist){
                try { localStorage.setItem(STUDIO_PANEL_WIDTH_KEY, String(width)); } catch(e){}
            }
            notifyStudioLayoutResize();
        }
        function notifyStudioLayoutResize(){
            document.querySelectorAll('#studio-shell iframe').forEach(frame => {
                try { frame.contentWindow?.postMessage({ type: 'studio-layout-resize', width: getStudioPanelWidth() }, '*'); } catch(e){}
            });
        }
        function initStudioPanelResize(){
            const handle = document.getElementById('studioPanelResizeHandle');
            const shell = document.getElementById('studio-shell');
            if(!handle || !shell) return;
            let saved = 320;
            try { saved = parseInt(localStorage.getItem(STUDIO_PANEL_WIDTH_KEY) || '320', 10); } catch(e){}
            setStudioPanelWidth(saved, false);
            let dragging = false;
            let startX = 0;
            let startWidth = 0;
            function onMove(e){
                if(!dragging) return;
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                setStudioPanelWidth(startWidth + (clientX - startX), false);
            }
            function onUp(){
                if(!dragging) return;
                dragging = false;
                shell.classList.remove('is-resizing-panel');
                document.body.style.cursor = '';
                document.body.style.userSelect = '';
                window.removeEventListener('mousemove', onMove);
                window.removeEventListener('mouseup', onUp);
                window.removeEventListener('touchmove', onMove);
                window.removeEventListener('touchend', onUp);
                setStudioPanelWidth(getStudioPanelWidth(), true);
            }
            handle.addEventListener('mousedown', e => {
                if(e.button !== 0) return;
                e.preventDefault();
                dragging = true;
                startX = e.clientX;
                startWidth = getStudioPanelWidth();
                shell.classList.add('is-resizing-panel');
                document.body.style.cursor = 'col-resize';
                document.body.style.userSelect = 'none';
                window.addEventListener('mousemove', onMove);
                window.addEventListener('mouseup', onUp);
            });
            handle.addEventListener('touchstart', e => {
                if(!e.touches?.length) return;
                e.preventDefault();
                dragging = true;
                startX = e.touches[0].clientX;
                startWidth = getStudioPanelWidth();
                shell.classList.add('is-resizing-panel');
                document.body.style.userSelect = 'none';
                window.addEventListener('touchmove', onMove, { passive: false });
                window.addEventListener('touchend', onUp);
            }, { passive: false });
            window.addEventListener('resize', () => setStudioPanelWidth(getStudioPanelWidth(), false));
        }

        async function syncStatus() {
            try {
                const res = await fetch(`/api/queue_status?client_id=${CID}`);
                const data = await res.json();
                const monitor = document.getElementById('nano-monitor');
                const queueVal = document.getElementById('queue-val');
                const logoDot = document.getElementById('logo-dot');
                const total = data.total || 0;
                const pos = data.position || 0;
                if (pos > 0) {
                    monitor.classList.add('is-busy');
                    queueVal.innerText = `${pos}/${total}`;
                    logoDot.style.backgroundColor = '#3b82f6';
                } else {
                    monitor.classList.remove('is-busy');
                    queueVal.innerText = total > 0 ? total : '0';
                    logoDot.style.backgroundColor = 'var(--text)';
                }
            } catch (e) { }
        }

        function getActiveMessageFrame() {
            const studioShell = document.getElementById('studio-shell');
            if(studioShell?.classList.contains('active')) {
                const panel = document.querySelector('#studio-shell .studio-panels iframe.active');
                if(panel?.contentWindow) return panel;
            }
            return document.querySelector('#full-stage iframe.active');
        }

        const host = window.location.host;
        if (host) {
            const protocol = location.protocol === 'https:' ? 'wss' : 'ws';
            const ws = new WebSocket(`${protocol}://${host}/ws/stats?client_id=${CID}`);
            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                if (data.type === 'stats') {
                    document.getElementById('online-val').innerText = data.online_count;
                } else if (data.type === 'cloud_status') {
                    const iframe = getActiveMessageFrame();
                    if (iframe && iframe.contentWindow) {
                        iframe.contentWindow.postMessage(data, '*');
                    }
                }
            };
            setInterval(syncStatus, 2000);
        }

        // --- 主题同步（仅浅色） ---

        function syncThemeToFrame(iframe) {
            try {
                if (iframe && iframe.contentWindow) {
                    iframe.contentWindow.postMessage({ type: 'studio-theme', theme: 'light' }, '*');
                }
            } catch (e) {}
        }

        function toggleLanguage() {
            if(!window.StudioI18n) return;
            window.StudioI18n.toggle();
            document.querySelectorAll('iframe').forEach(frame => syncLanguageToFrame(frame));
            if(window.lucide) lucide.createIcons();
        }

        function syncLanguageToFrame(frame) {
            if(!window.StudioI18n) return;
            try {
                frame.contentWindow?.postMessage({ type:'studio-lang', lang:window.StudioI18n.lang() }, '*');
            } catch(e) {}
        }

        function broadcastLanguage() {
            document.querySelectorAll('iframe').forEach(frame => {
                try {
                    frame.contentWindow?.postMessage({ type:'studio-lang', lang:window.StudioI18n.lang() }, '*');
                } catch(e) {}
            });
        }

        function broadcastProvidersChanged(payload) {
            document.querySelectorAll('iframe').forEach(frame => {
                try { frame.contentWindow?.postMessage(payload, '*'); } catch(e) {}
            });
        }

        function refreshRunningHubPanel(){
            const frame = document.getElementById('frame-runninghub');
            if(!frame) return;
            const send = () => {
                try { frame.contentWindow?.postMessage({ type: 'runninghub-changed' }, '*'); } catch(e) {}
            };
            ensureFrameLoaded(frame);
            send();
            frame.addEventListener('load', send, { once: true });
        }

        try {
            new BroadcastChannel('studio-api').onmessage = (e) => {
                if (e.data?.type === 'providers-changed') {
                    broadcastProvidersChanged(e.data);
                }
                if (e.data?.type === 'runninghub-changed') {
                    refreshRunningHubPanel();
                }
            };
        } catch(e) {}

        window.addEventListener('message', (e) => {
            if (e.data?.type === 'providers-changed' && e.source !== window) {
                broadcastProvidersChanged(e.data);
            }
            if (e.data?.type === 'runninghub-changed' && e.source !== window) {
                refreshRunningHubPanel();
            }
        });

        window.addEventListener('message', (e) => {
            if(e.data?.type === 'studio-apply-params' && e.data.item){
                applyStudioHistoryParams(e.data.item);
                return;
            }
            const page = e.data?.type === 'studio-navigate' ? e.data.page : '';
            if(!page || !PAGE_IDS.includes(page)) return;
            switchUI(navTriggerForPage(page), page);
        });

        let galleryCrossDrag = null;
        let galleryDropHandled = false;
        function getActiveStudioPanelFrame(){
            return document.querySelector('#studio-shell .studio-panels iframe.active');
        }
        function postGalleryDragMessage(payload){
            const gallery = document.getElementById('frame-gallery');
            try { gallery?.contentWindow?.postMessage(payload, '*'); } catch(e) {}
        }
        function forwardGalleryDragToPanel(type, e, extra = {}){
            const frame = getActiveStudioPanelFrame();
            if(!frame?.contentWindow || !galleryCrossDrag) return;
            const rect = frame.getBoundingClientRect();
            frame.contentWindow.postMessage({
                type,
                mediaKind: galleryCrossDrag.mediaKind,
                url: galleryCrossDrag.url,
                x: e.clientX - rect.left,
                y: e.clientY - rect.top,
                inPanel: e.clientX >= rect.left && e.clientX <= rect.right && e.clientY >= rect.top && e.clientY <= rect.bottom,
                ...extra
            }, '*');
        }
        window.addEventListener('message', (e) => {
            if(e.data?.type === 'studio-gallery-drag-start'){
                galleryDropHandled = false;
                galleryCrossDrag = {
                    mediaKind: e.data.mediaKind,
                    url: e.data.url,
                    key: e.data.key || ''
                };
            }
            if(e.data?.type === 'studio-gallery-drag-end'){
                galleryCrossDrag = null;
                galleryDropHandled = false;
                const frame = getActiveStudioPanelFrame();
                try { frame?.contentWindow?.postMessage({ type:'studio-gallery-drag-end' }, '*'); } catch(err) {}
            }
            if(e.data?.type === 'studio-gallery-drag-result'){
                postGalleryDragMessage({
                    type: e.data.accepted ? 'studio-gallery-drag-accepted' : 'studio-gallery-drag-rejected',
                    key: galleryCrossDrag?.key || ''
                });
            }
        });
        document.addEventListener('dragover', (e) => {
            if(!galleryCrossDrag) return;
            e.preventDefault();
            forwardGalleryDragToPanel('studio-gallery-drag-over', e);
        });
        document.addEventListener('drop', (e) => {
            if(!galleryCrossDrag || galleryDropHandled) return;
            e.preventDefault();
            galleryDropHandled = true;
            forwardGalleryDragToPanel('studio-gallery-drag-drop', e);
        });

        window.addEventListener('DOMContentLoaded', () => {
            if(window.StudioI18n) window.StudioI18n.apply();
            initStudioViewerHost();
            broadcastLanguage();
            if(window.lucide) lucide.createIcons();
        });

        // sync theme when iframe loads
        document.querySelectorAll('iframe').forEach(f => {
            f.addEventListener('load', () => {
                syncThemeToFrame(f);
                syncLanguageToFrame(f);
                if(window.lucide) lucide.createIcons();
            });
        });
    </script>
</body>

</html>
