    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;800&display=swap');
        :root { --accent:#ff4d94; --bg:#101010; --card:#1a1a1a; --easing:cubic-bezier(0.22,1,0.36,1); }
        html, body { height:100%; overflow:hidden; }
        body { background:var(--bg); font-family:'Inter',-apple-system,sans-serif; color:#f5f5f5; margin:0; }
        .container-box { max-width:1680px; margin:0 auto; padding:8px 14px 10px; height:100%; box-sizing:border-box; display:flex; flex-direction:column; overflow:hidden; }
        .page-main { flex:1; min-height:0; overflow:hidden; }
        body.board-pick-active .output-grid-cell img.draggable-output { cursor:pointer; }
        body.board-pick-active .output-grid-cell[data-ts]:hover { border-color:rgba(255,77,148,.55); box-shadow:0 0 0 2px rgba(255,77,148,.28); }
        body.board-pick-active .output-grid-cell .cell-actions { opacity:0 !important; pointer-events:none !important; }
        .output-grid-cell img.draggable-output { cursor:grab; user-select:none; -webkit-user-drag:element; }
        .output-grid-cell img.draggable-output:active { cursor:grabbing; }
        .empty-hint { padding:12px; border:1px dashed rgba(255,255,255,.12); font-size:11px; color:#737373; line-height:1.5; text-align:center; background:#313131; }
        .empty-hint a { color:#ff4d94; font-weight:700; text-decoration:underline; cursor:pointer; }
        .result-frame { background:#1a1a1a; border-radius:10px; border:1px solid rgba(255,255,255,.08); box-shadow:0 2px 16px rgba(0,0,0,.24); display:flex; flex-direction:column; min-height:0; flex:1; overflow:hidden; }
        .result-frame.has-outputs { justify-content:flex-start; }
        .output-toolbar { flex-shrink:0; display:flex; align-items:center; justify-content:flex-end; gap:10px; padding:0 2px; }
        .output-cols-slider { width:100%; max-width:140px; height:4px; accent-color:#ffffff; }
        .output-scroll-wrap { flex:1; min-height:0; overflow-y:auto; }
        .output-grid { display:grid; gap:12px; width:100%; padding:12px; align-content:start; }
        .output-grid-cell { position:relative; aspect-ratio:1; border-radius:6px; overflow:hidden; background:#141414; border:1px solid rgba(255,255,255,.06); }
        .output-grid-cell:hover { border-color:rgba(255,255,255,.1); background:#181818; }
        .output-grid-cell.is-pinned { box-shadow:none; }
        .output-grid-cell.is-favorite::before { content:''; position:absolute; top:8px; left:8px; width:7px; height:7px; border-radius:50%; background:#ffaa00; z-index:4; pointer-events:none; }
        .output-grid-cell img { width:100%; height:100%; object-fit:contain; padding:0; box-sizing:border-box; border-radius:6px; }
        .output-grid-cell .cell-actions { position:absolute; left:0; right:0; bottom:0; height:20%; min-height:36px; z-index:5; display:flex; align-items:center; justify-content:center; gap:6px; padding:0 8px 5px; opacity:0; transition:opacity .18s; pointer-events:none; background:linear-gradient(to top,rgba(26,26,26,.92),transparent); }
        .output-grid-cell:hover .cell-actions { opacity:1; pointer-events:auto; }
        .cell-action-btn { width:24px; height:24px; border:none; border-radius: 4px; background:rgba(49,49,49,.96); display:flex; align-items:center; justify-content:center; cursor:pointer; border:1px solid rgba(255,255,255,.08); color:#a3a3a3; padding:0; }
        .cell-action-btn i,
        .cell-action-btn svg { width:9px !important; height:9px !important; stroke-width:2.25; flex-shrink:0; }
        .cell-action-btn:hover, .cell-action-btn.active { background:#ff4d94; color:#fff; border-color:#ff4d94; }
        .cell-action-btn.fav-active { background:#ffaa00; color:#fff; border-color:#ffaa00; }
        .output-grid-cell.is-pending { background:#141414; border:1px solid rgba(255,255,255,.06); }
        .cell-pending { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; color:#94a3b8; }
        .pending-spin { width:28px; height:28px; border:2px solid #e5e7eb; border-top-color:#ff4d94; border-radius:50%; animation:spin .8s linear infinite; }
        @keyframes spin { to { transform:rotate(360deg); } }
        .gallery-lightbox { background:rgba(16,16,16,.96); backdrop-filter:blur(22px); }
        html.embed-panel { --bg:#161616; }
        html.embed-panel body { background:#161616 !important; }
        html.embed-panel .container-box { padding:0; max-width:none; height:100%; box-sizing:border-box; }
        html.embed-panel .studio-output-col { display:none !important; }
        html.embed-panel .studio-panel-col { grid-column:1 / -1 !important; max-width:none !important; }
        html.embed-panel .page-main { grid-template-columns:minmax(0,1fr) !important; }

<body class="mg-studio">
    <div class="container-box">
        <main class="page-main grid grid-cols-1 lg:grid-cols-12 gap-3 lg:gap-4 h-full">
            <div class="lg:col-span-3 options-panel h-full min-h-0 studio-panel-col">
                <section class="tool-panel">
                    <label class="block">
                        <div class="control-label mb-1"><span data-i18n="local.workflow">工作流</span></div>
                        <select id="workflowSelect" class="size-select" onchange="selectWorkflow(this.value)"></select>
                    </label>
                </section>
                <div id="dynamicPanel"></div>
                <button id="genBtn" onclick="submitGenerate()" class="glass-btn w-full py-3 text-white rounded-md font-bold flex items-center justify-center gap-2 shadow-lg" disabled>
                    <i data-lucide="crown" class="w-3.5 h-3.5 text-white"></i>
                    <span class="tracking-[0.2em] text-[11px] uppercase" data-i18n="local.generate">生成</span>
                </button>
            </div>
            <div class="lg:col-span-9 flex flex-col gap-2 min-h-0 h-full studio-output-col">
                <div class="output-toolbar shrink-0">
                    <span class="text-[10px] font-bold text-gray-400 uppercase tracking-widest" data-i18n="online.colsPerRow">每行</span>
                    <input type="range" id="outputColsSlider" class="output-cols-slider" min="1" max="6" value="2">
                    <span id="outputColsValue" class="text-[12px] font-black tabular-nums min-w-[1.25rem] text-center">2</span>
                </div>
                <div id="resultBox" class="result-frame relative">
                    <div id="placeholder" class="absolute inset-0 flex flex-col items-center justify-center text-center space-y-4 opacity-20 pointer-events-none">

    <div id="lightbox" onclick="if(event.target.id==='lightbox')closeLightbox()" class="hidden fixed inset-0 z-50 gallery-lightbox flex flex-col items-center justify-center p-8">
        <button onclick="closeLightbox()" class="absolute top-10 right-10 text-gray-400 hover:text-black"><i data-lucide="x" class="w-8 h-8"></i></button>
        <div class="w-full flex flex-col items-center" style="max-width:min(1280px,92vw)">
            <div id="lightboxFrame" class="relative bg-white rounded-lg overflow-hidden shadow-xl" style="max-height:70vh">
                <img id="lightboxImg" class="max-w-full max-h-[70vh] object-contain" alt="">
            </div>
            <div class="w-full mt-8 bg-white border border-gray-100 rounded-lg p-6 shadow-sm">
                <span class="text-[9px] font-black text-gray-300 uppercase tracking-widest block mb-2">Prompt</span>
                <p id="lightboxPrompt" class="text-gray-700 text-sm leading-relaxed max-h-24 overflow-y-auto"></p>
            </div>

    <script>
        lucide.createIcons();
        function tr(k){ return window.StudioI18n ? StudioI18n.t(k) : k; }
        function tf(k, vars){ return window.StudioI18n ? StudioI18n.tf(k, vars) : k; }
        function escapeHtml(s){ return String(s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
        function escapeAttr(s){ return escapeHtml(s); }

        const HISTORY_TYPE = 'local-comfy';
        const CLIENT_ID = localStorage.getItem('client_id') || (()=>{ const id=crypto.randomUUID?.()||String(Date.now()); localStorage.setItem('client_id',id); return id; })();
        const META_PIN = 'local_pinned', META_FAV = 'local_favorites', META_ORDER = 'local_display_order';

        let workflows = [], selectedWorkflow = '', currentWorkflow = null, currentConfig = { fields:[] };
        let fieldValues = {}, fieldImageUrls = {}, batchCount = 1, outputCols = 2;
        let boardPickFieldId = '';
        let allHistory = [], pendingJobs = [], historyLoading = false, currentLightboxData = null;
        let pinnedIds = [], favoriteIds = [], displayOrder = [];

        function fieldKind(f){
            if(f.type === 'image') return 'image';
            const key = `${f.input||''} ${f.name||''}`.toLowerCase();
            if(f.type === 'textarea' || /prompt|text|提示词|正向|负向/.test(key)) return 'prompt';
            return 'setting';
        }
        function isLinkedInput(v){ return Array.isArray(v) && v.length === 2 && typeof v[0] === 'string' && typeof v[1] === 'number'; }
        function guessType(value, inputName){
            const lc = (inputName||'').toLowerCase();
            if(typeof value === 'boolean') return 'boolean';
            if(typeof value === 'number') return /strength|cfg|denoise/.test(lc) ? 'slider' : 'number';
            if(typeof value === 'string'){
                if(/prompt|text|description|提示词/.test(lc) || value.length > 60) return 'textarea';
                if(/image|filename/.test(lc)) return 'image';
                return 'text';
            }
            return 'text';
        }
        function shouldAutoExpose(input, value){
            if(isLinkedInput(value)) return false;
            const lc = input.toLowerCase();
            if(/seed|noise_seed|uuid|unet_name|ckpt_name|vae_name|clip_name|lora_name|control_net/.test(lc)) return false;
            const type = guessType(value, input);
            if(type === 'textarea' || type === 'image') return true;
            if(/width|height|size|resolution|steps|cfg|denoise|strength|scale|batch/.test(lc)) return true;
            return type === 'number' || type === 'slider' || type === 'boolean';
        }
        function makeFieldId(){ return 'f_' + Math.random().toString(36).slice(2,9); }
        function inferFieldsFromWorkflow(workflow){
            const fields = [];
            Object.entries(workflow||{}).forEach(([nodeId, node]) => {
                Object.entries(node?.inputs||{}).forEach(([input, value]) => {
                    if(!shouldAutoExpose(input, value)) return;
                    const type = guessType(value, input);
                    const f = { id: makeFieldId(), node: nodeId, input, name: input, type, default: typeof value === 'object' ? null : value, options:[] };
                    if((type === 'slider' || type === 'number') && typeof value === 'number'){
                        f.min = 0; f.max = Math.max(value * 2, 10); f.step = value > 0 && value < 5 ? 0.1 : 1;
                    }
                    fields.push(f);
                });
            });
            return fields;
        }
        function effectiveFields(){
            const saved = currentConfig?.fields || [];
            if(saved.length) return saved;
            return inferFieldsFromWorkflow(currentWorkflow);
        }
        function isSizeField(f){
            const k = `${f.input} ${f.name}`.toLowerCase();
            return /width|height|尺寸|宽度|高度|resolution|分辨率|size/.test(k);
        }
        function findFieldByInput(name){
            return effectiveFields().find(f => String(f.input||'').toLowerCase() === name);
        }

        async function loadWorkflowList(){
            try {
                const data = await fetch('/api/workflows').then(r=>r.json());
                workflows = data.workflows || [];
                const sel = document.getElementById('workflowSelect');
                if(!workflows.length){
                    sel.innerHTML = `<option value="">${tr('local.noWorkflows')}</option>`;
                    document.getElementById('dynamicPanel').innerHTML = `<div class="empty-hint">${tr('local.noWorkflowsHint')}</div>`;
                    document.getElementById('genBtn').disabled = true;
                    return;
                }
                sel.innerHTML = workflows.map(w => `<option value="${escapeAttr(w.name)}" ${w.name===selectedWorkflow?'selected':''}>${escapeHtml(w.title)}</option>`).join('');
                if(!selectedWorkflow || !workflows.some(w => w.name === selectedWorkflow)) await selectWorkflow(workflows[0].name);
            } catch(e){ console.error(e); }
        }

        async function selectWorkflow(name){
            if(!name) return;
            selectedWorkflow = name;
            document.getElementById('workflowSelect').value = name;
            try {
                const data = await fetch(`/api/workflows/${encodeURIComponent(name)}`).then(r=>r.json());
                currentWorkflow = data.workflow;
                currentConfig = data.config || { title:'', fields:[] };
                if(!currentConfig.fields) currentConfig.fields = [];
                fieldValues = {}; fieldImageUrls = {};
                effectiveFields().forEach(f => {
                    if(f.default !== undefined && f.default !== null) fieldValues[f.id] = f.default;
                });
                renderDynamicPanel();
                document.getElementById('genBtn').disabled = false;
            } catch(e){
                alert(tr('local.loadFailed'));
                console.error(e);
            }
        }

        function renderDynamicPanel(){
            const panel = document.getElementById('dynamicPanel');
            const fields = effectiveFields();
            if(!fields.length){
                panel.innerHTML = `<div class="empty-hint">${tr('local.noFieldsHint')}</div>`;
                return;
            }
            const prompts = fields.filter(f => fieldKind(f) === 'prompt');
            const images = fields.filter(f => fieldKind(f) === 'image');
            const settings = fields.filter(f => fieldKind(f) === 'setting');
            const widthField = settings.find(f => String(f.input).toLowerCase() === 'width');
            const heightField = settings.find(f => String(f.input).toLowerCase() === 'height');
            const sizeFields = settings.filter(f => isSizeField(f) && f !== widthField && f !== heightField);
            const otherSettings = settings.filter(f => !isSizeField(f) && f !== widthField && f !== heightField);

            let html = '';
            if(prompts.length || images.length){
                html += `<section class="tool-panel">`;
                prompts.forEach(f => {
                    html += `<div>
                        <div class="control-label mb-1"><span>${escapeHtml(f.name || f.input)}</span></div>
                        <textarea class="nano-input w-full outline-none resize-none" rows="3" data-field-id="${escapeAttr(f.id)}" oninput="setFieldValue('${escapeAttr(f.id)}',this.value)">${escapeHtml(fieldValues[f.id] ?? '')}</textarea>
                    </div>`;
                });
                if(images.length){
                    html += `<div>
                        <div class="control-label mb-1"><span data-i18n="online.referenceImages">参考图片</span></div>
                        <div class="ref-grid">${images.map((f,i) => renderImageSlot(f, i)).join('')}</div>
                    </div>`;
                }
                html += `</section>`;
            }
            html += `<section class="tool-panel">
                <div>
                    <div class="control-label mb-1"><span data-i18n="online.batchCount">批次</span></div>
                    <div class="flex items-center gap-2">
                        <input type="range" id="batchSlider" class="batch-slider" min="1" max="4" value="${batchCount}" oninput="setBatchCount(this.value)">
                        <span id="batchValue" class="batch-value">${batchCount}</span>
                    </div>
                </div>`;
            if(widthField || heightField){
                html += `<div class="size-row">${widthField ? renderNumberInput(widthField) : ''}${heightField ? renderNumberInput(heightField) : ''}</div>`;
            }
            sizeFields.forEach(f => { html += renderSettingField(f); });
            otherSettings.forEach(f => { html += renderSettingField(f); });
            html += `</section>`;
            panel.innerHTML = html;
            bindWorkflowImageSlots();
            lucide.createIcons();
            updateBoardPickUI();
        }

        function renderImageSlot(f, index){
            const url = fieldImageUrls[f.id] || '';
            const label = String(index + 1).padStart(2, '0');
            const filled = !!url;
            return `<div class="upload-item group${filled ? ' has-image' : ''}${boardPickFieldId === f.id ? ' is-board-target' : ''}" data-image-field-id="${escapeAttr(f.id)}">
                <input type="file" accept="image/*" class="hidden">
                ${filled ? '' : '<i data-lucide="plus" class="w-5 h-5 text-[#737373] group-hover:text-[#ff4d94]"></i>'}
                <span class="ref-slot-label mt-2 uppercase">${label}</span>
                <img class="preview-img${filled ? '' : ' hidden'}" ${filled ? `src="${escapeAttr(url)}"` : ''} alt="" draggable="false">
                <button type="button" data-wf-board class="cell-action-btn ref-slot-btn ref-board-btn" title="${escapeAttr(tr('online.boardPickTitle'))}">board</button>
                <button type="button" data-wf-del class="cell-action-btn ref-slot-btn ref-del-btn" title="${escapeAttr(tr('online.delete') || 'Delete')}"><i data-lucide="trash-2"></i></button>
            </div>`;
        }
        function renderNumberInput(f){
            const v = fieldValues[f.id] ?? f.default ?? '';
            return `<label class="size-field">
                <div class="control-label mb-1"><span>${escapeHtml(f.name || f.input)}</span></div>
                <input class="size-select" type="number" data-field-id="${escapeAttr(f.id)}" value="${escapeAttr(v)}" oninput="setFieldValue('${escapeAttr(f.id)}', parseFloat(this.value)||0)">
            </label>`;
        }
        function renderSettingField(f){
            const v = fieldValues[f.id] ?? f.default ?? (f.type==='boolean'?false:(f.type==='number'||f.type==='slider'?0:''));
            const label = `<div class="control-label mb-1"><span>${escapeHtml(f.name || f.input)}</span></div>`;
            if(f.type === 'slider'){
                const min = f.min ?? 0, max = f.max ?? 10, step = f.step ?? 1;
                return `<div>${label}<div class="wf-slider-row" data-field-id="${escapeAttr(f.id)}"><input type="range" min="${min}" max="${max}" step="${step}" value="${escapeAttr(v)}" oninput="setFieldValue('${escapeAttr(f.id)}', parseFloat(this.value))"><span class="wf-slider-val">${v}</span></div></div>`;
            }
            if(f.type === 'dropdown'){
                const opts = (f.options||[]).map(o => `<option value="${escapeAttr(o)}" ${String(v)===String(o)?'selected':''}>${escapeHtml(o)}</option>`).join('');
                return `<label class="block">${label}<select class="size-select" onchange="setFieldValue('${escapeAttr(f.id)}', this.value)">${opts}</select></label>`;
            }
            if(f.type === 'boolean'){
                return `<label class="block flex items-center gap-2">${label}<input type="checkbox" ${v?'checked':''} onchange="setFieldValue('${escapeAttr(f.id)}', this.checked)"></label>`;
            }
            if(f.type === 'number'){
                return renderNumberInput(f);
            }
            return `<label class="block">${label}<input class="size-select" type="text" value="${escapeAttr(v)}" oninput="setFieldValue('${escapeAttr(f.id)}', this.value)"></label>`;
        }

        function setFieldValue(id, value){
            fieldValues[id] = value;
            const row = document.querySelector(`.wf-slider-row[data-field-id="${id}"]`);
            if(row) row.querySelector('.wf-slider-val').textContent = value;
        }
        function setBatchCount(n){
            batchCount = Math.min(4, Math.max(1, Number(n)||1));
            try { localStorage.setItem('local_batch_count', String(batchCount)); } catch(e){}
            const label = document.getElementById('batchValue');
            const slider = document.getElementById('batchSlider');
            if(label) label.textContent = batchCount;
            if(slider) slider.value = batchCount;
        }
        function loadBatchCount(){
            try { const s = parseInt(localStorage.getItem('local_batch_count')||'1',10); if(s>=1&&s<=4) batchCount = s; } catch(e){}
        }

        function normalizeImageUrl(url){
            const raw = String(url || '').trim();
            if(!raw) return '';
            try {
                if(/^https?:\/\//i.test(raw)){
                    const parsed = new URL(raw);
                    if(parsed.pathname.startsWith('/assets/') || parsed.pathname.startsWith('/output/')) return parsed.pathname;
                }
            } catch(e){}
            if(raw.startsWith('/assets/') || raw.startsWith('/output/')) return raw.split('?')[0];
            return raw;
        }
        function imageUrlFromSlotDrop(dataTransfer){
            if(!dataTransfer) return '';
            const custom = dataTransfer.getData('application/x-online-output-image');
            if(custom) return normalizeImageUrl(custom);
            const values = [
                dataTransfer.getData('text/uri-list') || '',
                dataTransfer.getData('text/plain') || ''
            ].join('\n').split(/\r?\n/).map(s => s.trim()).filter(Boolean);
            for(const value of values){
                const normalized = normalizeImageUrl(value);
                if(normalized.startsWith('/assets/') || normalized.startsWith('/output/')) return normalized;
            }
            return '';
        }
        function hasSlotDropData(dataTransfer){
            if(!dataTransfer) return false;
            const types = [...(dataTransfer.types || [])];
            if(types.includes('application/x-online-output-image')) return true;
            if(types.includes('Files') && [...(dataTransfer.items || [])].some(item => item.kind === 'file' && item.type.startsWith('image/'))) return true;
            return types.includes('text/uri-list') || types.includes('text/plain');
        }
        function setImageDragData(e, url){
            const normalized = normalizeImageUrl(url);
            if(!normalized) return;
            e.dataTransfer.setData('application/x-online-output-image', normalized);
            e.dataTransfer.setData('text/uri-list', normalized);
            e.dataTransfer.setData('text/plain', normalized);
        }
        function syncBoardPickWindow(){
            window.boardPickSlotId = boardPickFieldId;
        }
        function updateBoardPickUI(){
            document.body.classList.toggle('board-pick-active', !!boardPickFieldId);
            document.querySelectorAll('.upload-item.is-board-target').forEach(el => el.classList.remove('is-board-target'));
            if(boardPickFieldId){
                document.querySelector(`[data-image-field-id="${boardPickFieldId}"]`)?.classList.add('is-board-target');
            }
            document.querySelectorAll('#outputGrid .output-grid-cell img.draggable-output').forEach(img => {
                img.draggable = !boardPickFieldId;
            });
        }
        function cancelBoardPick(){
            if(!boardPickFieldId) return;
            boardPickFieldId = '';
            syncBoardPickWindow();
            updateBoardPickUI();
            if(window.StudioPanelBridge) StudioPanelBridge.notifyBoardPick('');
        }
        function startBoardPick(fieldId, ev){
            if(ev){ ev.preventDefault(); ev.stopPropagation(); }
            if(boardPickFieldId === fieldId){
                cancelBoardPick();
                return;
            }
            boardPickFieldId = fieldId;
            syncBoardPickWindow();
            updateBoardPickUI();
            if(window.StudioPanelBridge) StudioPanelBridge.notifyBoardPick(fieldId);
        }
        async function uploadWorkflowFile(file, fieldId){
            if(!file || !fieldId) return;
            const preview = URL.createObjectURL(file);
            if(fieldImageUrls[fieldId]) try { URL.revokeObjectURL(fieldImageUrls[fieldId]); } catch(e){}
            fieldImageUrls[fieldId] = preview;
            const form = new FormData();
            form.append('files', file);
            try {
                const data = await fetch('/api/upload', { method:'POST', body:form }).then(r=>r.json());
                fieldValues[fieldId] = data.files?.[0]?.comfy_name || file.name;
                const savedUrl = normalizeImageUrl(data.files?.[0]?.url || '');
                if(savedUrl){
                    if(fieldImageUrls[fieldId]?.startsWith('blob:')) try { URL.revokeObjectURL(fieldImageUrls[fieldId]); } catch(e){}
                    fieldImageUrls[fieldId] = savedUrl;
                }
                renderDynamicPanel();
            } catch(e){
                alert(tr('comfy.imageUploadFailed'));
                delete fieldValues[fieldId];
                delete fieldImageUrls[fieldId];
                renderDynamicPanel();
            }
        }
        async function assignWorkflowImageFromUrl(url, fieldId){
            const normalized = normalizeImageUrl(url);
            if(!normalized || !fieldId) return;
            fieldImageUrls[fieldId] = normalized;
            try {
                const resp = await fetch(normalized);
                if(!resp.ok) throw new Error('fetch failed');
                const blob = await resp.blob();
                const name = normalized.split('/').pop() || 'image.png';
                const file = new File([blob], name, { type: blob.type || 'image/png' });
                await uploadWorkflowFile(file, fieldId);
            } catch(e){
                alert(tr('comfy.imageUploadFailed'));
                delete fieldValues[fieldId];
                delete fieldImageUrls[fieldId];
                renderDynamicPanel();
            }
            cancelBoardPick();
        }
        async function handleImageUrl(url, fieldId){
            await assignWorkflowImageFromUrl(url, fieldId);
        }
        function bindWorkflowImageSlots(){
            document.querySelectorAll('[data-image-field-id]').forEach(cell => {
                const fieldId = cell.dataset.imageFieldId;
                const input = cell.querySelector('input[type="file"]');
                const delBtn = cell.querySelector('[data-wf-del]');
                const boardBtn = cell.querySelector('[data-wf-board]');
                cell.onclick = e => {
                    if(e.target.closest('[data-wf-del],[data-wf-board]')) return;
                    if(!fieldValues[fieldId]) input?.click();
                };
                input.onchange = () => {
                    const file = input.files?.[0];
                    if(file) uploadWorkflowFile(file, fieldId);
                    input.value = '';
                };
                delBtn?.addEventListener('click', e => clearWorkflowImage(fieldId, e));
                boardBtn?.addEventListener('click', e => startBoardPick(fieldId, e));
                cell.ondragover = e => {
                    if(!hasSlotDropData(e.dataTransfer)) return;
                    e.preventDefault();
                    e.dataTransfer.dropEffect = 'copy';
                    cell.classList.add('drag-over');
                };
                cell.ondragleave = e => {
                    if(e.currentTarget.contains(e.relatedTarget)) return;
                    cell.classList.remove('drag-over');
                };
                cell.ondrop = e => {
                    e.preventDefault();
                    e.stopPropagation();
                    cell.classList.remove('drag-over');
                    const file = e.dataTransfer.files?.[0];
                    if(file && file.type.startsWith('image/')){
                        uploadWorkflowFile(file, fieldId);
                        return;
                    }
                    const dropUrl = imageUrlFromSlotDrop(e.dataTransfer);
                    if(dropUrl) assignWorkflowImageFromUrl(dropUrl, fieldId);
                };
            });
        }
        function pickWorkflowImage(fieldId){
            document.querySelector(`[data-image-field-id="${fieldId}"] input[type="file"]`)?.click();
        }
        function clearWorkflowImage(fieldId, ev){
            ev?.stopPropagation();
            delete fieldValues[fieldId];
            if(fieldImageUrls[fieldId]?.startsWith('blob:')) try { URL.revokeObjectURL(fieldImageUrls[fieldId]); } catch(e){}
            delete fieldImageUrls[fieldId];
            if(boardPickFieldId === fieldId) cancelBoardPick();
            renderDynamicPanel();
        }

        function collectRunFields(){
            const out = { ...fieldValues };
            effectiveFields().forEach(f => {
                if(f.type === 'number' || f.type === 'slider'){
                    const v = out[f.id];
                    if(v !== undefined && v !== '') out[f.id] = Number(v);
                }
            });
            return out;
        }
        function collectPrimaryPrompt(){
            for(const f of effectiveFields().filter(x => fieldKind(x) === 'prompt')){
                const v = String(fieldValues[f.id] ?? '').trim();
                if(v) return v;
            }
            return '';
        }
        function collectReferenceImages(){
            return effectiveFields()
                .filter(f => fieldKind(f) === 'image')
                .map(f => {
                    const url = normalizeImageUrl(fieldImageUrls[f.id] || '');
                    if(!url || url.startsWith('blob:')) return null;
                    return {
                        url,
                        name: String(fieldValues[f.id] || f.name || f.input || ''),
                        role: '',
                    };
                })
                .filter(Boolean);
        }
        function validateBeforeRun(){
            const prompts = effectiveFields().filter(f => fieldKind(f) === 'prompt');
            for(const f of prompts){
                const v = String(fieldValues[f.id] ?? '').trim();
                if(!v){ alert(tr('local.promptRequired')); return false; }
            }
            const images = effectiveFields().filter(f => fieldKind(f) === 'image');
            for(const f of images){
                if(!fieldValues[f.id]){ alert(tr('local.imageRequired')); return false; }
            }
            return true;
        }

        async function runGenerateJob(jobId){
            try {
                const res = await fetch(`/api/workflows/${encodeURIComponent(selectedWorkflow)}/run`, {
                    method:'POST', headers:{'Content-Type':'application/json'},
                    body: JSON.stringify({
                        fields: collectRunFields(),
                        config: { ...currentConfig, fields: effectiveFields() },
                        client_id: CLIENT_ID,
                        history_type: HISTORY_TYPE,
                        reference_images: collectReferenceImages(),
                        prompt: collectPrimaryPrompt(),
                    })
                });
                const data = await res.json();
                if(!res.ok || data.error) throw new Error(data.error || data.detail || tr('local.generateFailed'));
                if(data.images?.length) upsertHistoryItem(data);
                pendingJobs = pendingJobs.filter(j => j.id !== jobId);
                if(window.deletePendingJobOnServer) deletePendingJobOnServer(jobId);
                renderOutputGrid();
            } catch(err){
                const job = pendingJobs.find(j => j.id === jobId);
                if(job) job.error = err.message || 'Failed';
                renderOutputGrid();
                setTimeout(() => {
                    pendingJobs = pendingJobs.filter(j => j.id !== jobId);
                    if(window.deletePendingJobOnServer) deletePendingJobOnServer(jobId);
                    renderOutputGrid();
                }, 2800);
            }
        }
        async function submitGenerate(){
            if(!selectedWorkflow || !validateBeforeRun()) return;
            const placeholder = document.getElementById('placeholder');
            placeholder?.classList.add('hidden');
            const promptText = collectPrimaryPrompt() || selectedWorkflow || tr('local.generate');
            const jobs = [];
            for(let i=0; i<batchCount; i++){
                const jobId = `pending_${Date.now()}_${i}`;
                const jobObj = { id: jobId, prompt: promptText, mediaKind: 'image', batchIndex: batchCount>1?i+1:0, batchTotal: batchCount };
                pendingJobs.unshift(jobObj);
                if(window.registerPendingJobOnServer) registerPendingJobOnServer(jobObj);
                jobs.push(runGenerateJob(jobId));
            }
            renderOutputGrid();
            await Promise.allSettled(jobs);
        }

        // —— output grid (same pattern as online.html) ——
        function historyKey(item){ return String(item?.timestamp ?? ''); }
        function loadMeta(){
            try {
                pinnedIds = JSON.parse(localStorage.getItem(META_PIN)||'[]').map(String);
                favoriteIds = JSON.parse(localStorage.getItem(META_FAV)||'[]').map(String);
                displayOrder = JSON.parse(localStorage.getItem(META_ORDER)||'[]').map(String);
            } catch(e){ pinnedIds=[]; favoriteIds=[]; displayOrder=[]; }
        }
        function saveMeta(){
            try {
                localStorage.setItem(META_PIN, JSON.stringify(pinnedIds));
                localStorage.setItem(META_FAV, JSON.stringify(favoriteIds));
                localStorage.setItem(META_ORDER, JSON.stringify(displayOrder));
            } catch(e){}
        }
        function syncDisplayOrder(){
            const keys = new Set(allHistory.map(historyKey));
            displayOrder = displayOrder.filter(id => keys.has(id));
            allHistory.forEach(item => { const k = historyKey(item); if(k && !displayOrder.includes(k)) displayOrder.unshift(k); });
            saveMeta();
        }
        function sortedHistory(){
            syncDisplayOrder();
            const pinSet = new Set(pinnedIds);
            const pinned = displayOrder.filter(id => pinSet.has(id)).map(id => allHistory.find(h => historyKey(h)===id)).filter(Boolean);
            const rest = displayOrder.filter(id => !pinSet.has(id)).map(id => allHistory.find(h => historyKey(h)===id)).filter(Boolean);
            return [...pinned, ...rest];
        }
        function upsertHistoryItem(item){
            if(!item?.images?.[0]) return;
            const key = historyKey(item);
            const idx = allHistory.findIndex(h => historyKey(h) === key);
            if(idx >= 0) allHistory[idx] = item; else allHistory.unshift(item);
            if(key && !displayOrder.includes(key)) displayOrder.unshift(key);
            saveMeta();
        }
        function renderOutputGrid(){
            const grid = document.getElementById('outputGrid');
            const box = document.getElementById('resultBox');
            const placeholder = document.getElementById('placeholder');
            const items = sortedHistory();
            const hasContent = items.length || pendingJobs.length;
            if(!hasContent){
                grid.classList.add('hidden'); grid.innerHTML = '';
                box.classList.remove('has-outputs');
                placeholder.classList.remove('hidden');
                return;
            }
            placeholder.classList.add('hidden');
            box.classList.add('has-outputs');
            grid.classList.remove('hidden');
            grid.style.gridTemplateColumns = `repeat(${outputCols}, minmax(0,1fr))`;
            grid.innerHTML = pendingJobs.map(j => `<div class="output-grid-cell is-pending"><div class="cell-pending">${j.error?`<p>${escapeHtml(j.error)}</p>`:`<div class="pending-spin"></div><p>${tr('online.generating')}</p>`}</div></div>`).join('')
                + items.map(d => {
                    const key = historyKey(d), pinned = pinnedIds.includes(key), fav = favoriteIds.includes(key);
                    const imgUrl = d.images[0];
                    return `<div class="output-grid-cell${pinned?' is-pinned':''}${fav?' is-favorite':''}" data-ts="${escapeHtml(key)}" data-img-url="${escapeAttr(imgUrl)}">
                        <img src="${escapeHtml(imgUrl)}" alt="" class="draggable-output" draggable="true" loading="lazy">
                        <div class="cell-actions">
                            <button type="button" class="cell-action-btn${pinned?' active':''}" onclick="togglePin('${escapeHtml(key)}',event)"><i data-lucide="arrow-up-to-line"></i></button>
                            <button type="button" class="cell-action-btn${fav?' fav-active active':''}" onclick="toggleFavorite('${escapeHtml(key)}',event)"><i data-lucide="heart"></i></button>
                            <button type="button" class="cell-action-btn" onclick="applyRecordParams(historyItem('${escapeHtml(key)}'),event)"><i data-lucide="clipboard-copy"></i></button>
                            <a href="${escapeHtml(imgUrl)}" download class="cell-action-btn" onclick="event.stopPropagation()"><i data-lucide="download"></i></a>
                            <button type="button" class="cell-action-btn" onclick="deleteHistoryItem('${escapeHtml(key)}',event)"><i data-lucide="trash-2"></i></button>
                        </div></div>`;
                }).join('');
            bindOutputGridCells(items);
            lucide.createIcons();
            updateBoardPickUI();
        }
        function bindOutputGridCells(items){
            const itemMap = new Map(items.map(item => [historyKey(item), item]));
            document.querySelectorAll('#outputGrid .output-grid-cell[data-ts]').forEach(cell => {
                const data = itemMap.get(cell.dataset.ts);
                if(!data?.images?.[0]) return;
                const img = cell.querySelector('img.draggable-output');
                const url = data.images[0];
                if(img){
                    img.draggable = !boardPickFieldId;
                    img.ondragstart = e => {
                        if(boardPickFieldId) { e.preventDefault(); return; }
                        e.stopPropagation();
                        img.dataset.dragging = '1';
                        setImageDragData(e, url);
                        e.dataTransfer.effectAllowed = 'copy';
                    };
                    img.ondragend = () => { delete img.dataset.dragging; };
                }
                cell.onclick = e => {
                    if(img?.dataset.dragging) return;
                    if(boardPickFieldId && !e.target.closest('.cell-actions')){
                        handleImageUrl(url, boardPickFieldId);
                        return;
                    }
                    if(!e.target.closest('.cell-actions')) openLightbox(data);
                };
            });
        }
        function historyItem(key){ return allHistory.find(h => historyKey(h) === key); }
        function togglePin(key, ev){ ev?.stopPropagation(); pinnedIds = pinnedIds.includes(key) ? pinnedIds.filter(x=>x!==key) : [...pinnedIds,key]; saveMeta(); renderOutputGrid(); }
        function toggleFavorite(key, ev){ ev?.stopPropagation(); favoriteIds = favoriteIds.includes(key) ? favoriteIds.filter(x=>x!==key) : [key,...favoriteIds]; saveMeta(); renderOutputGrid(); }
        async function deleteHistoryItem(key, ev){
            ev?.stopPropagation();
            if(!confirm(tr('online.deleteConfirm'))) return;
            const item = historyItem(key); if(!item) return;
            await fetch('/api/history/delete', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({timestamp:item.timestamp}) });
            allHistory = allHistory.filter(h => historyKey(h) !== key);
            pinnedIds = pinnedIds.filter(x => x !== key); favoriteIds = favoriteIds.filter(x => x !== key); displayOrder = displayOrder.filter(x => x !== key);
            saveMeta(); renderOutputGrid();
        }
        async function applyRecordParams(data, ev){
            ev?.stopPropagation();
            if(!data) return;
            const wf = data.workflow_json || data.params?.workflow;
            if(wf && workflows.some(w => w.name === wf)) await selectWorkflow(wf);
            const saved = data.params || {};
            Object.entries(saved).forEach(([nodeId, inputs]) => {
                if(typeof inputs !== 'object' || Array.isArray(inputs)) return;
                Object.entries(inputs).forEach(([input, val]) => {
                    const f = effectiveFields().find(x => x.node === nodeId && x.input === input);
                    if(f) fieldValues[f.id] = val;
                });
            });
            const imageFields = effectiveFields().filter(f => fieldKind(f) === 'image');
            const refs = Array.isArray(saved.reference_images) ? saved.reference_images : [];
            imageFields.forEach((f, i) => {
                const ref = refs[i];
                if(ref?.url) fieldImageUrls[f.id] = normalizeImageUrl(ref.url);
            });
            renderDynamicPanel();
        }
        async function loadAllHistory(){
            if(historyLoading) return; historyLoading = true;
            try {
                allHistory = await fetch(`/api/history?type=${HISTORY_TYPE}`).then(r=>r.json());
                if(!Array.isArray(allHistory)) allHistory = [];
                syncDisplayOrder(); renderOutputGrid();
            } finally { historyLoading = false; }
        }
        function setOutputCols(n){
            outputCols = Math.min(6, Math.max(1, Number(n)||2));
            try { localStorage.setItem('local_output_cols', String(outputCols)); } catch(e){}
            document.getElementById('outputColsValue').textContent = outputCols;
            document.getElementById('outputColsSlider').value = outputCols;
            renderOutputGrid();
        }
        function loadOutputCols(){
            try { const s = parseInt(localStorage.getItem('local_output_cols')||'2',10); if(s>=1&&s<=6) outputCols = s; } catch(e){}
        }
        function openLightbox(data){
            currentLightboxData = data;
            document.getElementById('lightboxImg').src = data.images[0];
            document.getElementById('lightboxPrompt').textContent = data.prompt || '';
            document.getElementById('lightbox').classList.replace('hidden','flex');
        }
        function closeLightbox(){ document.getElementById('lightbox').classList.replace('flex','hidden'); }

        window.handleImageUrl = handleImageUrl;
        window.cancelBoardPick = cancelBoardPick;

        window.addEventListener('message', e => { if(e.data?.type === 'studio-lang') window.StudioI18n?.set(e.data.lang); });
        window.addEventListener('keydown', e => { if(e.key === 'Escape') cancelBoardPick(); });
        try {
            new BroadcastChannel('studio-api').onmessage = e => { if(e.data?.type === 'workflows-changed') loadWorkflowList(); };
        } catch(e){}

        const socket = new WebSocket(`${location.protocol==='https:'?'wss:':'ws:'}//${location.host}/ws/stats?client_id=${encodeURIComponent(CLIENT_ID)}`);
        socket.onmessage = e => {
            try {
                const msg = JSON.parse(e.data);
                if(msg.type === 'new_image' && msg.data?.type === HISTORY_TYPE && msg.data?.images?.length){
                    upsertHistoryItem(msg.data);
                    renderOutputGrid();
                }
            } catch(err){}
        };

        window.onload = async () => {
            if(window.StudioI18n) document.title = tr('local.title');
            loadMeta(); loadBatchCount(); loadOutputCols();
            setOutputCols(outputCols);
            document.getElementById('outputColsSlider').oninput = e => setOutputCols(e.target.value);
            await loadWorkflowList();
            await loadAllHistory();
            if(window.StudioPanelBridge){
                const bridge = StudioPanelBridge;
                renderOutputGrid = function(){
                    bridge.notifyPending(pendingJobs);
                    bridge.notifyRefresh();
                };
                loadAllHistory = async function(){
                    bridge.notifyRefresh();
                };
                upsertHistoryItem = function(item){
                    if(!item?.images?.[0]) return;
                    bridge.notifyAddItem(item);
                };
            }
        };
    </script>
</body>
